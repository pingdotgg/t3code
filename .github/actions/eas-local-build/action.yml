name: EAS local build
description: Installs the toolchain and mobile dependencies, then runs `eas build --local` on this runner.

inputs:
  platform:
    description: android or ios
    required: true
  profile:
    description: eas.json build profile
    required: true
  environment:
    description: EAS environment to pull, preview or production
    required: true
  expo-token:
    description: Expo token for that environment
    required: true
  output:
    description: Path the build artifact is written to
    required: true
  cache:
    description: "false for untrusted code: no sticky disk and no EAS cache, so nothing it writes reaches trusted builds"
    default: "true"
  sourcemaps-r2:
    description: R2 credentials for the eas-build-on-success source map upload; EAS secrets don't reach local builds
    default: ""

runs:
  using: composite
  steps:
    - name: Prepare Android build cache
      if: inputs.platform == 'android' && inputs.cache == 'true'
      shell: bash
      env:
        CACHE_NAME: ${{ inputs.environment == 'production' && 'store' || 'preview' }}
      run: |
        cache="$HOME/.cache/t3-android-$CACHE_NAME"
        {
          echo "GRADLE_USER_HOME=$cache/gradle"
          echo "CCACHE_DIR=$cache/ccache"
          echo "CCACHE_MAXSIZE=5G"
          # Gradle installs the NDK fresh each run, so key on the compiler's version, not its mtime.
          echo "CCACHE_COMPILERCHECK=%compiler% -v"
          echo "pnpm_config_store_dir=$cache/pnpm-store"
          # eas build --local copies the project here. A fixed path keeps
          # ccache keys stable, and the same disk as the store lets pnpm hardlink.
          echo "EAS_LOCAL_BUILD_WORKINGDIR=$cache/eas-build"
          echo "CCACHE_BASEDIR=$cache/eas-build"
          # CMake (3.17+) reads these, and AGP passes Gradle's environment through.
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
        } >> "$GITHUB_ENV"

    - name: Mount Android build cache
      if: inputs.platform == 'android' && inputs.cache == 'true'
      uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
      with:
        key: ${{ github.repository }}-android-${{ inputs.environment == 'production' && 'store' || 'preview' }}-build
        path: ~/.cache/t3-android-${{ inputs.environment == 'production' && 'store' || 'preview' }}

    - name: Configure Gradle and ccache
      if: inputs.platform == 'android' && inputs.cache == 'true'
      shell: bash
      run: |
        mkdir -p "$GRADLE_USER_HOME" "$CCACHE_DIR"
        rm -rf "$EAS_LOCAL_BUILD_WORKINGDIR"
        # No daemon: nothing should hold the sticky disk open when it is committed.
        printf 'org.gradle.caching=true\norg.gradle.daemon=false\n' > "$GRADLE_USER_HOME/gradle.properties"
        sudo sed -i 's|http://|https://|g' /etc/apt/blacksmith-ubuntu-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources
        sudo apt-get update -qq && sudo apt-get install -y -qq ccache
        ccache --zero-stats

    # Matches the EAS build image in eas.json.
    - name: Select Xcode 27.1
      if: inputs.platform == 'ios'
      shell: bash
      run: |
        xcode=/Applications/Xcode_27.1.app
        if [ ! -d "$xcode" ]; then
          ls -d /Applications/Xcode*.app
          echo "::error::Xcode 27.1 is not on this runner."
          exit 1
        fi
        sudo xcode-select -s "$xcode/Contents/Developer"
        xcodebuild -version
        echo "- Xcode: \`$(basename "$xcode")\`" >> "$GITHUB_STEP_SUMMARY"

    # EAS's credentials step fails to import the distribution certificate without it.
    - name: Install Apple WWDR G3 intermediate
      if: inputs.platform == 'ios'
      shell: bash
      run: |
        curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
        sudo security add-certificates -k /Library/Keychains/System.keychain "$RUNNER_TEMP/AppleWWDRCAG3.cer" || true
        security find-certificate -c "Apple Worldwide Developer Relations" /Library/Keychains/System.keychain | grep labl

    - name: Setup Node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version-file: package.json

    - name: Enable corepack
      shell: bash
      run: |
        npm install --global corepack@latest
        corepack enable
        pnpm --version

    # EAS commands load app.config.ts, whose plugins must resolve. Keep install
    # scripts: some download native assets that the build's fingerprint check hashes.
    - name: Install mobile dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline --filter=@t3tools/mobile...

    - name: Setup Java
      if: inputs.platform == 'android'
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: temurin
        java-version: 17

    - name: Setup EAS
      uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8.2.1
      with:
        eas-version: latest
        eas-cache: ${{ inputs.cache }}
        token: ${{ inputs.expo-token }}
        # npm, not pnpm: this only installs eas-cli into the action's own
        # tool dir, and pnpm 11 hard-fails that install on dtrace-provider's
        # ignored build script (no allowBuilds config outside the repo).
        packager: npm

    - name: Build tools
      if: inputs.platform == 'ios'
      shell: bash
      run: |
        command -v pod || sudo gem install cocoapods --no-document
        command -v fastlane || brew install fastlane
        pod --version
        fastlane --version | tail -1

    # EAS commands skip dotenv, and the Android fingerprint hashes this file.
    - name: Pull ${{ inputs.environment }} environment variables
      shell: bash
      working-directory: apps/mobile
      env:
        EXPO_TOKEN: ${{ inputs.expo-token }}
        ENVIRONMENT: ${{ inputs.environment }}
        PLATFORM: ${{ inputs.platform }}
      run: |
        eas env:pull "$ENVIRONMENT" --non-interactive
        node --input-type=module <<'NODE'
        import { appendFileSync, readFileSync } from "node:fs";
        import { parseEnv } from "node:util";
        const env = parseEnv(readFileSync(".env.local", "utf8"));
        const googleServicesFile = env.T3CODE_ANDROID_GOOGLE_SERVICES_FILE;
        if (!googleServicesFile && process.env.PLATFORM === "android") {
          throw new Error(`T3CODE_ANDROID_GOOGLE_SERVICES_FILE is missing from the ${process.env.ENVIRONMENT} environment`);
        }
        if (googleServicesFile) {
          appendFileSync(process.env.GITHUB_ENV, `T3CODE_ANDROID_GOOGLE_SERVICES_FILE=${googleServicesFile}\n`);
        }
        NODE

    - name: Build
      shell: bash
      working-directory: apps/mobile
      env:
        EXPO_TOKEN: ${{ inputs.expo-token }}
        MOBILE_SOURCEMAPS_R2: ${{ inputs.sourcemaps-r2 }}
        PLATFORM: ${{ inputs.platform }}
        PROFILE: ${{ inputs.profile }}
        OUTPUT: ${{ inputs.output }}
      run: |
        if [ "$PLATFORM" = "ios" ]; then
          # A real path: /var -> /private/var symlinks break the expo-widgets bundle step.
          export EAS_LOCAL_BUILD_WORKINGDIR="$RUNNER_TEMP/eas-build"
        fi
        eas build --local --platform "$PLATFORM" --profile "$PROFILE" --non-interactive --output "$OUTPUT"

    - name: Report ccache
      if: inputs.platform == 'android' && inputs.cache == 'true'
      shell: bash
      run: |
        {
          echo '```'
          ccache --show-stats
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
