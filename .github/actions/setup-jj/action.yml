name: Setup Jujutsu
description: Install the jj CLI from the official jj-vcs release artifacts.

inputs:
  version:
    description: Jujutsu release tag to install.
    required: false
    default: v0.46.0

runs:
  using: composite
  steps:
    - name: Install jj
      shell: bash
      env:
        JJ_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        case "${JJ_VERSION}-${RUNNER_OS}-${RUNNER_ARCH}" in
          v0.46.0-Linux-X64)
            asset="jj-${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
            sha256="fce0271158e665ceb82dc66c5eb95b1728649094e9133074f3b5baece345fc08"
            ;;
          *)
            echo "No pinned jj checksum for ${JJ_VERSION}-${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 1
            ;;
        esac

        install_dir="${RUNNER_TEMP}/jj-${JJ_VERSION}"
        mkdir -p "$install_dir"

        curl -fsSL \
          "https://github.com/jj-vcs/jj/releases/download/${JJ_VERSION}/${asset}" \
          -o "${RUNNER_TEMP}/${asset}"
        echo "${sha256}  ${RUNNER_TEMP}/${asset}" | sha256sum --check --status
        tar -xzf "${RUNNER_TEMP}/${asset}" -C "$install_dir"

        chmod +x "${install_dir}/jj"
        echo "$install_dir" >> "$GITHUB_PATH"
        "${install_dir}/jj" --version
