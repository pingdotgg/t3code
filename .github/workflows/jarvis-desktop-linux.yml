name: Jarvis Linux desktop

on:
  workflow_call:
    inputs:
      version:
        description: "Jarvis version to package (for example 1.2.3)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Jarvis version to package (for example 1.2.3)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jarvis-desktop-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Jarvis Linux desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.package.outputs.artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - id: version
        name: Verify package and requested version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./apps/desktop/package.json').version")"
          requested_version="${DISPATCH_VERSION#v}"
          if [[ "$requested_version" != "$package_version" ]]; then
            echo "Requested version '$requested_version' does not match apps/desktop/package.json version '$package_version'." >&2
            exit 1
          fi
          if [[ ! "$requested_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Jarvis version: $requested_version" >&2
            exit 1
          fi
          echo "version=$requested_version" >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=@t3tools/jarvis-native-voice...
              - --filter=t3...
              - --filter=@t3tools/scripts...

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Run focused Jarvis desktop tests
        run: |
          vp test run \
            apps/desktop/src/app/DesktopAppIdentity.test.ts \
            apps/desktop/src/app/DesktopLifecycle.test.ts \
            apps/desktop/src/shell/DesktopJarvisShell.test.ts \
            apps/desktop/src/voice/DesktopVoiceWorkerProtocol.test.ts \
            packages/jarvis-native-voice/src/pocket-lifecycle.test.ts \
            packages/jarvis-native-voice/src/pocket-onset.test.ts \
            packages/jarvis-native-voice/src/pocket-config.test.ts \
            packages/jarvis-native-voice/src/pocket-worker-client.test.ts \
            packages/jarvis-native-voice/src/native-speech.test.ts \
            scripts/jarvis-linux-startup-gate.test.ts
          vp run --filter @t3tools/desktop typecheck

      - name: Install Linux packaging and startup-smoke dependencies
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 gnome-keyring inotify-tools libsecret-1-0 libasound2-dev libx11-dev libxrandr-dev libxtst-dev libxt-dev openbox x11-utils xvfb imagemagick

      - name: Build Pocket speech runtime
        run: node packages/jarvis-native-voice/scripts/build-pocket-runtime.mjs

      - name: Prepare native Linux voice resources
        run: vp run --filter @t3tools/jarvis-native-voice prepare:voice

      - id: package
        name: Build Linux AppImage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf release
          node scripts/build-desktop-artifact.ts \
            --platform linux \
            --target AppImage \
            --arch x64 \
            --build-version "$VERSION" \
            --voice-resources-dir packages/jarvis-native-voice/resources \
            --output-dir release
          mapfile -t appimages < <(find release -maxdepth 1 -type f -name 'Jarvis-*-x86_64.AppImage' -print)
          if [[ "${#appimages[@]}" -ne 1 ]]; then
            echo "Expected exactly one Linux Jarvis AppImage, found ${#appimages[@]}." >&2
            printf '%s\n' "${appimages[@]}" >&2
            exit 1
          fi
          artifact="${appimages[0]}"
          expected="release/Jarvis-${VERSION}-x86_64.AppImage"
          if [[ "$artifact" != "$expected" ]]; then
            echo "Unexpected AppImage name '$artifact'; expected '$expected'." >&2
            exit 1
          fi
          chmod +x "$artifact"
          checksum="$artifact.sha256"
          provenance="$artifact.provenance.json"
          (cd release && sha256sum "$(basename "$artifact")" > "$(basename "$checksum")")
          artifact_sha256="$(sha256sum "$artifact" | awk '{print $1}')"
          node - "$provenance" "$VERSION" "$GITHUB_SHA" "$(basename "$artifact")" "$artifact_sha256" <<'NODE'
          const fs = require("node:fs");
          const [output, version, sourceCommit, artifact, artifactSha256] = process.argv.slice(2);
          fs.writeFileSync(output, `${JSON.stringify({
            format: 1,
            product: "Jarvis",
            version,
            platform: "linux",
            arch: "x64",
            artifactName: artifact,
            artifactSha256,
            sourceCommit,
          }, null, 2)}\n`);
          NODE
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Smoke extracted AppImage identity
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          artifact="release/Jarvis-${VERSION}-x86_64.AppImage"
          checksum="$artifact.sha256"
          provenance="$artifact.provenance.json"
          (cd release && sha256sum --check "$(basename "$checksum")")
          node - "$provenance" "$VERSION" "$GITHUB_SHA" "$(basename "$artifact")" "$(sha256sum "$artifact" | awk '{print $1}')" <<'NODE'
          const fs = require("node:fs");
          const [file, version, sourceCommit, artifact, artifactSha256] = process.argv.slice(2);
          const provenance = JSON.parse(fs.readFileSync(file, "utf8"));
          for (const [key, expected] of Object.entries({
            product: "Jarvis", version, platform: "linux", arch: "x64",
            artifactName: artifact, artifactSha256, sourceCommit,
          })) {
            if (provenance[key] !== expected) throw new Error(`provenance mismatch for ${key}`);
          }
          NODE
          extract_root="$RUNNER_TEMP/jarvis-appimage-extract"
          mkdir -p "$extract_root"
          (cd "$extract_root" && "$GITHUB_WORKSPACE/$artifact" --appimage-extract >/dev/null)
          test -x "$extract_root/squashfs-root/jarvis"
          test -f "$extract_root/squashfs-root/resources/app.asar"
          test -f "$extract_root/squashfs-root/resources/jarvis-official-release.json"
          voice_root="$extract_root/squashfs-root/resources/jarvis-resources"
          test -d "$voice_root/parakeet"
          test -f "$voice_root/parakeet/encoder.int8.onnx"
          test -d "$voice_root/pocket"
          test -d "$voice_root/pocket/models"
          test -f "$voice_root/pocket/models/flow_lm_main_int8.onnx"
          test -f "$voice_root/pocket/models/flow_lm_flow.onnx"
          test -f "$voice_root/pocket/models/mimi_decoder.onnx"
          test -f "$voice_root/pocket/models/mimi_encoder.onnx"
          test -f "$voice_root/pocket/models/bos_before_voice.f32"
          test -f "$voice_root/pocket/voices/alba-casual-3s.wav"
          test -f "$voice_root/pocket/PROVENANCE.json"
          test -x "$voice_root/pocket/bin/jarvis-pocket-tts"
          test -f "$voice_root/pocket/lib/libonnxruntime.so.1"
          test -f "$voice_root/THIRD_PARTY_NOTICES.md"
          test -f "$extract_root/squashfs-root/resources/app.asar"
          node_cpal_root="$extract_root/squashfs-root/resources/app.asar.unpacked/node_modules/node-cpal"
          node_cpal_binary="$node_cpal_root/bin/linux-x64/index.node"
          test -f "$node_cpal_binary"
          test ! -e "$extract_root/squashfs-root/resources/app.asar.unpacked/node_modules/@t3tools/jarvis-native-microphone"
          for extra in darwin-arm64 darwin-x64 linux-arm64 win32-x64; do
            test ! -e "$node_cpal_root/bin/$extra"
          done
          ELECTRON_RUN_AS_NODE=1 "$extract_root/squashfs-root/jarvis" -e "const loaded = require(process.argv[1]); if (!loaded || typeof loaded.createStream !== 'function') throw new Error('Packaged node-cpal binding did not load in Electron Node mode.');" "$node_cpal_binary"
          uiohook_root="$extract_root/squashfs-root/resources/app.asar.unpacked/node_modules/uiohook-napi"
          uiohook_binary="$uiohook_root/prebuilds/linux-x64/uiohook-napi.node"
          test -f "$uiohook_binary"
          for extra in darwin-arm64 darwin-x64 linux-arm64 linux-loong64 win32-arm64 win32-x64; do
            test ! -e "$uiohook_root/prebuilds/$extra"
          done
          # uiohook initializes libuiohook while loading the native module and
          # therefore needs an X11 display even though this is only a Node-mode
          # binding probe. Keep the probe against the exact extracted Electron
          # binary and payload, but give it the same virtual-display contract
          # as the packaged GUI smoke below.
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
            env ELECTRON_RUN_AS_NODE=1 "$extract_root/squashfs-root/jarvis" \
            -e "const loaded = require(process.argv[1]); if (!loaded || typeof loaded.start !== 'function' || typeof loaded.stop !== 'function') throw new Error('Packaged uiohook-napi binding did not load in Electron Node mode.');" \
            "$uiohook_binary"
          node - "$extract_root/squashfs-root/resources/app.asar" <<'NODE'
          // The workflow installs the scripts workspace through a filtered
          // pnpm install, so resolve its direct dependency from that workspace
          // instead of assuming a hoisted root node_modules entry.
          const { listPackage } = require("./scripts/node_modules/@electron/asar");
          const entries = listPackage(process.argv[2]).map((entry) => entry.replace(/^\/+/, ""));
          for (const worker of ["desktopVoiceWorker.cjs", "pocket-worker.cjs"]) {
            if (!entries.includes(`apps/desktop/dist-electron/${worker}`)) {
              throw new Error(`Linux Full AppImage is missing the native voice worker ${worker}.`);
            }
          }
          if (entries.some((entry) => entry.includes("companion"))) {
            throw new Error("Linux Full AppImage contains Companion application files.");
          }
          for (const dependency of [
            "node_modules/node-cpal/bin/linux-x64/index.node",
            "node_modules/sherpa-onnx-node/sherpa-onnx.js",
          ]) {
            if (!entries.includes(dependency) && !entries.some((entry) => entry.endsWith(`/${dependency}`))) {
              throw new Error(`Linux Full AppImage is missing native voice dependency ${dependency}.`);
            }
          }
          NODE
          node - "$extract_root/squashfs-root/jarvis" \
            "$extract_root/squashfs-root/resources/app.asar/apps/desktop/dist-electron/desktopVoiceWorker.cjs" \
            "$voice_root" <<'NODE'
          const { spawn } = require("node:child_process");
          const readline = require("node:readline");

          const [electronPath, workerPath, voiceRoot] = process.argv.slice(2);
          const child = spawn(electronPath, [workerPath], {
            env: {
              ...process.env,
              ELECTRON_RUN_AS_NODE: "1",
              JARVIS_VOICE_ROOT: voiceRoot,
            },
            stdio: ["pipe", "pipe", "pipe"],
          });
          const lines = readline.createInterface({ input: child.stdout, crlfDelay: Infinity });
          let phase = "starting";
          let settled = false;
          let diagnostics = "";
          let guard;

          const fail = (message) => {
            if (settled) return;
            settled = true;
            clearTimeout(guard);
            lines.close();
            if (child.exitCode === null && child.signalCode === null) child.kill();
            console.error(message);
            process.exitCode = 1;
          };

          const finish = () => {
            if (settled) return;
            settled = true;
            clearTimeout(guard);
            lines.close();
          };

          const send = (requestId, type) => {
            child.stdin.write(`${JSON.stringify({ requestId, type })}\n`);
          };

          child.stderr.on("data", (chunk) => {
            diagnostics = `${diagnostics}${chunk.toString("utf8")}`.slice(-4_096);
          });
          child.once("error", (cause) => fail(`Packaged voice worker failed to launch: ${cause.message}`));
          child.once("exit", (code, signal) => {
            if (settled || phase === "stopped") return;
            fail(
              `Packaged voice worker exited before a clean shutdown (code=${code ?? "null"}, signal=${signal ?? "null"})${
                diagnostics.trim() === "" ? "" : `: ${diagnostics.trim()}`
              }`,
            );
          });

          lines.on("line", (line) => {
            if (settled) return;
            let message;
            try {
              message = JSON.parse(line);
            } catch {
              fail(`Packaged voice worker emitted malformed JSON: ${line}`);
              return;
            }
            if (message.type === "fatal" || message.type === "error" || message.state === "error") {
              fail(`Packaged voice worker reported ${JSON.stringify(message)}`);
              return;
            }
            if (message.type === "ready" && phase === "starting") {
              phase = "preparing";
              send("smoke-prepare", "prepare");
              return;
            }
            if (message.type !== "result") return;
            if (message.ok !== true) {
              fail(`Packaged voice worker request failed: ${JSON.stringify(message)}`);
              return;
            }
            if (message.requestId === "smoke-prepare" && phase === "preparing") {
              phase = "shutting-down";
              send("smoke-shutdown", "shutdown");
              return;
            }
            if (message.requestId === "smoke-shutdown" && phase === "shutting-down") {
              phase = "stopped";
              child.stdin.end();
              return;
            }
            fail(`Packaged voice worker returned an unexpected result: ${JSON.stringify(message)}`);
          });

          // This is only a failure guard. Progress is driven by worker stdout
          // events and the child exit event, never by polling or sleeps.
          guard = setTimeout(() => fail(`Packaged voice worker smoke timed out in phase ${phase}`), 120_000);
          child.once("close", (code, signal) => {
            if (settled) return;
            if (phase !== "stopped" || code !== 0 || signal !== null) {
              fail(`Packaged voice worker did not shut down cleanly in phase ${phase}`);
              return;
            }
            finish();
          });
          NODE
          if find "$extract_root/squashfs-root/resources" -type f \( -name 'jarvis-companion' -o -path '*/companion/resources/app.asar' \) -print -quit | grep -q .; then
            echo "Linux Full AppImage contains a standalone Companion runtime." >&2
            exit 1
          fi
          if [[ -e "$extract_root/squashfs-root/resources/companion" ]]; then
            echo "Linux Full AppImage contains a Companion resource subtree." >&2
            exit 1
          fi
          node - "$extract_root/squashfs-root/resources/app.asar" <<'NODE'
          const fs = require("node:fs");
          const asar = fs.readFileSync(process.argv[2]);
          for (const marker of ["Jarvis", "com.abstergo.jarvis"]) {
            if (!asar.includes(Buffer.from(marker))) throw new Error(`AppImage is missing identity marker: ${marker}`);
          }
          NODE

      - name: Smoke Linux AppImage GUI startup
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          artifact="release/Jarvis-${VERSION}-x86_64.AppImage"
          appimage="$GITHUB_WORKSPACE/$artifact"
          test -x "$appimage"
          log_file="$RUNNER_TEMP/jarvis-gui-smoke.log"
          probe_dir="$RUNNER_TEMP/jarvis-startup-probe"
          probe_file="$probe_dir/startup-receipt.json"
          smoke_root="$RUNNER_TEMP/jarvis-gui-smoke-home"
          x_display=":99"
          x_socket="/tmp/.X11-unix/X${x_display#:}"
          xvfb_log="$RUNNER_TEMP/jarvis-xvfb.log"
          openbox_log="$RUNNER_TEMP/jarvis-openbox.log"
          rm -rf "$probe_dir"
          rm -rf "$smoke_root"
          mkdir -p "$probe_dir"
          mkdir -p "$smoke_root/t3-home" "$smoke_root/xdg-config" "$smoke_root/xdg-data" "$smoke_root/xdg-cache" "$smoke_root/xdg-runtime"
          chmod 700 "$smoke_root/xdg-runtime"
          socket_event="$RUNNER_TEMP/jarvis-x11-socket-event"
          rm -f "$socket_event"
          xvfb_pid=""
          openbox_pid=""
          socket_watcher_pid=""
          watcher_pid=""
          app_pid=""
          print_diagnostics() {
            echo "Packaged GUI smoke diagnostics; startup probe directory listing:" >&2
            if [[ -d "$probe_dir" ]]; then
              find "$probe_dir" -maxdepth 1 -mindepth 1 -printf '%f\n' | sort | head -n 50 >&2 || true
            else
              echo "<missing directory>" >&2
            fi
            echo "Packaged GUI smoke diagnostics; startup probe stat:" >&2
            stat -- "$probe_dir" "$probe_file" >&2 || true
            echo "Packaged GUI smoke diagnostics; startup probe content:" >&2
            if [[ -f "$probe_file" ]]; then
              head -c 4096 "$probe_file" >&2 || true
              echo >&2
            else
              echo "<missing file>" >&2
            fi
            echo "Packaged GUI smoke diagnostics; X window tree:" >&2
            DISPLAY="$x_display" timeout --signal=TERM 5 xwininfo -root -tree 2>&1 | tail -n 200 >&2 || true
            echo "Packaged GUI smoke diagnostics; Xvfb log:" >&2
            tail -n 200 "$xvfb_log" >&2 || true
            echo "Packaged GUI smoke diagnostics; Openbox log:" >&2
            tail -n 200 "$openbox_log" >&2 || true
            echo "Packaged GUI smoke diagnostics; application log:" >&2
            tail -n 200 "$log_file" >&2 || true
          }
          cleanup() {
            status=$?
            set +e
            if (( status != 0 )); then
              print_diagnostics
            fi
            if [[ -n "$socket_watcher_pid" ]] && kill -0 "$socket_watcher_pid" 2>/dev/null; then
              kill -TERM "$socket_watcher_pid" 2>/dev/null || true
              wait "$socket_watcher_pid" || true
            fi
            if [[ -n "$watcher_pid" ]] && kill -0 "$watcher_pid" 2>/dev/null; then
              kill -TERM "$watcher_pid" 2>/dev/null || true
              wait "$watcher_pid" || true
            fi
            if [[ -n "$app_pid" ]]; then
              kill -TERM -- "-$app_pid" 2>/dev/null || true
              if kill -0 "$app_pid" 2>/dev/null; then
                wait "$app_pid" || true
              fi
            fi
            if [[ -n "$openbox_pid" ]]; then
              kill -TERM -- "-$openbox_pid" 2>/dev/null || true
              if kill -0 "$openbox_pid" 2>/dev/null; then
                wait "$openbox_pid" || true
              fi
            fi
            if [[ -n "$xvfb_pid" ]]; then
              kill -TERM -- "-$xvfb_pid" 2>/dev/null || true
              if kill -0 "$xvfb_pid" 2>/dev/null; then
                wait "$xvfb_pid" || true
              fi
            fi
            exit "$status"
          }
          trap cleanup EXIT

          # Run Electron in a normal X11 GUI session. Xvfb supplies the display
          # server without using Chromium's headless mode, so the smoke gate
          # exercises the same renderer/window lifecycle as a desktop launch.
          sudo install -d -m 1777 /tmp/.X11-unix
          if [[ -e "$x_socket" ]]; then
            echo "Refusing to reuse an existing X11 socket: $x_socket" >&2
            exit 1
          fi
          timeout --signal=TERM 15 inotifywait -q -e create,moved_to \
            --format '%f' --include "^X${x_display#:}$" /tmp/.X11-unix \
            >"$socket_event" &
          socket_watcher_pid=$!
          setsid Xvfb "$x_display" -screen 0 1280x800x24 -nolisten tcp \
            >"$xvfb_log" 2>&1 &
          xvfb_pid=$!
          set +e
          wait -n "$socket_watcher_pid" "$xvfb_pid"
          socket_wait_status=$?
          set -e
          if [[ ! -S "$x_socket" ]] || ! kill -0 "$xvfb_pid" 2>/dev/null; then
            echo "Xvfb did not create a live X11 socket (wait status $socket_wait_status)." >&2
            exit 1
          fi
          kill -TERM "$socket_watcher_pid" 2>/dev/null || true
          wait "$socket_watcher_pid" 2>/dev/null || true

          # Start a minimal window manager so CI exercises a normal Linux
          # desktop lifecycle instead of testing the app on a bare X server.
          # Openbox is deliberately limited to this smoke display; the
          # readiness check proves it claimed this exact X server before the
          # packaged app is launched.
          setsid env DISPLAY="$x_display" openbox --sm-disable >"$openbox_log" 2>&1 &
          openbox_pid=$!
          wm_ready=0
          for _ in {1..60}; do
            if ! kill -0 "$openbox_pid" 2>/dev/null; then
              break
            fi
            if DISPLAY="$x_display" xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null |
              grep -Eq 'window id #'; then
              wm_ready=1
              break
            fi
            sleep 0.25
          done
          if (( wm_ready != 1 )); then
            echo "Openbox did not claim the Xvfb display within 15 seconds." >&2
            exit 1
          fi

          # The smoke-only password-store override prevents Secret Service's
          # SystemPrompter from blocking CI. Production launches do not receive
          # this override.
          # Arm the watcher before launching the app. The probe directory is
          # empty and dedicated to this receipt, so any event wakes the gate;
          # the file-size check and exact JSON validation below decide success.
          timeout --signal=TERM 45 inotifywait -q -e moved_to "$probe_dir" \
            >/dev/null 2>&1 &
          watcher_pid=$!

          setsid --wait dbus-run-session -- env \
            APPIMAGE_EXTRACT_AND_RUN=1 ELECTRON_ENABLE_LOGGING=1 JARVIS_STARTUP_PROBE_FILE="$probe_file" \
            T3CODE_HOME="$smoke_root/t3-home" XDG_CONFIG_HOME="$smoke_root/xdg-config" \
            XDG_DATA_HOME="$smoke_root/xdg-data" XDG_CACHE_HOME="$smoke_root/xdg-cache" \
            XDG_RUNTIME_DIR="$smoke_root/xdg-runtime" DISPLAY="$x_display" \
            "$appimage" --ozone-platform=x11 --no-sandbox --disable-gpu --password-store=basic --jarvis-startup-probe="$probe_file" >"$log_file" 2>&1 &
          app_pid=$!

          # Wait on either the watcher or the captured app PID. The watcher is
          # only a wake-up signal: the app must still be alive and the receipt
          # must be non-empty before the exact JSON validation below runs.
          set +e
          wait -n "$watcher_pid" "$app_pid"
          wait_status=$?
          set -e
          if ! kill -0 "$app_pid" 2>/dev/null; then
            echo "Packaged GUI exited before writing the startup receipt (wait status $wait_status)." >&2
            exit 1
          fi
          if [[ ! -s "$probe_file" ]]; then
            if (( wait_status == 124 )); then
              echo "Packaged GUI did not write a non-empty startup receipt within 45 seconds." >&2
            else
              echo "Packaged GUI startup probe watcher woke for an unrelated event without a non-empty receipt." >&2
            fi
            exit 1
          fi
          node -e '
            const fs = require("node:fs");
            const receipt = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (receipt.schemaVersion !== 1 || receipt.product !== "Jarvis" ||
                receipt.version !== process.argv[2] || receipt.platform !== "linux" ||
                receipt.phase !== "main-window-revealed") {
              throw new Error(`Unexpected startup receipt: ${JSON.stringify(receipt)}`);
            }
          ' "$probe_file" "$VERSION"
          for sentinel in DesktopClerkBridgeInitializationError registerSchemesAsPrivileged; do
            if grep -qF "$sentinel" "$log_file"; then
              echo "Packaged GUI output contains fatal startup marker: $sentinel" >&2
              exit 1
            fi
          done
          echo "Packaged GUI smoke passed: startup receipt confirms renderer mount and window reveal."

      - name: Upload Linux desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: jarvis-desktop-linux-x64-${{ steps.version.outputs.version }}
          path: |
            release/Jarvis-${{ steps.version.outputs.version }}-x86_64.AppImage
            release/Jarvis-${{ steps.version.outputs.version }}-x86_64.AppImage.sha256
            release/Jarvis-${{ steps.version.outputs.version }}-x86_64.AppImage.provenance.json
          if-no-files-found: error
          retention-days: 14
