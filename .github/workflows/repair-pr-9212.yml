name: Repair PR 9212

on:
  push:
    branches:
      - fix/unknown-provider-pr-polling

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/unknown-provider-pr-polling

      - name: Merge current upstream main and resolve semantic conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/pingdotgg/t3code.git 2>/dev/null || git remote set-url upstream https://github.com/pingdotgg/t3code.git
          git fetch upstream main
          git merge --no-commit --no-ff -Xours upstream/main

          python3 <<'PY'
          from pathlib import Path
          import subprocess

          path = "apps/server/src/git/GitManager.ts"
          p = Path(path)
          text = p.read_text()
          main = subprocess.check_output(["git", "show", f"upstream/main:{path}"], text=True)

          # Preserve current main's published-local-branch lookup resolution.
          helper_marker = "  // The remote that holds a ref named after the local branch"
          unpublished_marker = "  /**\n   * Whether git has no record of this branch on any remote"
          if helper_marker not in text:
              hs = main.index(helper_marker)
              he = main.index(unpublished_marker, hs)
              insert_at = text.index(unpublished_marker)
              text = text[:insert_at] + main[hs:he] + text[insert_at:]

          # Keep main's resolveLookupHeadContext behavior while retaining the PR's
          # non-definitive ProviderUnknown cache outcome.
          cache_anchor = text.index("  const prLookupCache = yield* Cache.makeWith(")
          gen_start = text.index("      return Effect.gen(function* () {", cache_anchor)
          skip_comment = text.index(
              "        // Only skip when the branch is untracked as well:", gen_start
          )
          cache_prefix = '''      return Effect.gen(function* () {
            const { headContext, lookup } = yield* resolveLookupHeadContext(cwd, details);
            if (!lookup) {
              return {
                outcome: { _tag: "Complete", latest: null } satisfies PrLookupOutcome,
                headContext,
              };
            }
          '''
          text = text[:gen_start] + cache_prefix + text[skip_comment:]

          # Merge current main's refreshMissingPullRequest behavior with the new
          # outcome shape. ProviderUnknown must keep its retry backoff and must
          # not be treated as a definitive missing PR.
          lookup_start = text.index('  const lookupStatusPr = Effect.fn("lookupStatusPr")')
          lookup_end = text.index('  const remoteStatusResultCache =', lookup_start)
          merged_lookup = '''  const lookupStatusPr = Effect.fn("lookupStatusPr")(function* (
            cwd: string,
            details: {
              branch: string;
              upstreamRef: string | null;
              defaultBranch: string | null;
              isDefaultBranch: boolean;
            },
            refreshMissingPullRequest = false,
          ) {
            // Keyed by (cwd, branch) only: the upstream ref changing (e.g. a first
            // `push -u`) must not orphan the fallback value for the same branch.
            const branchKey = `${cwd}\\u0000${details.branch}`;
            const cacheKey = prLookupCacheKey(cwd, details);
            if (refreshMissingPullRequest) {
              const cached = yield* Cache.getOption(prLookupCache, cacheKey).pipe(
                Effect.orElseSucceed(() => Option.none()),
              );
              if (
                Option.isSome(cached) &&
                cached.value.outcome._tag === "Complete" &&
                cached.value.outcome.latest === null
              ) {
                yield* Cache.invalidate(prLookupCache, cacheKey);
              }
            }
            return yield* Cache.get(prLookupCache, cacheKey).pipe(
              Effect.flatMap(({ outcome, headContext }) => {
                const lastKnownContext = {
                  upstreamRef: details.upstreamRef,
                  headBranch: headContext.headBranch,
                  remoteName: headContext.remoteName,
                  headRemoteUrlKey: headContext.headRemoteUrlKey,
                };
                if (outcome._tag === "ProviderUnknown") {
                  return Effect.succeed(resolveLastKnownPr(branchKey, lastKnownContext));
                }

                const pr =
                  outcome.latest === null ||
                  // On the default branch, only surface open PRs. Merged/closed
                  // matches are usually reverse-merge history, not the thread's PR.
                  (details.isDefaultBranch && outcome.latest.state !== "open")
                    ? null
                    : toStatusPr(outcome.latest);
                return Effect.sync(() => {
                  rememberLastKnownPr(branchKey, { pr, ...lastKnownContext });
                  return pr;
                });
              }),
              Effect.catch((error) =>
                Effect.logWarning("PR lookup failed; keeping last known PR state.").pipe(
                  Effect.annotateLogs({
                    operation: "lookupStatusPr",
                    branch: details.branch,
                    errorTag:
                      typeof error === "object" && error !== null && "_tag" in error
                        ? String(error._tag)
                        : typeof error,
                    ...(isSourceControlProviderError(error)
                      ? {
                          provider: error.provider,
                          providerOperation: error.operation,
                          providerCommand: error.command ?? "unknown",
                          errorDetail: error.detail,
                        }
                      : {}),
                  }),
                  Effect.andThen(resolveLookupHeadContext(cwd, details)),
                  Effect.map(({ headContext }) =>
                    resolveLastKnownPr(branchKey, {
                      upstreamRef: details.upstreamRef,
                      headBranch: headContext.headBranch,
                      remoteName: headContext.remoteName,
                      headRemoteUrlKey: headContext.headRemoteUrlKey,
                    }),
                  ),
                ),
              ),
            );
          });
          const readRemoteStatus = Effect.fn("readRemoteStatus")(function* (
            cwd: string,
            options?: GitRemoteStatusOptions,
          ) {
            const details = yield* gitCore
              .statusDetailsRemote(cwd, options)
              .pipe(Effect.catchIf(isNotGitRepositoryError, () => Effect.succeed(null)));
            if (details === null || !details.isRepo) {
              return null;
            }

            const pr =
              details.branch !== null
                ? yield* lookupStatusPr(
                    cwd,
                    {
                      branch: details.branch,
                      upstreamRef: details.upstreamRef,
                      defaultBranch: details.defaultBranch,
                      isDefaultBranch: details.isDefaultBranch,
                    },
                    options?.refreshMissingPullRequest,
                  )
                : null;

            return {
              hasUpstream: details.hasUpstream,
              aheadCount: details.aheadCount,
              behindCount: details.behindCount,
              aheadOfDefaultCount: details.aheadOfDefaultCount,
              pr,
            } satisfies VcsStatusRemoteResult;
          });
          '''
          text = text[:lookup_start] + merged_lookup + text[lookup_end:]

          p.write_text(text)
          PY

          # This workflow is only a transport for the repair; do not leave it in the PR.
          rm -f .github/workflows/repair-pr-9212.yml

          git add -A
          git diff --cached --check
          git commit -m "fix(server): rebase unknown-provider PR lookup fix"
          git push origin HEAD:fix/unknown-provider-pr-polling
