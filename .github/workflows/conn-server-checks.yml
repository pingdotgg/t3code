name: Conn Server checks

# Every model-free Conn Server check against this tree's server, packages and client-runtime.
# Main checks are called after CI. Generated drift fails the job on every trigger.

on:
  # Every PR and sync push starts the workflow; the `changes` job decides from the full diff
  # (.github/scripts/conn-server-checks-paths.cjs) whether the checks run. GitHub's `paths`
  # filter sees only the first 3,000 changed files, and a skipped run would report nothing.
  pull_request:
  push:
    branches:
      - "sync/**"
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      cold:
        description: Skip Rust cache restore for a cold measurement
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: conn-server-checks-${{ github.event_name == 'workflow_run' && format('after-ci-{0}', github.run_id) || github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Same as `channel` in apps/conn-server/rust-toolchain.toml; tools/check.sh fails when they differ.
  RUST_TOOLCHAIN: "1.99.1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  changes:
    name: Conn Server changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      # A pull request checks out GitHub's merge commit with fetch-depth: 2, so its first
      # parent is the base branch and the diff is the PR's change.
      - name: Checkout
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 2
          sparse-checkout: |
            /.github/scripts/conn-server-checks-paths.cjs
          sparse-checkout-cone-mode: false

      # Fails open: when the diff cannot be resolved, the checks run.
      - name: Detect
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail
          run_all() {
            echo "$* Running the checks."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          case "$EVENT_NAME" in
            pull_request) base=HEAD^1 ;;
            push)
              base=$BEFORE_SHA
              [[ "$base" =~ ^0+$ ]] && run_all "New branch."
              git fetch --quiet --no-tags --depth=1 --filter=blob:none origin "$base" \
                || run_all "Could not fetch ${base}."
              ;;
            *) run_all "A ${EVENT_NAME} run always checks." ;;
          esac
          git diff -z --name-only --no-renames "$base" HEAD > "$RUNNER_TEMP/changed-paths" \
            || run_all "Could not diff against ${base}."
          node .github/scripts/conn-server-checks-paths.cjs "$RUNNER_TEMP/changed-paths" > "$RUNNER_TEMP/run" \
            || run_all "Could not select."
          cat "$RUNNER_TEMP/run" >> "$GITHUB_OUTPUT"

  build:
    name: Conn Server prerequisites (${{ matrix.profile }}/${{ matrix.package }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - { profile: release, package: all }
          - { profile: debug, package: conn-provider-codex }
          - { profile: debug, package: conn-provider-claude }
          - { profile: debug, package: conn-provider-acp }
          - { profile: debug, package: conn-engine }
    env:
      CONN_CHECK_BUILD_PROFILE: ${{ matrix.profile }}
      CONN_CHECK_BUILD_PACKAGE: ${{ matrix.package }}
      # Comparisons need release semantics, not size optimization of every fixture binary.
      # conn-server-ci.yml still builds the production musl profile without these overrides.
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "0"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        env:
          VP_DOWNLOAD_TIMEOUT: "120"
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Restore pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: conn-server-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: conn-server-pnpm-${{ runner.os }}-

      - name: Install Conn dependencies
        run: vp i

      # The Claude conformance checks and instances-flow run the real Agent SDK in the SDK host.
      - name: Install the SDK host
        working-directory: apps/conn-server/helpers/sdk-host
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Restore Cargo
        if: ${{ !inputs.cold }}
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/conn-server/target
          key: conn-server-build-v4-${{ matrix.profile }}-${{ matrix.package }}-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('apps/conn-server/Cargo.lock') }}
          restore-keys: conn-server-build-v4-${{ matrix.profile }}-${{ matrix.package }}-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: Build comparison binaries
        working-directory: apps/conn-server
        run: tools/check.sh --group build

      - name: Pack comparison binaries
        run: tar -C apps/conn-server/target/check-binaries -czf /tmp/conn-check-binaries-${{ matrix.profile }}-${{ matrix.package }}.tar.gz .

      - name: Upload comparison binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conn-check-binaries-${{ matrix.profile }}-${{ matrix.package }}
          path: /tmp/conn-check-binaries-${{ matrix.profile }}-${{ matrix.package }}.tar.gz
          retention-days: 1

      - name: Save Cargo on main
        if: github.event_name == 'workflow_run' && inputs.source_sha != '' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/conn-server/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Save pnpm store on main
        if: github.event_name == 'workflow_run' && inputs.source_sha != '' && github.ref == 'refs/heads/main' && matrix.profile == 'release' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: conn-server-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

  rust:
    name: Conn Server Rust checks
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        env:
          VP_DOWNLOAD_TIMEOUT: "120"
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Restore pnpm store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: conn-server-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: conn-server-pnpm-${{ runner.os }}-

      - name: Install Conn dependencies
        run: vp i

      # The Claude conformance checks and instances-flow run the real Agent SDK in the SDK host.
      - name: Install the SDK host
        working-directory: apps/conn-server/helpers/sdk-host
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Restore Cargo
        if: ${{ !inputs.cold }}
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/conn-server/target
          key: conn-server-test-v2-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('apps/conn-server/Cargo.lock') }}
          restore-keys: conn-server-test-v2-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Install cargo-deny
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2

      - name: Rust checks
        working-directory: apps/conn-server
        run: tools/check.sh --group rust
      - name: Save Cargo on main
        if: github.event_name == 'workflow_run' && inputs.source_sha != '' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/conn-server/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  compare:
    name: Conn Server comparisons (${{ matrix.group }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        env:
          VP_DOWNLOAD_TIMEOUT: "120"
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Restore pnpm store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: conn-server-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: conn-server-pnpm-${{ runner.os }}-

      - name: Install Conn dependencies
        run: vp i

      # The Claude conformance checks and instances-flow run the real Agent SDK in the SDK host.
      - name: Install the SDK host
        working-directory: apps/conn-server/helpers/sdk-host
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Download comparison binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: conn-check-binaries-*
          merge-multiple: true
          path: /tmp/conn-check-binaries

      - name: Unpack comparison binaries
        run: |
          mkdir -p apps/conn-server/target/check-binaries
          for archive in /tmp/conn-check-binaries/*.tar.gz; do
            tar -C apps/conn-server/target/check-binaries -xzf "$archive"
          done

      - name: Compare
        working-directory: apps/conn-server
        env:
          CONN_CHECK_BINARIES: ${{ github.workspace }}/apps/conn-server/target/check-binaries
        run: tools/check.sh --group ${{ matrix.group }}

  # Reports on every run, so a change the checks do not read passes instead of waiting.
  checks:
    name: Conn Server checks
    if: always()
    needs: [changes, build, rust, compare]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every group
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.run }}
          BUILD: ${{ needs.build.result }}
          RUST: ${{ needs.rust.result }}
          COMPARE: ${{ needs.compare.result }}
        run: |
          test "$CHANGES" = success || exit 1
          if [ "$RUN" = false ]; then echo "No file the checks read changed."; exit 0; fi
          test "$BUILD" = success && test "$RUST" = success && test "$COMPARE" = success
