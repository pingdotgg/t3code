name: Conn Server checks

# Every model-free Conn Server check against this tree's server, web client and packages.
# Pull requests and main/sync pushes use the same inputs; generated drift fails the job.

on:
  pull_request:
    paths: &paths
      - apps/conn-server/**
      - apps/server/**
      - apps/web/**
      - packages/**
      - .github/workflows/conn-server-checks.yml
  push:
    branches:
      - main
      - "sync/**"
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conn-server-checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Same as `channel` in apps/conn-server/rust-toolchain.toml; tools/check.sh fails when they differ.
  RUST_TOOLCHAIN: "1.99.1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  build:
    name: Conn Server prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Keep source times stable for Cargo
        run: git ls-files -z apps/conn-server | xargs -0 touch -d "$(git show -s --format=%cI HEAD)"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        env:
          VP_DOWNLOAD_TIMEOUT: "120"
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: conn-server-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: conn-server-pnpm-${{ runner.os }}-

      - name: Install Conn dependencies
        run: vp i

      # The Claude conformance checks and instances-flow run the real Agent SDK in the SDK host.
      - name: Install the SDK host
        working-directory: apps/conn-server/helpers/sdk-host
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/conn-server/target
          key: conn-server-check-v2-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ github.sha }}
          restore-keys: conn-server-check-v2-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: Install cargo-deny
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2

      - name: Build and Rust checks
        working-directory: apps/conn-server
        run: tools/check.sh --group build

      - name: Share Cargo prerequisites
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/conn-server/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  compare:
    name: Conn Server comparisons (${{ matrix.group }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Keep source times stable for Cargo
        run: git ls-files -z apps/conn-server | xargs -0 touch -d "$(git show -s --format=%cI HEAD)"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        env:
          VP_DOWNLOAD_TIMEOUT: "120"
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: conn-server-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: conn-server-pnpm-${{ runner.os }}-

      - name: Install Conn dependencies
        run: vp i

      # The Claude conformance checks and instances-flow run the real Agent SDK in the SDK host.
      - name: Install the SDK host
        working-directory: apps/conn-server/helpers/sdk-host
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Restore Cargo prerequisites
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/conn-server/target
          key: conn-server-check-v2-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Compare
        working-directory: apps/conn-server
        run: tools/check.sh --group ${{ matrix.group }}

  checks:
    name: Conn Server checks
    if: always()
    needs: [build, compare]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every group
        env:
          BUILD: ${{ needs.build.result }}
          COMPARE: ${{ needs.compare.result }}
        run: test "$BUILD" = success && test "$COMPARE" = success
