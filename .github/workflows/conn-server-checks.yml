name: Conn Server checks

# Every model-free Conn Server check against this tree's server, web client and packages.
# Pull requests and main/sync pushes use the same inputs; generated drift fails the job.

on:
  pull_request:
    paths: &paths
      - apps/conn-server/**
      - apps/server/**
      - apps/web/**
      - packages/**
      - .github/workflows/conn-server-checks.yml
  push:
    branches:
      - main
      - "sync/**"
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conn-server-checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Same as `channel` in apps/conn-server/rust-toolchain.toml; tools/check.sh fails when they differ.
  RUST_TOOLCHAIN: "1.99.1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  build:
    name: Conn Server prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Restore Rust source timestamps
        run: |
          git ls-files -z apps/conn-server | while IFS= read -r -d '' file; do
            case "$file" in
              *.rs|*/Cargo.toml|*/Cargo.lock|*/.cargo/config.toml)
                touch -d "$(git log -1 --format=%cI -- "$file")" "$file" ;;
            esac
          done

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        env:
          VP_DOWNLOAD_TIMEOUT: "120"
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Restore pnpm store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: conn-server-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: conn-server-pnpm-${{ runner.os }}-

      - name: Install Conn dependencies
        run: vp i

      # The Claude conformance checks and instances-flow run the real Agent SDK in the SDK host.
      - name: Install the SDK host
        working-directory: apps/conn-server/helpers/sdk-host
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Restore Cargo
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/conn-server/target
          key: conn-server-build-v3-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('apps/conn-server/Cargo.lock') }}
          restore-keys: |
            conn-server-build-v3-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
            conn-server-check-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: Build comparison binaries
        working-directory: apps/conn-server
        run: tools/check.sh --group build

      - name: Pack comparison binaries
        run: tar -C apps/conn-server/target/check-binaries -czf /tmp/conn-check-binaries.tar.gz .

      - name: Upload comparison binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conn-check-binaries
          path: /tmp/conn-check-binaries.tar.gz
          retention-days: 1

      - name: Save Cargo on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/conn-server/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Save pnpm store on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: conn-server-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

  rust:
    name: Conn Server Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Restore Rust source timestamps
        run: |
          git ls-files -z apps/conn-server | while IFS= read -r -d '' file; do
            case "$file" in
              *.rs|*/Cargo.toml|*/Cargo.lock|*/.cargo/config.toml)
                touch -d "$(git log -1 --format=%cI -- "$file")" "$file" ;;
            esac
          done

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        env:
          VP_DOWNLOAD_TIMEOUT: "120"
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Restore pnpm store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: conn-server-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: conn-server-pnpm-${{ runner.os }}-

      - name: Install Conn dependencies
        run: vp i

      # The Claude conformance checks and instances-flow run the real Agent SDK in the SDK host.
      - name: Install the SDK host
        working-directory: apps/conn-server/helpers/sdk-host
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Restore Cargo
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/conn-server/target
          key: conn-server-test-v1-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('apps/conn-server/Cargo.lock') }}
          restore-keys: conn-server-test-v1-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Install cargo-deny
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2

      - name: Rust checks
        working-directory: apps/conn-server
        run: tools/check.sh --group rust
      - name: Save Cargo on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/conn-server/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Save pnpm store on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: conn-server-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

  compare:
    name: Conn Server comparisons (${{ matrix.group }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        env:
          VP_DOWNLOAD_TIMEOUT: "120"
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Restore pnpm store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: conn-server-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: conn-server-pnpm-${{ runner.os }}-

      - name: Install Conn dependencies
        run: vp i

      # The Claude conformance checks and instances-flow run the real Agent SDK in the SDK host.
      - name: Install the SDK host
        working-directory: apps/conn-server/helpers/sdk-host
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Download comparison binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conn-check-binaries
          path: /tmp/conn-check-binaries

      - name: Unpack comparison binaries
        run: |
          mkdir -p apps/conn-server/target/check-binaries
          tar -C apps/conn-server/target/check-binaries -xzf /tmp/conn-check-binaries/conn-check-binaries.tar.gz

      - name: Compare
        working-directory: apps/conn-server
        env:
          CONN_CHECK_BINARIES: ${{ github.workspace }}/apps/conn-server/target/check-binaries
        run: tools/check.sh --group ${{ matrix.group }}

  checks:
    name: Conn Server checks
    if: always()
    needs: [build, rust, compare]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every group
        env:
          BUILD: ${{ needs.build.result }}
          RUST: ${{ needs.rust.result }}
          COMPARE: ${{ needs.compare.result }}
        run: test "$BUILD" = success && test "$RUST" = success && test "$COMPARE" = success
