name: Upstream Fixes

on:
  schedule:
    - cron: "37 */6 * * *"
    - cron: "37 1,7,13,19 * * *"
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      max:
        description: Most fixes to propose (1 to 12)
        required: false
        default: "12"

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  pick:
    name: Propose upstream fixes
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'upstream-fixes' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    concurrency:
      group: upstream-fixes
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BRANCH: upstream-fixes
      GH_TOKEN: ${{ secrets.UPSTREAM_FIXES_TOKEN || github.token }}
    steps:
      - name: Check for an open batch
        id: batch
        run: |
          batch=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number,url --jq '.[0] // empty')
          pr=$(jq -r '.number // empty' <<< "$batch")
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          if [ -n "$pr" ]; then
            url=$(jq -r '.url' <<< "$batch")
            {
              printf '### Waiting for [upstream batch #%s](%s)\n\n' "$pr" "$url"
              printf 'No new fixes will be proposed until this batch is reviewed and merged or closed. Its branch and history have been left untouched.\n\n'
              printf 'Current checks:\n\n'
              gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json statusCheckRollup \
                --jq '.statusCheckRollup[]? | "- \(.name // .context): \((.conclusion // .state // .status) | if . == "" then "pending" else . end)"' \
                || printf 'Check status is unavailable; see the linked pull request.\n'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.batch.outputs.number == ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_FIXES_TOKEN || github.token }}

      - name: Fetch upstream
        if: steps.batch.outputs.number == ''
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream main

      - name: Pick fixes
        if: steps.batch.outputs.number == ''
        id: pick
        env:
          MAX: ${{ inputs.max || '12' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          node .github/scripts/upstream-fixes.cjs upstream/main --max "$MAX" --summary "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          if [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        id: publish
        if: steps.pick.outputs.changed == 'true'
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then exit 0; fi
          ref="refs/heads/$BRANCH"
          previous=$(git ls-remote --heads origin "$ref" | cut -f1)
          git push --force-with-lease="$ref:$previous" origin "HEAD:$ref"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "Upstream fixes ($(date -u +%Y-%m-%d))" --body-file "$RUNNER_TEMP/summary.md"
          echo 'created=true' >> "$GITHUB_OUTPUT"

      - name: Run CI on the proposed batch
        if: steps.publish.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
