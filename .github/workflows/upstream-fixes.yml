name: Upstream Fixes

# This fork is its own app; upstream is a source of fixes, not a branch we
# follow. Every six hours this picks upstream's non-breaking `fix` and `perf` commits
# that apply cleanly, puts them on the `upstream-fixes` branch, and opens or
# updates one pull request with what was picked and what did not apply. Nothing
# reaches main until that pull request is reviewed and its CI passes.
# The rules live in .github/scripts/upstream-fixes.cjs; commits to never pick go
# in .github/upstream-fixes/skip.
on:
  schedule:
    # Upstream lands a few hundred commits a day, so a daily run is too coarse.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      max:
        description: Most fixes to pick in one run
        required: false
        default: "400"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: upstream-fixes
  cancel-in-progress: false

jobs:
  pick:
    name: Pick upstream fixes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BRANCH: upstream-fixes
      UPSTREAM: https://github.com/pingdotgg/t3code.git
      HAS_TOKEN: ${{ secrets.UPSTREAM_FIXES_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
          # A personal token lets the pull request start CI by itself; without it
          # the job dispatches CI on the branch instead.
          token: ${{ secrets.UPSTREAM_FIXES_TOKEN || github.token }}

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags upstream main

      - name: Pick fixes
        id: pick
        env:
          MAX: ${{ inputs.max || '400' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          node .github/scripts/upstream-fixes.cjs upstream/main --max "$MAX" --summary "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          if [ "$(git rev-list --count origin/main..HEAD)" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the pull request
        if: steps.pick.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_FIXES_TOKEN || github.token }}
        run: |
          git push --force origin "$BRANCH"
          # A fork's gh defaults to the parent repository; name ours explicitly.
          title="Upstream fixes ($(date -u +%Y-%m-%d))"
          if pr=$(gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" --json number --jq .number 2>/dev/null) && [ -n "$pr" ]; then
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/summary.md"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/summary.md"
          fi

      - name: Run CI on the branch
        if: steps.pick.outputs.changed == 'true' && env.HAS_TOKEN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
