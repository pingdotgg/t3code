name: Hardened Release

# Releases main after each Hardened Sync, at most once in six hours. When the release fails,
# Claude Code repairs the cause one time and the release runs again.

on:
  # GitHub starts scheduled runs of this repository hours late or not at all, so the end of a
  # sync starts the release. The schedule is a fallback.
  workflow_run:
    workflows: [Hardened Sync]
    types: [completed]
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Release even when main has not changed or the last release is recent"
        required: false
        default: false
        type: boolean
      repaired:
        description: "This run follows a repair, so a failure starts no other repair"
        required: false
        default: false
        type: boolean

concurrency:
  group: hardened-daily-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release
    if: github.repository == 'HYRMedia-LLC/t3code'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # actions/checkout cannot do this here: removing its credential runs git submodule
      # foreach, which fails on the .repos gitlinks. The tag push authenticates through gh.
      - name: Checkout
        run: |
          gh auth setup-git
          git init --quiet .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git fetch --quiet --tags origin "+refs/heads/main:refs/remotes/origin/main"
          git checkout --quiet -B main origin/main

      - id: changes
        name: Check for changes since the last release
        env:
          FORCE: ${{ inputs.force }}
          HAS_SIGNING: ${{ secrets.CSC_LINK != '' && secrets.APPLE_API_KEY != '' }}
        run: |
          if [[ "$HAS_SIGNING" != "true" ]]; then
            echo "::warning::Signing secrets are not set, so no release was built."
            echo "release=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          read -r published last < <(gh release list -R "$GITHUB_REPOSITORY" --exclude-pre-releases --limit 1 \
            --json tagName,publishedAt --jq '.[0] // {} | "\(.publishedAt // "" | if . == "" then 0 else fromdateiso8601 end) \(.tagName // "")"')
          if [[ "$FORCE" != "true" && -n "$last" ]] && git diff --quiet "$last" HEAD -- . ':!.github'; then
            echo "No source changes since $last."
            echo "release=false" >>"$GITHUB_OUTPUT"
          elif [[ "$FORCE" != "true" ]] && (( $(date +%s) - published < 6 * 3600 )); then
            echo "$last was released less than six hours ago."
            echo "release=false" >>"$GITHUB_OUTPUT"
          else
            echo "release=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Setup dependencies
        if: steps.changes.outputs.release == 'true'
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust
        if: steps.changes.outputs.release == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Import signing certificate and notarization key
        if: steps.changes.outputs.release == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/hardened-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "::add-mask::$keychain_password"
          cert_path="$RUNNER_TEMP/hardened-signing.p12"
          printf '%s' "$CSC_LINK" | base64 --decode >"$cert_path"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert_path" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$cert_path"
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" >"$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >>"$GITHUB_ENV"

      - name: Build, notarize, and publish
        if: steps.changes.outputs.release == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          T3_HARDENED_OUT: ${{ runner.temp }}/hardened
        run: .github/hardened/release.sh

  fix:
    name: Repair
    needs: release
    if: ${{ failure() && needs.release.result == 'failure' && !inputs.repaired }}
    permissions:
      actions: read
      contents: read
      pull-requests: write
    uses: ./.github/workflows/hardened-agent-change.yml
    with:
      task: release-fix
      failed_run: ${{ github.run_id }}
      final: true
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SYNC_APP_CLIENT_ID: ${{ secrets.SYNC_APP_CLIENT_ID }}
      SYNC_APP_PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

  # The repair landed on main, or found a cause outside the repository. Either way, try once more.
  retry:
    name: Release again
    needs: fix
    if: ${{ !cancelled() && needs.fix.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        run: gh workflow run hardened-daily-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f repaired=true -f force="$FORCE"
