name: Hardened Daily Release

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Release even when main has not changed since the last release"
        required: false
        default: false
        type: boolean
      sync_only:
        description: "Sync with upstream and skip the release"
        required: false
        default: false
        type: boolean

concurrency:
  group: hardened-daily-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Sync upstream
    if: github.repository == 'HYRMedia-LLC/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      conflict: ${{ steps.merge.outputs.conflict }}
    steps:
      # GITHUB_TOKEN cannot push upstream commits that change workflow files, so the
      # merge runs as the private hyrmedia-t3code-sync GitHub App.
      - id: sync_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - id: merge
        name: Sync main with upstream
        env:
          GH_TOKEN: ${{ steps.sync_token.outputs.token }}
        run: |
          if output="$(gh api -X POST "repos/$GITHUB_REPOSITORY/merge-upstream" -f branch=main --jq '.message' 2>&1)"; then
            echo "$output"
          elif [[ "$output" == *"HTTP 409"* ]]; then
            echo "Upstream does not merge cleanly into main."
            echo "conflict=true" >>"$GITHUB_OUTPUT"
          else
            echo "$output"
            echo "::error::The merge-upstream API failed."
            exit 1
          fi

  resolve:
    name: Resolve conflicts
    needs: sync
    if: needs.sync.outputs.conflict == 'true'
    permissions:
      actions: read
      contents: read
      pull-requests: write
    uses: ./.github/workflows/hardened-sync-resolve.yml
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SYNC_APP_CLIENT_ID: ${{ secrets.SYNC_APP_CLIENT_ID }}
      SYNC_APP_PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

  release:
    name: Release
    needs: [sync, resolve]
    if: ${{ !cancelled() && !inputs.sync_only && needs.sync.result == 'success' && (needs.resolve.result == 'success' || needs.resolve.result == 'skipped') }}
    runs-on: macos-26
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # actions/checkout cannot do this here: removing its credential runs git submodule
      # foreach, which fails on the .repos gitlinks. The tag push authenticates through gh.
      - name: Checkout
        run: |
          gh auth setup-git
          git init --quiet .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git fetch --quiet --tags origin "+refs/heads/main:refs/remotes/origin/main"
          git checkout --quiet -B main origin/main

      - id: changes
        name: Check for changes since the last release
        env:
          FORCE: ${{ inputs.force }}
          HAS_SIGNING: ${{ secrets.CSC_LINK != '' && secrets.APPLE_API_KEY != '' }}
        run: |
          if [[ "$HAS_SIGNING" != "true" ]]; then
            echo "::warning::Signing secrets are not set, so no release was built."
            echo "release=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          last="$(gh release list -R "$GITHUB_REPOSITORY" --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')"
          if [[ "$FORCE" != "true" && -n "$last" ]] && git diff --quiet "$last" HEAD -- . ':!.github'; then
            echo "No source changes since $last."
            echo "release=false" >>"$GITHUB_OUTPUT"
          else
            echo "release=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Setup dependencies
        if: steps.changes.outputs.release == 'true'
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust
        if: steps.changes.outputs.release == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Import signing certificate and notarization key
        if: steps.changes.outputs.release == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/hardened-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "::add-mask::$keychain_password"
          cert_path="$RUNNER_TEMP/hardened-signing.p12"
          printf '%s' "$CSC_LINK" | base64 --decode >"$cert_path"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert_path" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$cert_path"
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" >"$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >>"$GITHUB_ENV"

      - name: Build, notarize, and publish
        if: steps.changes.outputs.release == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          T3_HARDENED_OUT: ${{ runner.temp }}/hardened
        run: .github/hardened/release.sh
