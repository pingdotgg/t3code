name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  gates:
    name: Format, Lint, Typecheck
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@v1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Cache pnpm store and Vite Plus
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/share/pnpm/store
            .vite-plus/cache
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/vite.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm fmt:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  tests:
    name: Test, Browser Test, Build
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@v1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Cache pnpm store and Vite Plus
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/share/pnpm/store
            .vite-plus/cache
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/vite.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux browser helper build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libsecret-1-dev

      - name: Test
        run: pnpm test

      - name: Install browser test runtime
        run: |
          cd apps/web
          pnpm exec playwright install --with-deps chromium

      - name: Browser test
        run: pnpm --dir apps/web test:browser

      - name: Build desktop pipeline
        run: pnpm build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          grep -nE "desktopBridge|getLocalEnvironmentBootstrap|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.cjs

  self_test:
    name: Self-test Evidence
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@v1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser runtime
        run: pnpm --filter t3 exec playwright install --with-deps chromium

      - name: Pairing/reconnect baseline with diagnostic captures
        id: self-test
        timeout-minutes: 8
        run: pnpm test:self

      - name: Upload self-test evidence
        id: self-test-evidence
        if: always() && steps.self-test.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: self-test-${{ github.sha }}
          path: |
            .t3/self-test/*/manifest.json
            .t3/self-test/*/authenticated.png
            .t3/self-test/*/pairing-recovery.png
            .t3/self-test/*/pairing-invalid-link.png
            .t3/self-test/*/pairing-reload.webm
            .t3/self-test/*/raw/*.webm
            .t3/self-test/*/diagnostics.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Link self-test evidence
        if: always() && steps.self-test-evidence.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.self-test-evidence.outputs.artifact-url }}
          SELF_TEST_OUTCOME: ${{ steps.self-test.outcome }}
        run: |
          printf '### Pairing/reconnect baseline only\n\nResult: %s\n\n[Download baseline diagnostics and revision manifest](%s)\n\nThis job does not exercise PR functionality or establish feature readiness. Exercise changed features in a real client and publish their captures separately with pnpm pr:media. Artifacts require repository access and expire after 14 days.\n' "$SELF_TEST_OUTCOME" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  release_smoke:
    name: Release Smoke
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@v1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts

      - name: Exercise composed T3 Connect flow
        run: pnpm release:connect-smoke

      - name: Exercise packaged T3 Connect CLI
        run: pnpm release:cli-smoke

      - name: Exercise production Direct Connect flow
        timeout-minutes: 8
        run: pnpm test:direct-connect-smoke
