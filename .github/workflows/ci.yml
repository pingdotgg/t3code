name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      check: ${{ steps.classify.outputs.check }}
      full_check: ${{ steps.classify.outputs.full_check }}
      test: ${{ steps.classify.outputs.test }}
      test_server: ${{ steps.classify.outputs.test_server }}
      rust: ${{ steps.classify.outputs.rust }}
      mobile_native: ${{ steps.classify.outputs.mobile_native }}
      release_smoke: ${{ steps.classify.outputs.release_smoke }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Test change classifier
        run: node --test .github/scripts/ci-change-classifier.test.cjs

      - name: Classify changed paths
        id: classify
        uses: actions/github-script@v8
        with:
          script: |
            const { run } = require("./.github/scripts/ci-change-classifier.cjs");
            await run({ github, context, core });

  check:
    name: Check
    needs: classify
    if: >-
      !cancelled() &&
      (needs.classify.result != 'success' || needs.classify.outputs.check != 'false')
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Validate workflow-only change
        if: needs.classify.result == 'success' && needs.classify.outputs.full_check == 'false'
        run: echo "GitHub Actions parsed the changed workflow successfully."

      - name: Checkout
        if: needs.classify.result != 'success' || needs.classify.outputs.full_check != 'false'
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Reject repository-owned PR assets
        if: needs.classify.result != 'success' || needs.classify.outputs.full_check != 'false'
        run: |
          files="$(git ls-files .github/pr-assets)"
          if test -n "$files"; then
            printf 'PR evidence must be uploaded to GitHub, not committed:\n%s\n' "$files" >&2
            exit 1
          fi

      - name: Setup Vite+
        if: needs.classify.result != 'success' || needs.classify.outputs.full_check != 'false'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        if: needs.classify.result != 'success' || needs.classify.outputs.full_check != 'false'
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check
        if: needs.classify.result != 'success' || needs.classify.outputs.full_check != 'false'
        run: vp check

      - name: Typecheck
        if: needs.classify.result != 'success' || needs.classify.outputs.full_check != 'false'
        run: vpr typecheck

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build desktop pipeline
        if: needs.classify.result != 'success' || needs.classify.outputs.full_check != 'false'
        run: vp run build:desktop

      - name: Verify preload bundle output
        if: needs.classify.result != 'success' || needs.classify.outputs.full_check != 'false'
        run: node apps/desktop/scripts/verify-preload-bundle.mjs

  # Everything except `t3` (apps/server). `--parallel` drops the package
  # dependency ordering that `vp run` applies by default: these `test` tasks
  # declare no `dependsOn` and resolve workspace deps from source, so ordering
  # only bought us idle runners between dependency layers. The concurrency
  # limit stays at the default 4 so peak load per runner is unchanged.
  test:
    name: Test
    needs: classify
    if: >-
      !cancelled() &&
      (needs.classify.result != 'success' || needs.classify.outputs.test != 'false')
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Test
        run: vp run --parallel --concurrency-limit 4 --filter '!t3' --filter '!@t3tools/monorepo' test

  # apps/server sets `fileParallelism: false`, so its 239 files run strictly
  # one at a time. Fixed jobs preserve the existing required check names when
  # path classification skips all three shards. Their identical steps use a
  # YAML anchor so only the shard value differs.
  test_server_1:
    name: Test Server 1
    needs: classify
    if: >-
      !cancelled() &&
      (needs.classify.result != 'success' || needs.classify.outputs.test_server != 'false')
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      T3CODE_TEST_SHARD: 1/3
    steps: &server-test-steps
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # No Electron setup here: `t3` (apps/server) has no Electron dependency
      # and none of its tests touch the runtime. Only the non-server `test`
      # job, which covers @t3tools/desktop, needs the download.
      - name: Test
        env:
          T3CODE_TRANSFER_BUDGET_REPORT_PATH: ${{ runner.temp }}/t3code-transfer-budget.md
          T3CODE_TRANSFER_BUDGET_RESULT_PATH: ${{ runner.temp }}/thread-transfer-result.json
        run: vp run --filter t3 test --shard "$T3CODE_TEST_SHARD"

      # src/server.test.ts writes the budget report, so exactly one shard
      # produces these files. Gating the upload on their presence keeps a
      # single `thread-transfer-results` artifact per run, which is the name
      # thread-transfer-report.yml resolves.
      - name: Detect transfer budget report
        id: transfer_budget
        if: always()
        run: |
          if test -f "${{ runner.temp }}/thread-transfer-result.json"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish transfer budget report
        if: always() && steps.transfer_budget.outputs.present == 'true'
        run: |
          if test -f "${{ runner.temp }}/t3code-transfer-budget.md"; then
            tee -a "$GITHUB_STEP_SUMMARY" < "${{ runner.temp }}/t3code-transfer-budget.md"
          else
            echo "Transfer budget report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload thread transfer result
        if: always() && steps.transfer_budget.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: thread-transfer-results
          path: ${{ runner.temp }}/thread-transfer-result.json
          if-no-files-found: ignore
          retention-days: 30

  test_server_2:
    name: Test Server 2
    needs: classify
    if: >-
      !cancelled() &&
      (needs.classify.result != 'success' || needs.classify.outputs.test_server != 'false')
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      T3CODE_TEST_SHARD: 2/3
    steps: *server-test-steps

  test_server_3:
    name: Test Server 3
    needs: classify
    if: >-
      !cancelled() &&
      (needs.classify.result != 'success' || needs.classify.outputs.test_server != 'false')
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      T3CODE_TEST_SHARD: 3/3
    steps: *server-test-steps

  # Split out of Check and Test: both paid ~7-9s to install a Rust toolchain
  # for checks that take under 3s, on the critical path of every PR.
  rust:
    name: Rust
    needs: classify
    if: >-
      !cancelled() &&
      (needs.classify.result != 'success' || needs.classify.outputs.rust != 'false')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check resource monitor formatting
        run: cargo fmt --manifest-path native/resource-monitor/Cargo.toml -- --check

      - name: Test resource monitor
        run: cargo test --locked --manifest-path native/resource-monitor/Cargo.toml

  # Native mobile lint is one of the most expensive CI runners, so the shared
  # classifier boots it only when its sources, configs, or command dependencies
  # change. Classifier failures still run it.
  mobile_native_static_analysis:
    name: Mobile Native Static Analysis
    needs: classify
    if: >-
      !cancelled() &&
      (needs.classify.result != 'success' || needs.classify.outputs.mobile_native != 'false')
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile

      - name: Lint mobile native sources
        run: vp run lint:mobile

  release_smoke:
    name: Release Smoke
    needs: classify
    if: >-
      !cancelled() &&
      (needs.classify.result != 'success' || needs.classify.outputs.release_smoke != 'false')
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts
