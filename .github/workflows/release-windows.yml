name: Release Windows App

# Manual-only for now. The macOS release workflow is label-triggered because
# its signing identity, notarization, and Sparkle appcast are all wired up;
# the Windows equivalent needs three secrets that do not exist yet
# (TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD, and an
# Authenticode certificate). Until those are set, a label-triggered build would
# publish an unsigned installer that SmartScreen blocks — so this stays
# `workflow_dispatch` and the version input must match version.json exactly,
# the same rule the macOS manual path follows.
#
# See apps/windows/HANDOVER.md ▸ "Signing and updates" for the one-time setup.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version from apps/windows/version.json to release"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish the Windows installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require the requested version to match version.json
        shell: pwsh
        run: |
          $manifest = Get-Content apps/windows/version.json | ConvertFrom-Json
          if ($manifest.version -ne "${{ inputs.version }}") {
            Write-Error "version.json is $($manifest.version), workflow input is ${{ inputs.version }}"
            exit 1
          }

      - name: Set up vp
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the server bundle
        run: vp run --filter t3 build:bundle

      # Downloads the pinned node.exe (checksum-verified) and materializes the
      # production server payload the installer embeds.
      - name: Stage the sidecar
        run: node apps/windows/scripts/stage-sidecar.mjs

      - name: Build the renderer
        run: vp run --filter @sergecode/windows build

      # `createUpdaterArtifacts` is `false` in tauri.conf.json so the build
      # works before any signing key exists. Setting the env vars alone would
      # therefore produce no `.sig` at all — the flag has to be turned on
      # too — so both the build override and the artifact list are driven from
      # one decision made here.
      - name: Resolve updater signing
        id: signing
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $bundle = "apps/windows/src-tauri/target/release/bundle/nsis"
          $enabled = -not [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)

          if ($enabled) {
            # Tauri refuses to emit updater artifacts without a public key to
            # verify them against, and fails late in the build. Catch the
            # half-configured case here, where the message is actionable.
            $pubkey = (Get-Content apps/windows/src-tauri/tauri.conf.json -Raw |
              ConvertFrom-Json).plugins.updater.pubkey
            if ([string]::IsNullOrWhiteSpace($pubkey)) {
              Write-Error ("TAURI_SIGNING_PRIVATE_KEY is set but " +
                "plugins.updater.pubkey is empty in tauri.conf.json. " +
                "See apps/windows/HANDOVER.md section 7.")
              exit 1
            }
            $files = "$bundle/*.exe`n$bundle/*.sig"
          } else {
            Write-Host "No signing key configured: building an installer with no update feed."
            $files = "$bundle/*.exe"
          }

          "enabled=$($enabled.ToString().ToLower())" |
            Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8
          # Multi-line output: the artifact list has to stay in step with
          # whether signing ran, or the upload asks for a file that was never
          # produced.
          "files<<ARTIFACTS" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8
          $files | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8
          "ARTIFACTS" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8

      - name: Build the installer
        working-directory: apps/windows
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if ("${{ steps.signing.outputs.enabled }}" -eq "true") {
            pnpm exec tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
          } else {
            pnpm exec tauri build
          }

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v${{ inputs.version }}
          name: SurgeCode for Windows ${{ inputs.version }}
          draft: true
          # Loud rather than silent: a release that quietly ships without its
          # installer is worse than a failed workflow.
          fail_on_unmatched_files: true
          files: ${{ steps.signing.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
