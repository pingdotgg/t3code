name: Agent Context Budget

# Fails when a PR raises a value in agentContextBudget.json above main's. AgentContextBudget.test.ts
# keeps that file equal to the measured context, so the context cannot grow by editing the file.
# To accept growth on purpose, a maintainer adds the agent-context-increase label.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# No concurrency group: label events arrive in bursts, and a cancelled run reports as a failed check.
jobs:
  budget:
    name: Agent context budget
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BUDGET: apps/server/src/provider/agentContextBudget.json
      ALLOW_INCREASE: ${{ contains(github.event.pull_request.labels.*.name, 'agent-context-increase') }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          sparse-checkout: apps/server/src/provider/agentContextBudget.json
          sparse-checkout-cone-mode: false

      - name: Compare with the base commit
        run: |
          base=$(git rev-parse --verify 'HEAD^1')
          if ! git cat-file -e "$base:$BUDGET" 2>/dev/null; then
            echo "The base commit has no agent context budget yet."
            exit 0
          fi
          git show "$base:$BUDGET" > "$RUNNER_TEMP/base.json"
          grown=$(jq -r --slurpfile base "$RUNNER_TEMP/base.json" '
            to_entries[]
            | select($base[0][.key] != null and .value > $base[0][.key])
            | "\(.key): \($base[0][.key]) -> \(.value) (+\(.value - $base[0][.key]))"
          ' "$BUDGET")
          if [ -z "$grown" ]; then
            echo "Agent context is not larger than the base commit."
            exit 0
          fi
          printf 'Agent context grew compared to the base commit:\n%s\n' "$grown"
          if [ "$ALLOW_INCREASE" = "true" ]; then
            echo "Accepted by the agent-context-increase label."
            exit 0
          fi
          echo "::error file=$BUDGET::Agent context grew compared to the base commit. Cut the added text and rerun the evals that cover it (evals/README.md), or ask a maintainer to add the agent-context-increase label."
          exit 1
