name: Deploy Cloudflare (CDN + Website)

# Deploys the release CDN worker (cdn.penglei.dev) and marketing website
# (tix.penglei.dev) to Cloudflare Workers using CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID repository secrets.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        required: false
        default: both
        type: choice
        options:
          - both
          - cdn
          - site

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-cdn:
    name: Deploy CDN (cdn.penglei.dev)
    if: inputs.target == 'both' || inputs.target == 'cdn' || inputs.target == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json

      - name: Deploy tix-cdn Worker
        working-directory: infra/cdn-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

  deploy-site:
    name: Deploy Website (tix.penglei.dev)
    if: inputs.target == 'both' || inputs.target == 'site' || inputs.target == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/marketing...

      - name: Build marketing site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: vp run --filter @t3tools/marketing build

      - name: Deploy tix-site to Cloudflare Workers Assets
        working-directory: apps/marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
