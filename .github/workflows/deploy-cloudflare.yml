name: Deploy Cloudflare (CDN + Website)

# Deploys the release CDN worker (cdn.penglei.dev) and marketing website
# (tix.penglei.dev) to Cloudflare Workers using CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID repository secrets.
on:
  push:
    branches:
      - main
    paths:
      - "apps/marketing/**"
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - "infra/cdn-worker/**"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        required: false
        default: both
        type: choice
        options:
          - both
          - cdn
          - site

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect deploy targets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cdn: ${{ steps.targets.outputs.cdn }}
      site: ${{ steps.targets.outputs.site }}
    steps:
      - name: Determine targets
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET: ${{ inputs.target }}
          REPO: ${{ github.repository }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          cdn=false
          site=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$INPUT_TARGET" = "both" ] || [ "$INPUT_TARGET" = "cdn" ] || [ -z "$INPUT_TARGET" ]; then
              cdn=true
            fi
            if [ "$INPUT_TARGET" = "both" ] || [ "$INPUT_TARGET" = "site" ] || [ -z "$INPUT_TARGET" ]; then
              site=true
            fi
          elif [ "$EVENT_NAME" = "release" ]; then
            site=true
          else
            if files=$(gh api "repos/${REPO}/compare/${BEFORE_SHA}...${AFTER_SHA}" --jq '.files[].filename' 2>/dev/null); then
              while IFS= read -r file; do
                case "$file" in
                  infra/cdn-worker/*)
                    cdn=true
                    ;;
                  apps/marketing/*|scripts/install.sh|scripts/install.ps1)
                    site=true
                    ;;
                esac
              done <<< "$files"
            else
              cdn=true
              site=true
            fi
          fi
          echo "cdn=$cdn" >> "$GITHUB_OUTPUT"
          echo "site=$site" >> "$GITHUB_OUTPUT"

  deploy-cdn:
    name: Deploy CDN (cdn.penglei.dev)
    needs: detect-changes
    if: needs.detect-changes.outputs.cdn == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json

      - name: Deploy tix-cdn Worker
        working-directory: infra/cdn-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

  deploy-site:
    name: Deploy Website (tix.penglei.dev)
    needs: detect-changes
    if: needs.detect-changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/marketing...

      - name: Build marketing site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: vp run --filter @t3tools/marketing build

      - name: Deploy tix-site to Cloudflare Workers Assets
        working-directory: apps/marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
