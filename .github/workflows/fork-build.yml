# Personal fork pipeline (see FORK.md).
#
# Every few hours: if MT Code published a new munim-v* release, re-apply this
# fork's own commits on top of it (Claude resolves any merge conflict), then
# test, build the Windows installer and publish it as a GitHub release. The
# desktop app's update arrow reads those releases.
#
# The fork's default branch `custom` is always "latest MT Code release + our
# commits". A rebased candidate is pushed to `custom-next` first and only
# replaces `custom` after its installer built and published.
name: Fork sync and build

on:
  schedule:
    - cron: "23 */4 * * *"
  push:
    branches: [custom]
    paths-ignore: ["FORK.md"]
  workflow_dispatch:
    inputs:
      force_build:
        description: Build and publish even if the current commit was already released
        type: boolean
        default: false

concurrency:
  group: fork-sync-build
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: write

env:
  MTCODE_REMOTE: https://github.com/munimtechnologies/mtcode.git
  BOT_NAME: Ryan Hart
  BOT_EMAIL: 3673962+ryankhart@users.noreply.github.com

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      build: ${{ steps.plan.outputs.build }}
      sha: ${{ steps.plan.outputs.sha }}
      base_tag: ${{ steps.plan.outputs.base_tag }}
      version: ${{ steps.plan.outputs.version }}
      rebased: ${{ steps.rebase.outputs.rebased }}
    steps:
      # The token fallback below lets a private dry-run copy of this repo run
      # the pipeline; the real fork must have its push token.
      - name: Require the push token
        if: github.repository == 'ryankhart/t3code'
        env:
          FORK_PUSH_TOKEN: ${{ secrets.FORK_PUSH_TOKEN }}
        run: '[ -n "$FORK_PUSH_TOKEN" ] || { echo "FORK_PUSH_TOKEN secret is missing or empty"; exit 1; }'

      - name: Checkout custom
        uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 0
          # A personal token is needed to push branches whose new commits touch
          # .github/workflows (every MT Code release does); GITHUB_TOKEN can't.
          token: ${{ secrets.FORK_PUSH_TOKEN || github.token }}

      - name: Keep only this workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow list --all --json id,path,state --jq '.[] | select(.path != ".github/workflows/fork-build.yml" and .state == "active") | .id' |
            while read -r id; do gh workflow disable "$id" || true; done

      - name: Fetch MT Code releases
        run: |
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git config rerere.enabled true
          git config rerere.autoupdate true
          git fetch --no-tags "$MTCODE_REMOTE" '+refs/tags/munim-v*:refs/tags/munim-v*'
          base=$(git describe --tags --match 'munim-v*' --abbrev=0 HEAD)
          latest=$(git tag -l 'munim-v*' | sed 's/^munim-v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "BASE_TAG=$base" >> "$GITHUB_ENV"
          echo "LATEST_TAG=munim-v$latest" >> "$GITHUB_ENV"
          echo "Current base: $base; latest MT Code release: munim-v$latest"

      - name: Re-apply our commits on the new release
        id: rebase
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ "$BASE_TAG" = "$LATEST_TAG" ]; then
            echo "rebased=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Rebasing $(git rev-list --count "$BASE_TAG..HEAD") commits from $BASE_TAG onto $LATEST_TAG"
          # Mid-rebase the working tree may not have our files yet, so keep the prompt aside.
          cp fork/resolve-conflicts-prompt.md "$RUNNER_TEMP/prompt.md"
          cp fork/now-in-mtcode.mjs fork/now-in-mtcode.txt "$RUNNER_TEMP/"
          # Leaves out fork commits the new release already contains (fork/now-in-mtcode.txt).
          export GIT_SEQUENCE_EDITOR="node '$RUNNER_TEMP/now-in-mtcode.mjs' '$RUNNER_TEMP/now-in-mtcode.txt' '$LATEST_TAG'"
          if ! git rebase -i --onto "$LATEST_TAG" "$BASE_TAG" custom; then
            npm install -g @anthropic-ai/claude-code >/dev/null
            for round in $(seq 1 40); do
              [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ] || break
              if [ -z "$(git diff --name-only --diff-filter=U)" ]; then
                # rerere or a previous round resolved everything; keep going.
                GIT_EDITOR=true git rebase --continue && break || continue
              fi
              echo "::group::Claude resolves: $(git diff --name-only --diff-filter=U | tr '\n' ' ')"
              claude -p "$(cat "$RUNNER_TEMP/prompt.md")" \
                --permission-mode bypassPermissions --max-turns 60 --output-format text || true
              echo "::endgroup::"
              staged=$(git diff --cached --name-only)
              if [ -n "$(git diff --name-only --diff-filter=U)" ] || { [ -n "$staged" ] && git diff --cached | grep -qE '^\+(<<<<<<<|>>>>>>>) '; }; then
                echo "Conflicts remain after Claude's attempt"; exit 1
              fi
              GIT_EDITOR=true git rebase --continue && break || true
            done
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then echo "Rebase did not finish"; exit 1; fi
          fi
          git push --force origin HEAD:refs/heads/custom-next
          echo "rebased=true" >> "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: plan
        run: |
          base=$(git describe --tags --match 'munim-v*' --abbrev=0 HEAD)
          sha=$(git rev-parse HEAD)
          released=$(git tag --points-at HEAD -l 'v*' | head -1)
          build=true
          if [ -n "$released" ] && [ "${{ inputs.force_build }}" != "true" ]; then build=false; fi
          # Fork version: MT Code's x.y.z becomes x.y.(z*100+n), n = rebuild count on that base,
          # so each rebuild sorts above the last and below the next MT Code release.
          v=${base#munim-v}; maj=${v%%.*}; rest=${v#*.}; min=${rest%%.*}; pat=${rest#*.}
          for n in $(seq 0 99); do
            cand="$maj.$min.$((pat * 100 + n))"
            git rev-parse -q --verify "refs/tags/v$cand" >/dev/null || break
          done
          {
            echo "build=$build"; echo "sha=$sha"; echo "base_tag=$base"; echo "version=$cand"
          } >> "$GITHUB_OUTPUT"
          echo "base=$base sha=$sha already-released=${released:-no} build=$build version=$cand"

  build:
    needs: sync
    if: needs.sync.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      published: ${{ steps.publish.outputs.published }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.sync.outputs.version }}
      BASE_TAG: ${{ needs.sync.outputs.base_tag }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}
          fetch-depth: 0
          token: ${{ secrets.FORK_PUSH_TOKEN || github.token }}

      - name: Fetch base tag
        run: git fetch --no-tags "$MTCODE_REMOTE" "+refs/tags/$BASE_TAG:refs/tags/$BASE_TAG"

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: |
          npx -y "$(node -p 'require("./package.json").packageManager')" install --frozen-lockfile
          cygpath -w "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Test and typecheck what our commits touch
        run: node fork/check-changes.mjs "$BASE_TAG"

      - name: Build installer
        env:
          T3CODE_DESKTOP_DISTRO: munim
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          T3CODE_DESKTOP_VERSION: ${{ needs.sync.outputs.version }}
        run: |
          # Windows' own tar first: Git's GNU tar reads "C:\..." as a remote host.
          # Only tar: all of System32 first would also swap bash for WSL's.
          mkdir -p "$RUNNER_TEMP/wintar"
          cp /c/Windows/System32/tar.exe "$RUNNER_TEMP/wintar/"
          export PATH="$RUNNER_TEMP/wintar:$PATH"
          tar --version | head -1
          [ -f .env ] || cp .env.example .env
          node scripts/update-release-package-versions.ts "$VERSION"
          npx -y "$(node -p 'require("./package.json").packageManager')" dist:desktop:win:x64
          ls -la release

      - name: Check our features are inside the installer
        run: node fork/check-installer.mjs release

      - name: Publish release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/*.exe release/*.exe.blockmap release/latest*.yml)
          [ ${#files[@]} -ge 3 ] || { echo "missing release files: ${files[*]}"; exit 1; }
          notes="Built from MT Code ${BASE_TAG#munim-v} plus this fork's commits ($(git rev-list --count "$BASE_TAG..HEAD") commits). See FORK.md."
          gh release create "v$VERSION" "${files[@]}" --target "${{ needs.sync.outputs.sha }}" \
            --title "T3 Code $VERSION (MT Code ${BASE_TAG#munim-v} + fork)" --notes "$notes" --latest
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Promote candidate to custom
        if: needs.sync.outputs.rebased == 'true'
        run: |
          git push --force origin "${{ needs.sync.outputs.sha }}:refs/heads/custom"
          git push origin --delete custom-next || true

  # The phone app, built from the same commit and attached to the desktop
  # release, so a desktop update always has a matching APK. A failure here
  # leaves the desktop release in place and opens the failure issue.
  android:
    needs: [sync, build]
    # Also after a failed promotion: the release is already live.
    if: ${{ !cancelled() && needs.build.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Dependency install scripts and Gradle plugins run here; keep the token narrow.
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.sync.outputs.version }}
    steps:
      # The image leaves ~12 GB free, and on a small (private-repo) runner the
      # build outgrows 7.7 GB RAM + 4 GB swap; running out of either kills the
      # runner without a log. Free ~25 GB of unused tools (the Android SDK stays) and add swap.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/powershell /usr/share/swift /usr/local/julia* /opt/az /opt/microsoft /opt/google
          sudo rm -rf /usr/local/share/chromium /usr/local/lib/node_modules /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy
          sudo docker system prune -af >/dev/null 2>&1 || true
          sudo fallocate -l 10G /apk-swap && sudo chmod 600 /apk-swap && sudo mkswap /apk-swap >/dev/null && sudo swapon /apk-swap
          free -h
          df -h /

      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}

      # persist-credentials: false trips over this repo's dangling submodule
      # gitlinks, so drop the saved token by hand before any dependency code runs.
      - name: Remove the checkout token
        run: git config --local --unset-all 'http.https://github.com/.extraheader'

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npx -y "$(node -p 'require("./package.json").packageManager')" install --frozen-lockfile

      - name: Build APK
        working-directory: apps/mobile
        env:
          APP_VARIANT: preview
          T3CODE_APP_NAME: T3 Code Fork
          # Upstream's over-the-air updates would swap in a JS bundle without the fork's features.
          T3CODE_MOBILE_UPDATES_ENABLED: "0"
          EXPO_NO_TELEMETRY: "1"
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          # x.y.z -> x*10^7 + y*10^5 + z (z < 10^5), so every fork version installs over the last.
          IFS=. read -r maj min pat <<< "$VERSION"
          [ "$pat" -lt 100000 ] && [ "$min" -lt 100 ] || { echo "version $VERSION doesn't fit the versionCode scheme"; exit 1; }
          export T3CODE_ANDROID_VERSION_CODE=$((maj * 10000000 + min * 100000 + pat))
          echo "versionCode $T3CODE_ANDROID_VERSION_CODE"
          npx expo prebuild --clean --platform android --no-install
          cd android
          # Memory and disk every minute, so a runner that dies still shows why.
          ( while sleep 60; do echo "[mem] $(free -m | awk 'NR==2{print $3"/"$2" MB"}') swap $(free -m | awk 'NR==3{print $3" MB"}') disk $(df -h / | awk 'NR==2{print $4" free"}')"; done ) &
          trap "kill $! 2>/dev/null" EXIT
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Sign with the fork's key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          unsigned=$(ls apps/mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          "$apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias t3codefork \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --out "T3-Code-Fork-$VERSION.apk" "$unsigned"
          "$apksigner" verify --print-certs "T3-Code-Fork-$VERSION.apk" | head -2

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" "T3-Code-Fork-$VERSION.apk" --clobber -R "$GITHUB_REPOSITORY"

  report:
    needs: [sync, build, android]
    # A job that hits its timeout ends as cancelled, which failure() misses.
    if: failure() || contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Open or update a failure issue
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ needs.build.outputs.published }}" = "true" ] && [ "${{ needs.android.result }}" != "success" ]; then
            outcome="The desktop release was published, but the phone APK didn't build, so that release has no APK."
          elif [ "${{ needs.build.outputs.published }}" = "true" ]; then
            outcome="The release (desktop and phone) was published, but a later step failed; see the run."
          else
            outcome="Nothing was published, so installed copies stay on their current version."
          fi
          body="The fork pipeline stopped. $outcome

          Run: $run_url
          Base: ${{ needs.sync.outputs.base_tag || 'unknown' }}"
          existing=$(gh issue list -R "${{ github.repository }}" --label fork-pipeline --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "${{ github.repository }}" --body "$body"
          else
            gh label create fork-pipeline -R "${{ github.repository }}" --color B60205 --force >/dev/null
            gh issue create -R "${{ github.repository }}" --title "Fork pipeline failed" --label fork-pipeline --body "$body"
          fi
