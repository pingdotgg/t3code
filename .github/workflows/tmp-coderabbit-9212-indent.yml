name: Temporary CodeRabbit 9212 indentation fix

on:
  push:
    branches:
      - fix/unknown-provider-pr-polling

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unknown-provider-pr-polling

      - name: Fix regression test indentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/server/src/git/GitManager.test.ts")
          text = path.read_text()
          old = '      expect(pullRequest).toBeNull();\n\nyield* runGit(repoDir, ["config", "--unset", "remote.origin.url"]);\n\nexpect(\n  yield* manager.branchPullRequest({\n    cwd: repoDir,\n    branch: "feature/unknown-branch-provider",\n  }),\n).toBeNull();\n\nexpect(ghCalls.filter((call) => call.startsWith("pr list "))).toHaveLength(0);'
          new = '      expect(pullRequest).toBeNull();\n\n      yield* runGit(repoDir, ["config", "--unset", "remote.origin.url"]);\n\n      expect(\n        yield* manager.branchPullRequest({\n          cwd: repoDir,\n          branch: "feature/unknown-branch-provider",\n        }),\n      ).toBeNull();\n\n      expect(ghCalls.filter((call) => call.startsWith("pr list "))).toHaveLength(0);'
          if text.count(old) != 1:
              raise SystemExit(f"expected one malformed regression block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Commit indentation fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/git/GitManager.test.ts
          git rm .github/workflows/tmp-coderabbit-9212-indent.yml
          git commit -m "test(server): fix unknown-provider regression formatting"
          git push origin HEAD:fix/unknown-provider-pr-polling
