name: Upstream Fixes Land

# Lands what upstream-fixes.yml picked, without a person in the loop, and never
# lands a red build:
# - CI passed on the branch's current head: merge the pull request into main,
#   then pick again so a backlog drains run after run.
# - CI failed with more than one fix on the branch: pick again with half as
#   many, so the fixes before the bad one still land.
# - CI failed with one fix: retry the failed jobs once, in case a test was
#   flaky. If it fails again, skip that fix from now on and pick again.
# Only CI started by workflow_dispatch counts. That run covers every job; the
# pull_request run the bot's push also queues is left to wait for approval.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [upstream-fixes]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: upstream-fixes
  cancel-in-progress: false

jobs:
  land:
    name: Land or narrow upstream fixes
    if: >-
      github.event.workflow_run.event == 'workflow_dispatch' &&
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: upstream-fixes
      SHA: ${{ github.event.workflow_run.head_sha }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Decide
        id: decide
        run: |
          head=$(git rev-parse "origin/$BRANCH" 2>/dev/null || true)
          if [ "$head" != "$SHA" ]; then
            echo "CI ran on $SHA but the branch is now at ${head:-nothing}; a newer run decides."
            echo "action=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            echo "No open pull request for $BRANCH."
            echo "action=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          # CI tested the branch as built on main; if main moved since, that is
          # not what would land, so build the branch again instead.
          if ! git merge-base --is-ancestor origin/main "$SHA"; then
            echo "main moved after the branch was built; picking again."
            echo "action=repick" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          picks=$(git log --format=%B "origin/main..$SHA" | grep -c '^(cherry picked from commit ' || true)
          echo "picks=$picks" >> "$GITHUB_OUTPUT"
          if [ "$CONCLUSION" = success ]; then
            echo "action=merge" >> "$GITHUB_OUTPUT"
          elif [ "$picks" -gt 1 ]; then
            echo "action=narrow" >> "$GITHUB_OUTPUT"
            echo "max=$((picks / 2))" >> "$GITHUB_OUTPUT"
          elif [ "$picks" -eq 1 ] && [ "$RUN_ATTEMPT" -lt 2 ]; then
            echo "action=retry" >> "$GITHUB_OUTPUT"
          elif [ "$picks" -eq 1 ]; then
            echo "action=quarantine" >> "$GITHUB_OUTPUT"
            echo "sha=$(git log --format=%B "origin/main..$SHA" | sed -n 's/^(cherry picked from commit \([0-9a-f]*\))$/\1/p' | head -1)" >> "$GITHUB_OUTPUT"
          else
            echo "CI failed with no upstream fix on the branch; main itself needs a look."
            echo "action=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge
        if: steps.decide.outputs.action == 'merge'
        env:
          PR: ${{ steps.decide.outputs.pr }}
          PICKS: ${{ steps.decide.outputs.picks }}
        run: |
          gh pr view "$PR" --repo "$REPO" --json body --jq .body > "$RUNNER_TEMP/body.md"
          gh pr merge "$PR" --repo "$REPO" --rebase --match-head-commit "$SHA"
          echo "Merged $PICKS upstream fixes from #$PR."
          # Fixes that conflicted or were held back are past the cursor now, so
          # keep them on one issue where a person can pick them by hand.
          leftovers=$(awk '/^### (Did not apply|Held back)/{keep=1} /^### (Picked|Left out)/{keep=0} keep' "$RUNNER_TEMP/body.md")
          if [ -n "$leftovers" ]; then
            title="Upstream fixes to pick by hand"
            issue=$(gh issue list --repo "$REPO" --state open --search "in:title \"$title\"" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
            if [ -z "$issue" ]; then
              gh issue create --repo "$REPO" --title "$title" --body "The upstream fixes workflow could not take these on its own. Pick them by hand, or add them to \`.github/upstream-fixes/skip\`."
              issue=$(gh issue list --repo "$REPO" --state open --search "in:title \"$title\"" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
            fi
            printf 'From #%s:\n\n%s\n' "$PR" "$leftovers" | gh issue comment "$issue" --repo "$REPO" --body-file -
          fi
          gh workflow run upstream-fixes.yml --repo "$REPO" --ref main

      - name: Pick again on the new main
        if: steps.decide.outputs.action == 'repick'
        run: gh workflow run upstream-fixes.yml --repo "$REPO" --ref main

      - name: Narrow the batch
        if: steps.decide.outputs.action == 'narrow'
        env:
          PR: ${{ steps.decide.outputs.pr }}
          PICKS: ${{ steps.decide.outputs.picks }}
          MAX: ${{ steps.decide.outputs.max }}
        run: |
          gh pr comment "$PR" --repo "$REPO" --body "CI failed with $PICKS fixes. Picking again with the first $MAX to find the one that breaks it."
          gh workflow run upstream-fixes.yml --repo "$REPO" --ref main -f max="$MAX"

      - name: Retry once
        if: steps.decide.outputs.action == 'retry'
        run: gh run rerun "$RUN_ID" --repo "$REPO" --failed

      - name: Skip the fix that fails
        if: steps.decide.outputs.action == 'quarantine'
        env:
          PR: ${{ steps.decide.outputs.pr }}
          BAD: ${{ steps.decide.outputs.sha }}
        run: |
          gh pr comment "$PR" --repo "$REPO" --body "Upstream \`${BAD:0:12}\` fails CI on its own, twice. Skipping it from now on; pick it by hand if it matters."
          gh workflow run upstream-fixes.yml --repo "$REPO" --ref main -f quarantine="$BAD"
