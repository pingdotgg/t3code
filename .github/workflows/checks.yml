name: Mobile and runtime checks

on:
  push:
    branches: [main, feat/mobile-termux-codex]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck:runtime
      - run: npm run typecheck:mobile
      - run: npm test
      - run: npm run export:android --workspace @t3mobile/mobile
