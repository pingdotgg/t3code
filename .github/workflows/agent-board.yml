name: agent-board

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-board:
    name: agent-board
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@agent-board/app...

      - name: Fetch upstream T3 Code
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags --filter=blob:none upstream main

      - name: Engine boundary
        run: node apps/board/scripts/check-engine-untouched.mjs

      - name: Standards
        run: node standards/check-added-diagnostics.mjs

      - name: Standards dependency rules
        run: vp run --filter @agent-board/app standards:deps

      - name: Node tests
        run: node --test "apps/board/scripts/*.test.mjs" "apps/board/plugins/**/*.test.mjs" "standards/**/*.test.mjs"

      - name: Typecheck
        run: vp run --filter @agent-board/app typecheck

      - name: Unit tests
        working-directory: apps/board
        run: vp test run
