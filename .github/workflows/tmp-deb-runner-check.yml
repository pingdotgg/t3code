name: TEMP deb runner check

# Temporary proof for #13575: runs the release job's Linux build steps with
# the real build script on the release runners. Removed before merge.

on:
  pull_request:
    paths:
      - .github/workflows/tmp-deb-runner-check.yml

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.arch }} build on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-16vcpu-ubuntu-2404-arm
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            resource_key: linux-arm64
          - runner: blacksmith-32vcpu-ubuntu-2404
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
    env:
      VERSION: 0.0.99
    steps:
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
          CHECKOUT_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "$VERSION"

      - uses: ./.github/actions/setup-apt-mirrors

      - name: Install Linux desktop build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get install -y imagemagick
          fi

      - name: Build desktop artifact
        run: |
          start=$(date +%s)
          vp run dist:desktop:artifact --platform linux --target AppImage --arch ${{ matrix.arch }} --build-version "$VERSION" --verbose
          echo "::notice::${{ matrix.runner }}: desktop artifact step took $(( $(date +%s) - start ))s, nproc=$(nproc)"
          ls -la release
          for f in release/*.deb; do
            echo "::notice::$(basename "$f"): $(( $(stat -c %s "$f") / 1048576 )) MB, members: $(ar t "$f" | tr '\n' ' ')"
            dpkg-deb -f "$f" Package Version Architecture Depends
            dpkg-deb --fsys-tarfile "$f" | tar -tv | grep -E 'resources/(package-type|app-update.yml)|/t3code$'
            dpkg-deb --fsys-tarfile "$f" | tar -xO --wildcards '*/resources/package-type'
          done
          cat release/*linux*.yml

      - name: Build and smoke-test the CLI archive
        env:
          VP_NODE_VERSION: "26.8.2"
        run: |
          node apps/server/scripts/cli.ts build-exe --verbose
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/${{ matrix.resource_key }}"
          cp "native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor" "$RUNNER_TEMP/cli-resource-monitor/${{ matrix.resource_key }}/"
          node scripts/build-cli-archive.ts --platform linux --arch ${{ matrix.arch }} --version "$VERSION" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli
          node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "$VERSION"
