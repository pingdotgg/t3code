name: TEMP deb runner check

# Temporary proof for #13575. Removed before merge.

on:
  pull_request:
    paths:
      - .github/workflows/tmp-deb-runner-check.yml

permissions:
  contents: read

jobs:
  deb:
    name: .deb on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-16vcpu-ubuntu-2404-arm
            arch: arm64
            appimage_arch: arm64
          - runner: blacksmith-32vcpu-ubuntu-2404
            arch: x64
            appimage_arch: x86_64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      - name: Show host and apt sources before the mirror action
        run: |
          echo "arch=$(dpkg --print-architecture) nproc=$(nproc) $(xz --version | head -1)"
          cat /etc/apt/blacksmith-ubuntu-mirrors.txt 2>/dev/null || echo "no blacksmith mirror list"
          grep -rhE '^(URIs|deb) ' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null | sort -u

      - uses: ./.github/actions/setup-apt-mirrors

      - name: Install Linux desktop build libraries (same as the release job)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config squashfs-tools

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Unpack the published v0.0.42 AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.0.42 --repo pingdotgg/t3code --pattern "T3-Code-0.0.42-${{ matrix.appimage_arch }}.AppImage" --dir "$RUNNER_TEMP"
          f="$RUNNER_TEMP/T3-Code-0.0.42-${{ matrix.appimage_arch }}.AppImage"
          shoff=$(od -An -t u8 -j 40 -N 8 "$f" | tr -d ' ')
          es=$(od -An -t u2 -j 58 -N 2 "$f" | tr -d ' ')
          n=$(od -An -t u2 -j 60 -N 2 "$f" | tr -d ' ')
          unsquashfs -q -d "$RUNNER_TEMP/unpacked" -o $((shoff + es * n)) "$f"
          mkdir -p "$RUNNER_TEMP/proj/build/icons"
          for d in "$RUNNER_TEMP"/unpacked/usr/share/icons/hicolor/*/; do
            cp "$d/apps/t3code.png" "$RUNNER_TEMP/proj/build/icons/$(basename "$d").png"
          done
          rm -rf "$RUNNER_TEMP"/unpacked/{AppRun,t3code.desktop,t3code.png,.DirIcon,usr} "$RUNNER_TEMP/unpacked/resources/app-update.yml"

      - name: Build the .deb with threaded xz
        working-directory: ${{ runner.temp }}/proj
        run: |
          cat > package.json <<'EOF'
          {
            "name": "t3code", "version": "0.0.42", "description": "T3 Code desktop build",
            "homepage": "https://t3.codes", "author": "T3 Tools",
            "build": {
              "appId": "com.t3tools.t3code", "productName": "T3 Code (Alpha)", "electronVersion": "44.4.2",
              "artifactName": "T3-Code-${version}-${arch}.${ext}",
              "directories": { "output": "out", "buildResources": "build" },
              "publish": [{ "provider": "github", "owner": "pingdotgg", "repo": "t3code", "releaseType": "release" }],
              "linux": { "target": ["deb"], "executableName": "t3code", "icon": "icons", "category": "Development",
                         "synopsis": "Desktop GUI for coding agents", "maintainer": "T3 Tools <hello@t3.codes>" },
              "deb": { "depends": ["libasound2t64 | libasound2", "libatspi2.0-0t64 | libatspi2.0-0", "libgbm1",
                                   "libgtk-3-0t64 | libgtk-3-0", "libnotify4", "libnss3", "libsecret-1-0", "libuuid1",
                                   "libxss1", "libxtst6", "xdg-utils"] }
            }
          }
          EOF
          npm i -g electron-builder@26.15.6 >/dev/null
          start=$(date +%s)
          XZ_DEFAULTS=-T0 electron-builder --linux --${{ matrix.arch }} --prepackaged "$RUNNER_TEMP/unpacked" --publish never
          echo "::notice::${{ matrix.runner }}: .deb built in $(( $(date +%s) - start ))s, $(( $(stat -c %s out/*.deb) / 1048576 )) MB, nproc=$(nproc)"
          dpkg-deb -f out/*.deb Package Version Architecture
          dpkg-deb --info out/*.deb | grep -E 'data.tar'
          cat out/latest-linux*.yml
