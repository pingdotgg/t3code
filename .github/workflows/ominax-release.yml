name: OminaX Release

# Builds and publishes a tested T3 Learn release after every successful merge
# to main. The preflight uses the commit tested by OminaX CI, skips docs-only
# changes and commits already released, then assigns the next -learn.N version.
# A person can still cut a release from a tag such as v0.1.3-learn.1; that path
# keeps the tag's version and commit. Installers and the app updater follow the
# release after install tests pass and the promote job marks it latest.
# Builds are unsigned; macOS builds get an ad hoc signature. Upstream's
# release.yml also matches these tags but only runs in pingdotgg/t3code.
# Mac jobs run on GitHub's hosted Macs unless a repo variable names a
# self-hosted label: T3_LEARN_MAC_RUNNER for the desktop builds of CI-triggered
# runs on main (hand-tagged runs stay hosted) and
# T3_LEARN_MAC_INSTALL_RUNNER for the macOS install tests. Only a host that
# gives each job a clean machine (the rented Mac's throwaway VMs) may take the
# install tests, because they write /Applications.

on:
  push:
    tags:
      - "v*-learn.*"
  workflow_run:
    workflows: ["OminaX CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: ominax-release
  cancel-in-progress: false

permissions:
  # Windows builds read this run's artifact list to wait for the Linux CLI archive.
  actions: read
  contents: read

jobs:
  preflight:
    name: Check version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      skip: ${{ steps.version.outputs.skip }}
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - id: version
        name: Compute release version
        env:
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: bash .github/scripts/ominax-release-version.sh

      # Lists what changed since the release the updater last offered, so
      # changes in an unpromoted pre-release still reach users.
      - name: Write release notes
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          set -euo pipefail
          since="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)" ||
            since="$(git tag --list 'v*-learn.*' | sort -V | tail -n 1)"
          bash .github/scripts/ominax-release-notes.sh "$since" "$RELEASE_COMMIT" > release-notes.md
          cat release-notes.md

      - name: Upload release notes
        if: steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  # The server bundle, web client and Electron main are built once and handed
  # to every platform job as `js-bundle`, as in upstream's release.yml.
  build_bundle:
    if: needs.preflight.outputs.skip != 'true'
    name: Build JS bundle
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install bundle dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - uses: ./.github/actions/setup-apt-mirrors

      - name: Install browser secret helper build libraries
        # Azure runner DNS stopped resolving *.ubuntu.com on 2026-11-11 (REL-68).
        run: |
          sudo resolvectl dns eth0 1.1.1.1 8.8.8.8
          sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build JS bundle
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: vp run build:desktop

      - name: Upload JS bundle
        uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  desktop_mac_arm64:
    if: needs.preflight.outputs.skip != 'true'
    name: Desktop macOS arm64
    needs: [preflight, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.commit }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: macOS arm64
      runner: ${{ github.event_name == 'workflow_run' && vars.T3_LEARN_MAC_RUNNER || 'macos-26' }}
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: true
      # med's MacBook runs jobs over SSH with no GUI session; the hosted install tests still launch the app.
      launch_check: ${{ !(github.event_name == 'workflow_run' && vars.T3_LEARN_MAC_RUNNER == 't3-learn-macbook') }}

  # Cross-built on Apple silicon, as upstream does.
  desktop_mac_x64:
    if: needs.preflight.outputs.skip != 'true'
    name: Desktop macOS x64
    needs: [preflight, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.commit }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: macOS x64
      runner: ${{ github.event_name == 'workflow_run' && vars.T3_LEARN_MAC_RUNNER || 'macos-26' }}
      platform: mac
      target: dmg
      arch: x64
      rust_target: x86_64-apple-darwin
      resource_key: darwin-x64

  # The Linux CLI archives become the Windows builds' WSL runtime.
  desktop_linux_x64:
    if: needs.preflight.outputs.skip != 'true'
    name: Desktop Linux x64
    needs: [preflight, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.commit }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      launch_check: true

  # node-pty compiles from source on Linux, so arm64 builds on arm64 hardware.
  desktop_linux_arm64:
    if: needs.preflight.outputs.skip != 'true'
    name: Desktop Linux arm64
    needs: [preflight, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.commit }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Linux arm64
      runner: ubuntu-24.04-arm
      platform: linux
      target: AppImage
      arch: arm64
      rust_target: aarch64-unknown-linux-gnu
      resource_key: linux-arm64
      cli_archive: true

  # Windows builds on Linux and runs its native checks on Windows.
  desktop_win_x64:
    if: needs.preflight.outputs.skip != 'true'
    name: Desktop Windows x64
    needs: [preflight, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.commit }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Windows x64
      runner: ubuntu-24.04
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: true

  desktop_win_arm64:
    if: needs.preflight.outputs.skip != 'true'
    name: Desktop Windows arm64
    needs: [preflight, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.commit }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Windows arm64
      runner: ubuntu-24.04
      verify_runner: windows-11-arm
      platform: win
      target: nsis
      arch: arm64
      rust_target: aarch64-pc-windows-msvc
      resource_key: win32-arm64
      cli_archive: true

  release:
    if: needs.preflight.outputs.skip != 'true'
    name: Publish GitHub pre-release
    needs:
      [
        preflight,
        desktop_mac_arm64,
        desktop_mac_x64,
        desktop_linux_x64,
        desktop_linux_arm64,
        desktop_win_x64,
        desktop_win_arm64,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      # The OminaX CLI's update, service install and SSH remotes fetch these.
      - name: Download all CLI archives
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      # electron-updater reads one manifest per platform and picks the file
      # entry for the running arch, so the per-arch manifests are merged.
      - name: Merge updater manifests
        run: |
          set -euo pipefail
          cd release-assets
          node ../scripts/merge-update-manifests.ts --platform mac latest-mac.yml latest-mac-x64.yml
          rm latest-mac-x64.yml
          node ../scripts/merge-update-manifests.ts --platform win latest-win-x64.yml latest-win-arm64.yml latest.yml
          rm latest-win-x64.yml latest-win-arm64.yml
          # electron-builder's config dump, not a feed.
          rm -f builder-debug.yml

      # The installers verify downloads against SHA256SUMS and find the
      # release's files through it.
      - name: Add installers and checksums
        run: |
          set -euo pipefail
          cp scripts/ominax-install.sh release-assets/install.sh
          cp scripts/ominax-install.ps1 release-assets/install.ps1
          cd release-assets
          sha256sum *.dmg *.zip *.AppImage *.deb *.exe t3-*.tar.gz install.sh install.ps1 > SHA256SUMS
          cat SHA256SUMS

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes

      # The generic update feed carries no release body, so the desktop update
      # prompt reads "What's new" from each manifest: this release plus the last
      # 5 promoted ones (older bodies lack the section), newest first, so a
      # skipped release's notes still show. JSON is valid YAML.
      - name: Add release notes to updater manifests
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          notes="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" |
            jq -c --arg v "$VERSION" --rawfile body release-notes.md '
              def whats_new: split("<details>")[0] | sub("\\s+$"; "");
              [{version: $v, note: ($body | whats_new)}] +
              ([.[] | select((.draft or .prerelease or .tag_name == "v" + $v) | not)
                    | select(.body // "" | startswith("### What'"'"'s new"))
                    | {version: (.tag_name | ltrimstr("v")), note: (.body | whats_new)}][:5])')"
          echo "$notes" | jq .
          for manifest in release-assets/latest*.yml; do
            echo "releaseNotes: $notes" >> "$manifest"
          done

      - name: Publish pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.commit }}
          name: OminaX ${{ needs.preflight.outputs.version }}
          body_path: release-notes.md
          prerelease: true
          make_latest: false
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/*.yml
            release-assets/t3-*.tar.gz
            release-assets/install.sh
            release-assets/install.ps1
            release-assets/SHA256SUMS
          fail_on_unmatched_files: true
          token: ${{ github.token }}

  # Installs the pre-release with its one-line installer on each platform,
  # on a clean runner and next to an installed T3 Code, then uninstalls it.
  install_test:
    if: needs.preflight.outputs.skip != 'true'
    name: Install on ${{ matrix.os }} ${{ matrix.arch }} (${{ matrix.scenario }})
    needs: [preflight, release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: "${{ vars.T3_LEARN_MAC_INSTALL_RUNNER || 'macos-26' }}", scenario: fresh }
          - {
              os: "${{ vars.T3_LEARN_MAC_INSTALL_RUNNER || 'macos-26' }}",
              scenario: next-to-t3-code,
            }
          - {
              os: "${{ vars.T3_LEARN_MAC_INSTALL_RUNNER || 'macos-15-intel' }}",
              arch: x64,
              scenario: fresh,
            }
          - {
              os: "${{ vars.T3_LEARN_MAC_INSTALL_RUNNER || 'macos-15-intel' }}",
              arch: x64,
              scenario: next-to-t3-code,
            }
          - { os: ubuntu-24.04, scenario: fresh }
          - { os: ubuntu-24.04, scenario: next-to-t3-code }
          - { os: ubuntu-24.04, scenario: appimage }
          - { os: ubuntu-24.04, scenario: service }
          - { os: ubuntu-24.04-arm, scenario: fresh }
          - { os: windows-2025, scenario: fresh }
          - { os: windows-2025, scenario: next-to-t3-code }
          - { os: windows-11-arm, scenario: fresh }
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACTS: ${{ github.workspace }}/install-test
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # The macOS update check drives the installed app with playwright-core.
      - name: Setup Vite+
        if: runner.os == 'macOS' && matrix.scenario == 'fresh'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Install and check (macOS, Linux)
        if: runner.os != 'Windows'
        # On the rented Apple silicon Mac, the Intel rows run under Rosetta.
        run: ${{ matrix.arch == 'x64' && runner.arch == 'ARM64' && 'arch -x86_64 ' || '' }}/bin/bash .github/scripts/ominax-install-test.sh "${{ matrix.scenario }}" "$VERSION"

      - name: Install and check (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: .github/scripts/ominax-install-test.ps1 -Scenario "${{ matrix.scenario }}" -Version $env:VERSION

      - name: Explain withheld promotion
        if: failure()
        run: echo "Install tests failed; this release remains a pre-release and is invisible to update checks." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: install-test-${{ matrix.os }}-${{ matrix.arch || 'native' }}-${{ matrix.scenario }}
          path: install-test
          if-no-files-found: ignore

  promote:
    name: Promote tested release
    if: needs.install_test.result == 'success' && needs.preflight.outputs.skip != 'true'
    needs: [preflight, install_test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Mark release latest
        run: gh release edit "v$VERSION" --prerelease=false --latest
      - name: Summarize promotion
        run: echo "OminaX v$VERSION passed install tests and is now latest." >> "$GITHUB_STEP_SUMMARY"
