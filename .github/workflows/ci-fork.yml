# Fork-local CI for latheworks/t3code on Blacksmith runners.
# Upstream .github/workflows/ci.yml is left untouched and disabled in repo settings.
# Kept lean on purpose: no Rust or mobile jobs. Tests follow upstream's split
# (shared Test, Test Web, sharded Test Server) because one job running every
# suite on a 4 vCPU runner starved the web suite's module imports.
name: CI (fork)

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-fork-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Reject repository-owned PR assets
        run: |
          files="$(git ls-files .github/pr-assets)"
          if test -n "$files"; then
            printf 'PR evidence must be uploaded to GitHub, not committed:\n%s\n' "$files" >&2
            exit 1
          fi

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @lathe/desktop ensure:electron

      # Files/dependencies are repo-wide; export checks cover clean workspaces only.
      - name: Check unused code
        run: vp run knip:check

      - name: Check generated Expo GraphQL operations
        run: vp run --filter lathe generate --check

      - name: Check generated Linear GraphQL operations
        run: vp run --filter @lathe/issue-tracker-linear generate --check

      - name: Check i18n catalogs
        run: vp run i18n:check

      - name: Check
        run: vp check

      - name: Typecheck
        run: vpr typecheck

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Verify preload bundle output
        run: node apps/desktop/scripts/verify-preload-bundle.mjs

  # Every package except lathe (apps/server) and the web app, which get their own jobs.
  test:
    name: Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @lathe/desktop ensure:electron

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Test release workflow scripts
        run: node --test .github/scripts/check-nightly-release.test.cjs .github/scripts/main-ci-verdict.test.cjs

      - name: Test
        run: |
          set -o pipefail
          # The runner's trace writer can crash on surrogate pairs in test output.
          vp run --parallel --concurrency-limit 4 --filter '!lathe' --filter '!@lathe/monorepo' --filter '!@lathe/web' test 2>&1 | python3 -u -c '
          import sys
          for line in sys.stdin:
              sys.stdout.write(line.encode("ascii", "backslashreplace").decode("ascii"))
          '

  # Upstream shards web tests over two 8 vCPU runners. One 4 vCPU runner running all of them
  # lost its Chromium page partway through, so the fork shards them three ways.
  test_web:
    name: Test Web ${{ matrix.shard }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # The browser project runs React tests in headless Chromium.
      - name: Install Chromium for web browser tests
        run: node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium

      # Upstream runs these on 8 vCPU runners. Here the heaviest browser files
      # (document previews, a full app render, a very long timeline) time out
      # while other browser files share the runner (#115), so they run after the rest.
      - name: Test
        run: >-
          vp run --filter @lathe/web test
          --exclude "**/AttachmentFilePreview.browser.test.tsx"
          --exclude "**/ChatView.browser.test.tsx"
          --exclude "**/MessagesTimeline.browser.test.tsx"
          --shard ${{ matrix.shard }}/${{ strategy.job-total }}

      # MessagesTimeline gets its own run: after ChatView in the same run, upstream's
      # "keeps the worked-for heading in place" test lands 104px off.
      - name: Test heavy browser files
        if: matrix.shard == 1
        working-directory: apps/web
        run: |
          vp test run --project browser --no-file-parallelism src/components/files/AttachmentFilePreview.browser.test.tsx src/components/ChatView.browser.test.tsx
          vp test run --project browser src/components/chat/MessagesTimeline.browser.test.tsx

  # apps/server runs its files one at a time (fileParallelism: false), so shards
  # spread them over runners. Files split by recorded duration
  # (apps/server/src/testUtils/weightedShardSequencer.ts).
  test_server:
    name: Test Server ${{ matrix.shard }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Install Chromium for server browser integration tests
        run: node apps/server/node_modules/playwright-core/cli.js install --with-deps --only-shell chromium

      - name: Test
        run: vp run --filter lathe test --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  release_smoke:
    name: Release Smoke
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@lathe/scripts...

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts
