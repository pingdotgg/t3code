name: Temporary PR 9215 main merge

on:
  push:
    branches:
      - fix/review-diff-preview-budget

permissions:
  contents: write

jobs:
  merge-and-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-diff-preview-budget
          fetch-depth: 0

      - name: Merge current upstream main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/pingdotgg/t3code.git 2>/dev/null || git remote set-url upstream https://github.com/pingdotgg/t3code.git
          git fetch upstream main
          set +e
          git merge --no-commit --no-ff upstream/main
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -n "$conflicts" ]; then
            unexpected=0
            while IFS= read -r file; do
              case "$file" in
                apps/server/src/vcs/GitVcsDriverCore.test.ts) ;;
                *) echo "Unexpected merge conflict: $file"; unexpected=1 ;;
              esac
            done <<< "$conflicts"
            test "$unexpected" -eq 0
            git checkout --theirs -- apps/server/src/vcs/GitVcsDriverCore.test.ts
            git add apps/server/src/vcs/GitVcsDriverCore.test.ts
          elif [ "$merge_status" -ne 0 ]; then
            echo "Merge failed without conflict entries"
            exit "$merge_status"
          fi

          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Verify merged implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          core = Path("apps/server/src/vcs/GitVcsDriverCore.ts").read_text()
          required = [
              "const REVIEW_DIFF_PATCH_MAX_OUTPUT_BYTES = REVIEW_DIFF_FILE_MAX_OUTPUT_BYTES;",
              "const REVIEW_UNTRACKED_DIFF_MAX_OUTPUT_BYTES = REVIEW_DIFF_FILE_MAX_OUTPUT_BYTES;",
              "const REVIEW_UNTRACKED_DIFF_TOTAL_MAX_OUTPUT_BYTES = REVIEW_DIFF_FILE_MAX_OUTPUT_BYTES;",
              "const REVIEW_UNTRACKED_DIFF_BATCH_SIZE = 4;",
              "decoder.decode(chunkToDecode, { stream: true })",
              "const readUnifiedWorkingTreeReviewDiff = Effect.fn",
              "const readUntrackedDiff = (relativePath: string) =>",
              "const nextBytes = encoder.encode(next).byteLength;",
          ]
          missing = [needle for needle in required if needle not in core]
          if missing:
              raise SystemExit("Merged implementation lost required behavior: " + repr(missing))

          fallback_start = core.find('const readUntrackedReviewDiffs = Effect.fn')
          fallback_end = core.find('const readTrackedReviewDiff = Effect.fn', fallback_start)
          fallback = core[fallback_start:fallback_end]
          if "...PATCH_RENDER_PREFIX_ARGS" not in fallback:
              raise SystemExit("Merged fallback lost PATCH_RENDER_PREFIX_ARGS")
          if 'import * as Arr from "effect/Array";' in core:
              raise SystemExit("Merged implementation retained now-unused effect/Array import")

          test = Path("apps/server/src/vcs/GitVcsDriverCore.utf8.test.ts")
          test_text = test.read_text()
          old = '''    const truncatedMarker = "\\n\\n[truncated]";
              assert.isTrue(source.diff.endsWith(truncatedMarker));
              assert.isAtMost(
                new TextEncoder().encode(source.diff.slice(0, -truncatedMarker.length)).byteLength,
                1024 * 1024,
              );'''.replace("              ", "")
          new = '    assert.isAtMost(new TextEncoder().encode(source.diff).byteLength, 1024 * 1024);'
          if old in test_text:
              test_text = test_text.replace(old, new, 1)
          elif new not in test_text:
              raise SystemExit("UTF-8 byte-budget assertion not found")
          test.write_text(test_text)
          PY

          git add apps/server/src/vcs/GitVcsDriverCore.utf8.test.ts
          git diff --check --cached

      - name: Commit and push resolved branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-merge-9215.yml
          git add -A
          git commit -m "merge main and preserve review diff preview limits"
          git push origin HEAD:fix/review-diff-preview-budget
