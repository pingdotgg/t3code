name: Debug Swift build failure

# TEMPORARY diagnostic workflow — not part of the release pipeline.
# Reproduces the release workflow's cold `swift test` compile failure and
# dumps crash/jetsam reports so the root cause is visible. Delete after
# diagnosis.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    name: "probe ${{ matrix.variant }}"
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant:
          - j2 # mirrors the current release workflow: -j 2
          - j1 # serial SwiftPM jobs
          - batchlimit # -j 2 with small frontend batches
          - xcode266 # same command as j2 but on Xcode 26.6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        if: matrix.variant == 'xcode266'
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: System info
        run: |
          sysctl hw.memsize hw.ncpu hw.model
          df -h / | tail -1
          swift --version
          xcodebuild -version

      - name: Probe swift test
        id: probe
        continue-on-error: true
        run: |
          set -o pipefail
          JOBS=2
          EXTRA=()
          if [[ "${{ matrix.variant }}" == "j1" ]]; then JOBS=1; fi
          if [[ "${{ matrix.variant }}" == "batchlimit" ]]; then
            EXTRA=(-Xswiftc -driver-batch-size-limit -Xswiftc 20)
          fi
          swift test --package-path apps/mac --no-parallel -j "$JOBS" "${EXTRA[@]}" 2>&1 | tail -40
          echo "probe_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Dump crash and jetsam reports
        if: always()
        run: |
          echo "probe_exit=${{ steps.probe.outputs.probe_exit }}"
          echo "=== DiagnosticReports ==="
          ls -lt ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -10 || true
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -3); do
            echo "=== $f ==="
            head -c 6000 "$f"
            echo
          done
          echo "=== jetsam (memorystatus) events ==="
          log show --last 15m --style compact \
            --predicate 'eventMessage CONTAINS[c] "memorystatus" OR eventMessage CONTAINS[c] "jetsam"' \
            2>/dev/null | tail -30 || true
