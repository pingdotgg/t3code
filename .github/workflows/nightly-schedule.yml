name: Check nightly release

on:
  schedule:
    # Avoid minute zero, when GitHub scheduled jobs are busiest.
    - cron: "8,38 * * * *"

concurrency:
  group: nightly-schedule
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts

      - name: Dispatch nightly when ready
        uses: actions/github-script@v8
        with:
          script: |
            const { shouldReleaseNightly } = require('./.github/scripts/check-nightly-release.cjs');
            if (await shouldReleaseNightly({ github, context, core, checkActiveRuns: true })) {
              await github.rest.actions.createWorkflowDispatch({
                ...context.repo,
                workflow_id: 'release.yml',
                ref: context.ref,
                inputs: { channel: 'nightly', automatic: 'true' },
              });
            }
