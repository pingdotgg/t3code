name: Windows build check

# The Windows app's Rust shell contains code that only compiles under
# `cfg(windows)` — the Job Object that owns the sidecar tree, the Credential
# Manager store, and the DWM backdrop calls. None of it can be type-checked on
# a macOS or Linux development machine (cross-compiling needs the Windows SDK
# headers and `llvm-rc`), so this job is the verification loop for that half of
# the app. It mirrors `ci-mac.yml`: build before merge, not after.
on:
  pull_request:
    branches:
      - main
    # Everything this job's result actually depends on:
    #   apps/windows      the app itself
    #   packages          what the renderer imports (contracts, client-runtime,
    #                     shared) — a schema change breaks the typecheck here
    #   apps/server       the sidecar contract the Rust shell mirrors by hand.
    #                     `sidecar/bootstrap.rs` asserts the exact JSON keys the
    #                     server decodes off the bootstrap fd, and its CLI flags
    #                     are hard-coded in `sidecar/process.rs`, so a server
    #                     change is exactly when those tests need to re-run.
    #   manifests         the lockfile and root config decide what the install,
    #                     typecheck, lint, and renderer build actually resolve
    paths:
      - "apps/windows/**"
      - "apps/server/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "vite.config.ts"
      - ".github/workflows/ci-windows.yml"
  workflow_dispatch:

concurrency:
  group: ci-windows-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test apps/windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up vp
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # `AGENTS.md` requires both of these to pass, but nothing runs them
      # before merge today: `ci-mac.yml` is Swift-only, and `release-mac.yml`
      # runs them after merge as part of shipping. This workflow now triggers
      # on `packages/**`, `apps/server/**` and the workspace manifests, which
      # makes it the only pre-merge job that sees those changes at all — so it
      # is where they belong until a platform-neutral CI workflow exists. They
      # run before the Rust toolchain is even installed, because a shared
      # contract break should fail in seconds rather than after a cargo build.
      #
      # Kept as two steps on purpose. GitHub's `pwsh` shell propagates only the
      # *last* command's exit code, so `vp check` failing inside a multi-line
      # `run:` would be masked by `vp run typecheck` succeeding.
      - name: Repository lint and format check
        run: vp check

      - name: Repository typecheck
        run: vp run typecheck

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Restore cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/windows/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/windows/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Typecheck the renderer
        run: vp run --filter @sergecode/windows typecheck

      - name: Test the renderer
        run: vp run --filter @sergecode/windows test

      # `tauri build` reads `frontendDist`, and `generate_context!` fails if it
      # is missing, so the renderer bundle has to exist before any cargo step.
      - name: Build the renderer
        run: vp run --filter @sergecode/windows build

      - name: Check formatting of the Rust shell
        working-directory: apps/windows/src-tauri
        run: cargo fmt --check

      - name: Lint the Rust shell
        working-directory: apps/windows/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test the Rust shell
        working-directory: apps/windows/src-tauri
        run: cargo test
