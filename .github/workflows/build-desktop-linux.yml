name: Build Desktop Linux (Unsigned)

# Builds unsigned Linux AppImage desktop installers and optional standalone CLI
# archives on GitHub's official Ubuntu runners (x64 / arm64).
on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-nightly.*"
      - "!v*-preview.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version override (defaults to tag without v prefix or apps/desktop/package.json version)"
        required: false
        type: string
      arch:
        description: "Target architecture"
        required: false
        default: x64
        type: choice
        options:
          - x64
          - arm64
          - both
      build_cli:
        description: "Also build standalone Linux CLI tarball (for install.sh)"
        required: false
        default: true
        type: boolean
      publish_release:
        description: "Create or update a GitHub Release with the built artifacts"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-desktop-linux-${{ github.ref }}-${{ inputs.arch || 'x64' }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve Linux targets
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      matrix: ${{ steps.meta.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            apps/desktop/package.json

      - id: meta
        name: Resolve version and matrix
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ARCH: ${{ inputs.arch || 'x64' }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_VERSION" ]]; then
            version="${INPUT_VERSION#v}"
          elif [[ "$REF_TYPE" == "tag" && "$REF_NAME" == v* ]]; then
            version="${REF_NAME#v}"
          else
            version="$(node -p "require('./apps/desktop/package.json').version")"
          fi
          tag="v${version}"
          if [[ "$INPUT_ARCH" == "both" ]]; then
            matrix='[{"arch":"x64","runner":"ubuntu-24.04","rust_target":"x86_64-unknown-linux-gnu"},{"arch":"arm64","runner":"ubuntu-24.04-arm","rust_target":"aarch64-unknown-linux-gnu"}]'
          elif [[ "$INPUT_ARCH" == "arm64" ]]; then
            matrix='[{"arch":"arm64","runner":"ubuntu-24.04-arm","rust_target":"aarch64-unknown-linux-gnu"}]'
          else
            matrix='[{"arch":"x64","runner":"ubuntu-24.04","rust_target":"x86_64-unknown-linux-gnu"}]'
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build Linux (${{ matrix.arch }})
    needs: [prepare]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      T3CODE_TELEMETRY_CHANNEL: dev
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Install Linux desktop build libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config libgtk-3-0t64 libnss3 libasound2t64 libgbm1 imagemagick

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor
          key: resource-monitor-${{ matrix.rust_target }}-${{ hashFiles('.cargo/config.toml', 'native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Cache Linux capture helpers
        id: capture_helper_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/kde-snap-shot/target/${{ matrix.rust_target }}/release/t3-kde-snap-shot
            native/hyprland-snap-shot/target/${{ matrix.rust_target }}/release/t3-hyprland-snap-shot
          key: linux-capture-helpers-${{ matrix.rust_target }}-${{ hashFiles('native/kde-snap-shot/Cargo.lock', 'native/kde-snap-shot/Cargo.toml', 'native/kde-snap-shot/src/**', 'native/hyprland-snap-shot/Cargo.lock', 'native/hyprland-snap-shot/Cargo.toml', 'native/hyprland-snap-shot/src/**', 'native/hyprland-snap-shot/protocols/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true' || steps.capture_helper_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Build resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "${{ matrix.rust_target }}"

      - name: Align package versions
        shell: bash
        run: node scripts/update-release-package-versions.ts "${{ needs.prepare.outputs.version }}"

      - name: Build JS bundle
        shell: bash
        run: vp run build:desktop:bundle

      - name: Build standalone Linux CLI archive
        if: github.event_name == 'push' || inputs.build_cli == true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-web-brand-assets.ts production apps/server/dist/client
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor"
          cp "native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor" \
            "$RUNNER_TEMP/cli-resource-monitor/t3-resource-monitor"
          node scripts/build-cli-archive.ts \
            --platform linux \
            --arch "${{ matrix.arch }}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Package unsigned Linux AppImage
        shell: bash
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
          T3CODE_DESKTOP_REUSE_LINUX_CAPTURE_HELPERS: ${{ steps.capture_helper_cache.outputs.cache-hit == 'true' }}
        run: |
          vp run dist:desktop:artifact \
            --platform linux \
            --target AppImage \
            --arch "${{ matrix.arch }}" \
            --build-version "${{ needs.prepare.outputs.version }}" \
            --skip-build \
            --verbose

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          out_dir="$RUNNER_TEMP/linux-release"
          mkdir -p "$out_dir"
          for file in release/*.AppImage release/*.blockmap release/latest-linux*.yml release-cli/*; do
            if [[ -f "$file" ]]; then
              cp "$file" "$out_dir/"
            fi
          done
          ls -la "$out_dir"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tix-desktop-linux-${{ matrix.arch }}-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/linux-release/*
          retention-days: 30
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: github.event_name == 'push' || inputs.publish_release == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "tix ${APP_VERSION}" \
              --generate-notes || true
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/linux-release/* --clobber
