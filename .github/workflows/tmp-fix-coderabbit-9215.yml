name: Temporary PR 9215 trailing-space fix

on:
  push:
    branches:
      - fix/review-diff-preview-budget
    paths:
      - .github/workflows/tmp-fix-coderabbit-9215.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/review-diff-preview-budget
          fetch-depth: 0
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Preserve trailing spaces in fallback patches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          core_path = Path("apps/server/src/vcs/GitVcsDriverCore.ts")
          core = core_path.read_text()
          old = "const combinedDiff = [tracked.diff.trimEnd(), untracked.diff.trimEnd()]"
          new = "const combinedDiff = [\n              tracked.diff.replace(/\\r?\\n$/, \"\"),\n              untracked.diff.replace(/\\r?\\n$/, \"\"),\n            ]"
          if old not in core:
              raise SystemExit("fallback combinedDiff anchor not found")
          core = core.replace(old, new, 1)
          core_path.write_text(core)

          test_path = Path("apps/server/src/vcs/GitVcsDriverCore.utf8.test.ts")
          test = test_path.read_text()
          sentinel = 'it.effect("preserves trailing spaces when joining fallback patches"'
          if sentinel not in test:
              test += r'''

it.effect("preserves trailing spaces when joining fallback patches", () =>
  Effect.gen(function* () {
    const cwd = yield* makeTmpDir();
    yield* initRepoWithCommit(cwd);
    const pathService = yield* Path.Path;

    yield* writeTextFile(cwd, "tracked.txt", "before\n");
    yield* git(cwd, ["add", "tracked.txt"]);
    yield* git(cwd, ["commit", "-m", "add trailing-space fixture"]);
    yield* writeTextFile(cwd, "tracked.txt", "tracked trailing spaces   \n");
    yield* writeTextFile(cwd, "untracked.txt", "untracked trailing spaces   \n");

    const blockerPath = pathService.join(cwd, "tmp-blocker");
    yield* writeTextFile(cwd, "tmp-blocker", "not a directory\n");
    const driver = yield* GitVcsDriver.GitVcsDriver;
    const preview = yield* Effect.acquireUseRelease(
      Effect.sync(() => {
        const previous = process.env.TMPDIR;
        process.env.TMPDIR = blockerPath;
        return previous;
      }),
      () => driver.getReviewDiffPreview({ cwd }),
      (previous) =>
        Effect.sync(() => {
          if (previous === undefined) {
            delete process.env.TMPDIR;
          } else {
            process.env.TMPDIR = previous;
          }
        }),
    );
    const source = preview.sources.find((candidate) => candidate.kind === "working-tree");

    assert.isDefined(source);
    assert.include(source.diff, "+tracked trailing spaces   \n");
    assert.include(source.diff, "+untracked trailing spaces   \n");
  }).pipe(Effect.provide(TestLayer)),
);
'''
          test_path.write_text(test)
          PY

      - name: Format changed files
        shell: bash
        run: |
          set -euo pipefail
          vp fmt apps/server/src/vcs/GitVcsDriverCore.ts apps/server/src/vcs/GitVcsDriverCore.utf8.test.ts

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          vp test run apps/server/src/vcs/GitVcsDriverCore.utf8.test.ts
          vp fmt --check apps/server/src/vcs/GitVcsDriverCore.ts apps/server/src/vcs/GitVcsDriverCore.utf8.test.ts
          vp lint --report-unused-disable-directives apps/server/src/vcs/GitVcsDriverCore.ts apps/server/src/vcs/GitVcsDriverCore.utf8.test.ts
          vp run --filter t3 typecheck
          git diff --check

      - name: Commit fix and remove temporary workflow
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/vcs/GitVcsDriverCore.ts apps/server/src/vcs/GitVcsDriverCore.utf8.test.ts
          git commit -m "fix(server): preserve trailing spaces in fallback diff"
          git rm .github/workflows/tmp-fix-coderabbit-9215.yml
          git commit -m "chore: remove temporary PR 9215 fix workflow"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/c8dhjp4tyv-bit/t3code.git" HEAD:fix/review-diff-preview-budget
