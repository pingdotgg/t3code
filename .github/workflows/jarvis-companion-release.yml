name: Release Jarvis Companion

on:
  workflow_call:
    inputs:
      version:
        description: "Companion package version to build"
        required: true
        type: string
      public_release:
        description: "Whether this is a stable public release"
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: "Companion package version (defaults to package.json)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: jarvis-companion-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and test Windows companion
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@jarvis/companion...

      - name: Verify companion
        run: |
          vp test run apps/companion/src/bubble-state.test.ts apps/companion/src/companion-presentation.test.ts apps/companion/src/companion-webgl.test.ts apps/companion/src/development.test.ts apps/companion/src/host.test.ts apps/companion/src/inline-json.test.ts apps/companion/src/pocket-lifecycle.test.ts apps/companion/src/pocket-worker.test.ts apps/companion/src/launch.test.ts apps/companion/src/managed-status.test.ts apps/companion/src/native-speech.test.ts apps/companion/src/recognition-evaluation.test.ts apps/companion/src/report-connection.test.ts apps/companion/src/setup-surface.test.ts apps/companion/src/speech-interrupt.test.ts apps/companion/src/updates.test.ts
          vp run --filter @jarvis/companion typecheck

      - name: Smoke native speech runtimes
        run: |
          vp run --filter @jarvis/companion prepare:voice
          vp run --filter @jarvis/companion smoke:voice

      - id: companion_version
        name: Verify companion version and release channel
        shell: pwsh
        run: |
          $version = node -p "require('./apps/companion/package.json').version"
          $expected = "${{ inputs.version }}"
          if ($expected -and $version -ne $expected) {
            throw "Companion package version '$version' does not match requested version '$expected'."
          }
          if ("${{ inputs.public_release }}" -eq 'true') {
            throw 'Stable Companion publication is closed: Windows artifacts are unsigned.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build Windows installer
        run: vp run --filter @jarvis/companion package:win:ci

      - name: Smoke installed Companion speech
        shell: pwsh
        run: |
          $version = node -p "require('./apps/companion/package.json').version"
          $installerPath = (Resolve-Path "apps/companion/dist/Jarvis-Companion-$version-x64.exe").Path
          $installName = "jarvis-companion-speech-smoke-$([guid]::NewGuid().ToString('N'))"
          $installRoot = [System.IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP $installName))
          $runnerTempRoot = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\', '/')
          $runnerTempPrefix = "$runnerTempRoot\"
          if (-not $installRoot.StartsWith($runnerTempPrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Refusing to install speech smoke outside RUNNER_TEMP: $installRoot"
          }
          New-Item -ItemType Directory -Path $installRoot -Force | Out-Null
          function Invoke-CompanionLifecycleProcess {
            param(
              [Parameter(Mandatory = $true)] [string] $Label,
              [Parameter(Mandatory = $true)] [string] $FilePath,
              [Parameter(Mandatory = $true)] [string[]] $ArgumentList,
              [Parameter(Mandatory = $true)] [int] $TimeoutMilliseconds
            )
            $started = Get-Date
            $process = Start-Process -FilePath $FilePath -ArgumentList $ArgumentList -PassThru
            if (-not $process.WaitForExit($TimeoutMilliseconds)) {
              $elapsed = ((Get-Date) - $started).TotalSeconds
              Write-Host "[companion-ci] $Label timed out after $([math]::Round($elapsed, 1))s (PID $($process.Id)); stopping that process."
              if (-not $process.HasExited) {
                $null = Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              }
              throw "$Label timed out after $([math]::Round($elapsed, 1)) seconds."
            }
            $process.Refresh()
            $elapsed = ((Get-Date) - $started).TotalSeconds
            Write-Host "[companion-ci] $Label finished in $([math]::Round($elapsed, 1))s (exit $($process.ExitCode))"
            if ($process.ExitCode -ne 0) {
              throw "$Label failed: $($process.ExitCode)"
            }
            return $process
          }
          function Remove-CompanionSmokeInstallRoot {
            param(
              [Parameter(Mandatory = $true)] [string] $ResolvedInstallRoot,
              [Parameter(Mandatory = $true)] [int] $TimeoutMilliseconds
            )
            $deadline = (Get-Date).AddMilliseconds($TimeoutMilliseconds)
            $attempt = 0
            while (Test-Path -LiteralPath $ResolvedInstallRoot) {
              $attempt++
              $lastError = $null
              try {
                Remove-Item -LiteralPath $ResolvedInstallRoot -Recurse -Force -ErrorAction Stop
              } catch {
                $lastError = $_.Exception.Message
              }
              if (-not (Test-Path -LiteralPath $ResolvedInstallRoot)) {
                Write-Host "[companion-ci] Removed speech smoke install root after $attempt cleanup attempt(s)."
                return
              }
              $remainingMilliseconds = [int](($deadline - (Get-Date)).TotalMilliseconds)
              if ($remainingMilliseconds -le 0) {
                $detail = if ($lastError) { " Last error: $lastError" } else { "" }
                throw "Timed out removing speech smoke install root '$ResolvedInstallRoot' after $TimeoutMilliseconds ms.$detail"
              }
              $detail = if ($lastError) { " ($lastError)" } else { " (files are still in use)" }
              Write-Host "[companion-ci] Cleanup attempt $attempt could not remove the speech smoke install root$detail; retrying for up to $remainingMilliseconds ms."
              Start-Sleep -Milliseconds ([Math]::Min(1000, $remainingMilliseconds))
            }
            Write-Host "[companion-ci] Speech smoke install root was already absent."
          }
          try {
            # electron-builder's NSIS template requires /D= to be the final,
            # unquoted argument; its parser treats the rest of the command line
            # as the path, which preserves spaces in RUNNER_TEMP.
            $installArgument = '/D=' + $installRoot
            $null = Invoke-CompanionLifecycleProcess -Label 'Companion installer' -FilePath $installerPath -ArgumentList @('/S', $installArgument) -TimeoutMilliseconds 600000
            $installedExe = Join-Path $installRoot "Jarvis Companion.exe"
            if (-not (Test-Path -LiteralPath $installedExe -PathType Leaf)) {
              throw "Installed Jarvis Companion executable was not found at $installedExe."
            }
            $nodeCpalRoot = Join-Path $installRoot 'resources\app.asar.unpacked\node_modules\node-cpal'
            $nodeCpalBinary = Join-Path $nodeCpalRoot 'bin\win32-x64\index.node'
            if (-not (Test-Path -LiteralPath $nodeCpalBinary -PathType Leaf)) { throw "Registry node-cpal win32-x64 binary missing: $nodeCpalBinary" }
            if (Test-Path -LiteralPath (Join-Path $installRoot 'resources\app.asar.unpacked\node_modules\@t3tools\jarvis-native-microphone')) { throw 'Installed Companion contains the retired product-owned microphone package.' }
            foreach ($extra in @('darwin-arm64', 'darwin-x64', 'linux-arm64', 'linux-x64')) {
              if (Test-Path -LiteralPath (Join-Path $nodeCpalRoot "bin\$extra")) { throw "Installed Companion contains non-Windows node-cpal binary: $extra" }
            }
            $env:ELECTRON_RUN_AS_NODE = '1'
            & $installedExe -e "const loaded = require(process.argv[1]); if (!loaded || typeof loaded.createStream !== 'function') throw new Error('Packaged node-cpal binding did not load in Electron Node mode.');" $nodeCpalBinary
            if ($LASTEXITCODE -ne 0) { throw "Packaged node-cpal Electron Node-mode load failed with exit code $LASTEXITCODE." }
            Remove-Item Env:ELECTRON_RUN_AS_NODE
            $null = Invoke-CompanionLifecycleProcess -Label 'Installed Companion startup smoke' -FilePath $installedExe -ArgumentList @("--startup-smoke") -TimeoutMilliseconds 120000
            $null = Invoke-CompanionLifecycleProcess -Label 'Installed Companion speech smoke' -FilePath $installedExe -ArgumentList @("--speech-smoke") -TimeoutMilliseconds 300000
          } finally {
            $uninstallerPath = Join-Path $installRoot "Uninstall Jarvis Companion.exe"
            if (Test-Path -LiteralPath $uninstallerPath -PathType Leaf) {
              $null = Invoke-CompanionLifecycleProcess -Label 'Companion uninstaller' -FilePath $uninstallerPath -ArgumentList @('/S') -TimeoutMilliseconds 120000
            }
            $resolvedInstallRoot = [System.IO.Path]::GetFullPath($installRoot)
            if (-not $resolvedInstallRoot.StartsWith($runnerTempPrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "Refusing to remove speech smoke path outside RUNNER_TEMP: $resolvedInstallRoot"
            }
            Remove-CompanionSmokeInstallRoot -ResolvedInstallRoot $resolvedInstallRoot -TimeoutMilliseconds 120000
          }

      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Companion-Windows-${{ steps.companion_version.outputs.version }}
          path: |
            apps/companion/dist/Jarvis-Companion-*-x64.exe
            apps/companion/dist/Jarvis-Companion-*-x64.exe.blockmap
            apps/companion/dist/latest.yml
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Build and test Linux companion
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@jarvis/companion...

      - name: Install Linux native microphone and startup smoke dependencies
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 libasound2-dev xvfb

      - name: Verify companion
        run: |
          vp test run apps/companion/src/bubble-state.test.ts apps/companion/src/companion-presentation.test.ts apps/companion/src/companion-startup-probe.test.ts apps/companion/src/companion-webgl.test.ts apps/companion/src/development.test.ts apps/companion/src/host.test.ts apps/companion/src/inline-json.test.ts apps/companion/src/pocket-lifecycle.test.ts apps/companion/src/pocket-worker.test.ts apps/companion/src/launch.test.ts apps/companion/src/linux-packaging.test.ts apps/companion/src/managed-status.test.ts apps/companion/src/native-speech.test.ts apps/companion/src/recognition-evaluation.test.ts apps/companion/src/report-connection.test.ts apps/companion/src/setup-surface.test.ts apps/companion/src/speech-interrupt.test.ts apps/companion/src/updates.test.ts
          vp run --filter @jarvis/companion typecheck

      - name: Smoke native speech runtimes
        run: |
          vp run --filter @jarvis/companion prepare:voice
          vp run --filter @jarvis/companion smoke:voice

      - id: companion_version
        name: Verify companion version and release channel
        run: |
          version="$(node -p "require('./apps/companion/package.json').version")"
          expected="${{ inputs.version }}"
          if [[ -n "$expected" && "$version" != "$expected" ]]; then
            echo "Companion package version '$version' does not match requested version '$expected'." >&2
            exit 1
          fi
          if [[ "${{ inputs.public_release }}" == "true" ]]; then
            echo 'Stable Companion publication is closed: Windows artifacts are unsigned.' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Linux AppImage
        run: vp run --filter @jarvis/companion package:linux:ci

      - name: Smoke packaged Linux Companion
        run: |
          set -euo pipefail
          unpacked="apps/companion/dist/linux-unpacked"
          app_resources="$unpacked/resources/app.asar.unpacked"
          native_root="$app_resources/node_modules/node-cpal"
          test -d "$unpacked"
          test -f "$unpacked/resources/icon.png"
          test -d "$app_resources/node_modules/sherpa-onnx-linux-x64"
          test -d "$native_root"
          test ! -e "$app_resources/node_modules/@t3tools/jarvis-native-microphone"
          test ! -e "$app_resources/node_modules/sherpa-onnx-win-x64"
          test -f "$native_root/bin/linux-x64/index.node"
          for directory in darwin-arm64 darwin-x64 linux-arm64 win32-x64; do
            test ! -e "$native_root/bin/$directory"
          done
          test -f "$app_resources/node_modules/uiohook-napi/prebuilds/linux-x64/uiohook-napi.node"
          for directory in darwin-arm64 darwin-x64 win32-arm64 win32-x64; do
            test ! -e "$app_resources/node_modules/uiohook-napi/prebuilds/$directory"
          done
          test ! -e "$app_resources/node_modules/uiohook-napi/src"
          test ! -e "$app_resources/node_modules/uiohook-napi/libuiohook"
          native_binary="$(realpath "$native_root/bin/linux-x64/index.node")"
          ELECTRON_RUN_AS_NODE=1 "$unpacked/jarvis-companion" -e "const loaded = require(process.argv[1]); if (!loaded || typeof loaded.createStream !== 'function') throw new Error('Packaged node-cpal binding did not load in Electron Node mode.');" "$native_binary"
          mapfile -t appimages < <(find apps/companion/dist -maxdepth 1 -type f -name 'Jarvis-Companion-*-x86_64.AppImage' -print)
          test "${#appimages[@]}" -eq 1
          test -x "${appimages[0]}"

      - name: Smoke Linux Companion AppImage startup
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t appimages < <(find apps/companion/dist -maxdepth 1 -type f -name 'Jarvis-Companion-*-x86_64.AppImage' -print)
          if [[ "${#appimages[@]}" -ne 1 ]]; then
            echo "Expected exactly one Linux Companion AppImage, found ${#appimages[@]}." >&2
            printf '%s\n' "${appimages[@]}" >&2
            exit 1
          fi
          appimage="${appimages[0]}"
          test -x "$appimage"
          smoke_root="$(mktemp -d "$RUNNER_TEMP/jarvis-companion-startup-smoke.XXXXXX")"
          mkdir -p "$smoke_root/home" "$smoke_root/xdg-config" "$smoke_root/xdg-data" "$smoke_root/xdg-cache" "$smoke_root/xdg-runtime"
          chmod 700 "$smoke_root/xdg-runtime"
          log_file="$smoke_root/startup.log"
          receipt_file="$smoke_root/startup-receipt.json"
          : > "$log_file"
          app_pid=""
          cleanup() {
            status=$?
            set +e
            if [[ -n "$app_pid" ]] && kill -0 "$app_pid" 2>/dev/null; then
              kill -TERM -- "-$app_pid" 2>/dev/null || true
              wait "$app_pid" || true
            fi
            exit "$status"
          }
          trap cleanup EXIT

          # Run the exact produced AppImage through its supported FUSE-free
          # extraction path. The dedicated session and state directories keep
          # this smoke isolated from runner-level Electron processes.
          setsid --wait dbus-run-session -- env \
            APPIMAGE_EXTRACT_AND_RUN=1 JARVIS_COMPANION_STARTUP_PROBE_FILE="$receipt_file" HOME="$smoke_root/home" \
            XDG_CONFIG_HOME="$smoke_root/xdg-config" XDG_DATA_HOME="$smoke_root/xdg-data" \
            XDG_CACHE_HOME="$smoke_root/xdg-cache" XDG_RUNTIME_DIR="$smoke_root/xdg-runtime" \
            xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
            "$appimage" --no-sandbox --startup-smoke >"$log_file" 2>&1 &
          app_pid=$!

          set +e
          timeout --signal=TERM 45 tail --pid="$app_pid" -f /dev/null
          exit_wait_status=$?
          set -e
          if (( exit_wait_status != 0 )); then
            echo "Packaged Linux Companion did not exit within 45 seconds." >&2
            cat "$log_file" >&2 || true
            exit 1
          fi
          set +e
          wait "$app_pid"
          app_status=$?
          set -e
          if (( app_status != 0 )); then
            echo "Packaged Linux Companion startup smoke exited with status $app_status." >&2
            cat "$log_file" >&2 || true
            exit 1
          fi
          if [[ ! -f "$receipt_file" ]]; then
            echo "Packaged Linux Companion exited without writing a startup receipt." >&2
            cat "$log_file" >&2 || true
            exit 1
          fi
          node - "$receipt_file" "${{ steps.companion_version.outputs.version }}" <<'NODE'
          const fs = require("node:fs");
          const [receiptPath, expectedVersion] = process.argv.slice(2);
          const expected = {
            schemaVersion: 1,
            product: "Jarvis Companion",
            version: expectedVersion,
            platform: "linux",
            phase: "tray-ready",
          };
          const content = fs.readFileSync(receiptPath, "utf8");
          if (content !== `${JSON.stringify(expected)}\n`) {
            throw new Error(`Unexpected Companion startup receipt: ${content}`);
          }
          NODE
          echo "Packaged Linux Companion smoke passed: $(<"$receipt_file")"

      - name: Upload test AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Companion-Linux-${{ steps.companion_version.outputs.version }}
          path: |
            apps/companion/dist/Jarvis-Companion-*-x86_64.AppImage
            apps/companion/dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 14
