name: SwiftUI iOS

on:
  pull_request:
    paths:
      - "apps/swift-ios/**"
      - "apps/mobile/src/features/devices/device-stream.browser.ts"
      - "apps/mobile/src/features/devices/device-stream-document.ts"
      - "packages/client-runtime/**"
      - "packages/contracts/**"
      - "packages/shared/**"
      - "scripts/generate-swift-wire-fixtures.ts"
      - "scripts/package.json"
      - ".github/workflows/swift-ios.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - main
    paths:
      - "apps/swift-ios/**"
      - "apps/mobile/src/features/devices/device-stream.browser.ts"
      - "apps/mobile/src/features/devices/device-stream-document.ts"
      - "packages/client-runtime/**"
      - "packages/contracts/**"
      - "packages/shared/**"
      - "scripts/generate-swift-wire-fixtures.ts"
      - "scripts/package.json"
      - ".github/workflows/swift-ios.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

concurrency:
  group: swift-ios-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Contract fixtures and native tests
    runs-on: blacksmith-12vcpu-macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/monorepo
              - --filter=@t3tools/scripts...
              - --filter=@t3tools/client-runtime...

      - name: Verify generated wire fixtures
        run: node scripts/generate-swift-wire-fixtures.ts --check

      - name: Test SwiftUI client
        run: apps/swift-ios/Scripts/ci-test.sh
