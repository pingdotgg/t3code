name: Auldric T3 baseline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: auldric-t3-baseline-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    name: Ancestry and drift guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Test the baseline guard
        run: pnpm --dir scripts test auldric/check-t3-baseline.test.ts

      - name: Verify ancestry and classify downstream drift
        run: node scripts/auldric/check-t3-baseline.ts --fetch --run-declared-tests
