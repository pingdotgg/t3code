name: Temporary CodeRabbit 9212 fix

on:
  push:
    branches:
      - fix/unknown-provider-pr-polling

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unknown-provider-pr-polling

      - name: Patch CodeRabbit findings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/server/src/git/GitManager.test.ts")
          text = path.read_text()

          old_provider = 'Effect.map((provider) => {\n        const sourceControlProvider = () => ({\n          ...provider,'
          new_provider = 'Effect.map((provider) => {\n        const baseProvider = input?.sourceControlProvider ?? provider;\n        const sourceControlProvider = () => ({\n          ...baseProvider,'
          if text.count(old_provider) != 1:
              raise SystemExit(f"expected one provider fixture block, found {text.count(old_provider)}")
          text = text.replace(old_provider, new_provider, 1)

          old_kind = ': (input?.sourceControlProviderKind ?? provider.kind),'
          new_kind = ': (input?.sourceControlProviderKind ?? baseProvider.kind),'
          if text.count(old_kind) != 1:
              raise SystemExit(f"expected one provider-kind fallback, found {text.count(old_kind)}")
          text = text.replace(old_kind, new_kind, 1)

          old_regression = '      expect(pullRequest).toBeNull();\n      expect(ghCalls.filter((call) => call.startsWith("pr list "))).toHaveLength(0);'
          new_regression = '''      expect(pullRequest).toBeNull();

          yield* runGit(repoDir, ["config", "--unset", "remote.origin.url"]);

          expect(
            yield* manager.branchPullRequest({
              cwd: repoDir,
              branch: "feature/unknown-branch-provider",
            }),
          ).toBeNull();

          expect(ghCalls.filter((call) => call.startsWith("pr list "))).toHaveLength(0);'''
          if text.count(old_regression) != 1:
              raise SystemExit(f"expected one unknown-provider assertion block, found {text.count(old_regression)}")
          text = text.replace(old_regression, new_regression, 1)

          path.write_text(text)
          PY

      - name: Commit targeted fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/git/GitManager.test.ts
          git rm .github/workflows/tmp-coderabbit-9212-fix.yml
          git commit -m "test(server): cover CodeRabbit PR lookup fixes"
          git push origin HEAD:fix/unknown-provider-pr-polling
