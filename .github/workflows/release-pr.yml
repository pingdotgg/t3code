name: Release PR

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: fork-release-pr
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare stable release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: app_token
        name: Mint release app token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}
          persist-credentials: true

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...
              - --filter=@t3tools/oxlint-plugin-t3code...

      - id: release_meta
        name: Resolve stable release metadata
        shell: bash
        env:
          RELEASE_DATE: ${{ github.run_started_at }}
        run: |
          release_date="$(date -u -d "$RELEASE_DATE" +%Y%m%d)"
          node scripts/resolve-fork-stable-release.ts \
            --date "$release_date" \
            --github-output

      - id: update_versions
        name: Update version metadata
        run: node scripts/update-release-package-versions.ts "${{ steps.release_meta.outputs.version }}" --github-output

      - name: Format package manifests
        if: steps.update_versions.outputs.changed == 'true'
        run: vp fmt apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json

      - name: Refresh lockfile
        if: steps.update_versions.outputs.changed == 'true'
        run: vp install --lockfile-only --ignore-scripts

      - id: app_bot
        name: Resolve GitHub App bot identity
        if: steps.update_versions.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${user_id}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Push release branch
        if: steps.update_versions.outputs.changed == 'true'
        shell: bash
        env:
          BRANCH_NAME: release/stable
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          git config user.name "${{ steps.app_bot.outputs.name }}"
          git config user.email "${{ steps.app_bot.outputs.email }}"
          git fetch origin "$BRANCH_NAME" || true
          git switch -c "$BRANCH_NAME"
          git add apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json pnpm-lock.yaml
          git commit -m "prepare stable release $RELEASE_VERSION"
          git push --force-with-lease="refs/heads/$BRANCH_NAME" origin "HEAD:$BRANCH_NAME"

      - name: Create or update release PR
        if: steps.update_versions.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          BRANCH_NAME: release/stable
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          title="prepare stable release $RELEASE_VERSION"
          body="$(mktemp)"
          cat > "$body" <<EOF
          ## What Changed

          - Update release package metadata for $RELEASE_TAG.
          - Refresh the lockfile for the release version.

          ## Why

          Merging this PR triggers the stable fork release from the prepared version metadata.

          ## UI Changes

          None.

          ## Checklist

          - [x] This PR is small and focused
          - [x] I explained what changed and why
          - [x] No UI changes
          - [x] No animation/interaction changes
          EOF

          existing="$(gh pr list --head "$BRANCH_NAME" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --title "$title" --body-file "$body"
          else
            gh pr create --base main --head "$BRANCH_NAME" --title "$title" --body-file "$body"
          fi

      - name: Report unchanged release PR
        if: steps.update_versions.outputs.changed != 'true'
        run: echo "Release package metadata already matches ${{ steps.release_meta.outputs.version }}."
