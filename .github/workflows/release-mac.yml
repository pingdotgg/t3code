name: Release macOS App

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version from apps/mac/version.json to release"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, publish, and open appcast PR
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require main branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run this workflow from the merged main branch." >&2
            exit 1
          fi

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Read and verify version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("apps/mac/version.json"))["version"])')
          BUILD=$(python3 -c 'import json; print(json.load(open("apps/mac/version.json"))["buildNumber"])')
          if [[ "$VERSION" != "$REQUESTED_VERSION" ]]; then
            echo "Requested $REQUESTED_VERSION but main contains $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run repository checks
        run: |
          vp check
          vp run typecheck
          swift test --package-path apps/mac

      - name: Build server sidecar
        run: vp run build:server

      - name: Build macOS app
        run: ./apps/mac/scripts/make-app.sh

      - name: Require standalone sidecar packaging
        run: |
          APP_PATH="$PWD/apps/mac/dist/SurgeCode.app"
          if [[ ! -x "$APP_PATH/Contents/Resources/SergeCodeNode/node" || \
                ! -f "$APP_PATH/Contents/Resources/SergeCodeServer/bin.mjs" ]]; then
            echo "The release app does not yet contain the standalone Node runtime and server bundle." >&2
            echo "Complete packaged sidecar support before publishing a public Sparkle release." >&2
            exit 1
          fi

      - name: Install matching Sparkle tools
        env:
          SPARKLE_VERSION: "2.9.4"
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          tar -xf sparkle.tar.xz
          echo "SPARKLE_BIN=$PWD/bin" >> "$GITHUB_ENV"

      - name: Require Sparkle signing key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "SPARKLE_PRIVATE_KEY is not configured; refusing to publish an unsigned update." >&2
            exit 1
          fi

      - name: Create distributable archives
        id: archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          APP_PATH="$PWD/apps/mac/dist/SurgeCode.app"
          DIST_DIR="$PWD/apps/mac/dist"
          DMG_PATH="$DIST_DIR/SurgeCode-$VERSION.dmg"
          ZIP_PATH="$DIST_DIR/SurgeCode-$VERSION.zip"
          mkdir -p "$PWD/apps/mac/dmg-temp"
          cp -R "$APP_PATH" "$PWD/apps/mac/dmg-temp/"
          hdiutil create -volname "SurgeCode" \
            -srcfolder "$PWD/apps/mac/dmg-temp" \
            -ov -format UDZO "$DMG_PATH"
          rm -rf "$PWD/apps/mac/dmg-temp"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"
          echo "dmg=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Generate signed appcast
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          TAG: ${{ steps.version.outputs.tag }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          UPDATE_DIR="$PWD/sparkle-updates"
          mkdir -p "$UPDATE_DIR"
          cp "apps/mac/Support/appcast.xml" "$UPDATE_DIR/appcast.xml"
          cp "${{ steps.archive.outputs.zip }}" "$UPDATE_DIR/"
          RELEASE_BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/"
          printf '%s' "$SPARKLE_PRIVATE_KEY" |
            "$SPARKLE_BIN/generate_appcast" \
              --ed-key-file - \
              --download-url-prefix "$RELEASE_BASE" \
              "$UPDATE_DIR"
          cp "$UPDATE_DIR/appcast.xml" apps/mac/Support/appcast.xml

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "${{ steps.archive.outputs.dmg }}" \
            "${{ steps.archive.outputs.zip }}" \
            --repo SergeSerb2/SergeCode \
            --target main \
            --title "SurgeCode $VERSION" \
            --generate-notes \
            $(case "$VERSION" in *-alpha.*|*-beta.*|*-rc.*) echo --prerelease;; esac)

      - name: Open appcast pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="automation/appcast-$VERSION"
          git fetch origin main
          git switch -c "$BRANCH" origin/main
          cp sparkle-updates/appcast.xml apps/mac/Support/appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mac/Support/appcast.xml
          git commit -m "chore: publish appcast for $VERSION"
          git push --set-upstream origin "$BRANCH"
          gh pr create \
            --repo SergeSerb2/SergeCode \
            --base main \
            --head "$BRANCH" \
            --title "chore: publish SurgeCode $VERSION appcast" \
            --body "Automated Sparkle appcast update for the GitHub Release $VERSION. Merge this PR to make the update visible to installed apps."
