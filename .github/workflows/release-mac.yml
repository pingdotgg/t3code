name: Release macOS App

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version from apps/mac/version.json to release"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, publish, and update appcast
    runs-on: macos-latest
    timeout-minutes: 45
    # Releases only ship when a PR carrying the "release" label is merged
    # into main (or via manual workflow_dispatch). Plain merges and bot
    # commits never trigger a release. The semver bump is chosen by an
    # optional release:major / release:minor / release:patch label on the
    # same PR; a bare "release" label defaults to patch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
        contains(github.event.pull_request.labels.*.name, 'release'))

    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require main branch
        run: |
          # pull_request events are already restricted to base `main` by the
          # trigger; only manual dispatches can come from another ref.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run this workflow from the merged main branch." >&2
            exit 1
          fi

      - name: Bump release version
        if: github.event_name == 'pull_request'
        id: bump
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          set -euo pipefail
          # Semver bump from the PR's release:* qualifier label; a bare
          # "release" label means a bug-fix-scale change and defaults to
          # patch. Major wins if several qualifiers are present.
          BUMP_TYPE=patch
          case " $PR_LABELS " in
            *" release:major "*) BUMP_TYPE=major ;;
            *" release:minor "*) BUMP_TYPE=minor ;;
            *" release:patch "*) BUMP_TYPE=patch ;;
          esac
          echo "Bump type: $BUMP_TYPE (PR labels: $PR_LABELS)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            BUMP_OUTPUT="$(apps/mac/scripts/compute-version.sh "$BUMP_TYPE")"
            VERSION=$(sed -n 's/^version=//p' <<< "$BUMP_OUTPUT")
            BUILD=$(sed -n 's/^buildNumber=//p' <<< "$BUMP_OUTPUT")
            TAG=$(sed -n 's/^tag=//p' <<< "$BUMP_OUTPUT")
            printf '{\n  "version": "%s",\n  "buildNumber": "%s"\n}\n' \
              "$VERSION" "$BUILD" > apps/mac/version.json
            git add apps/mac/version.json
            git commit -m "chore: bump version to $VERSION [skip release]"
            git tag -f "$TAG"
            if git push origin main "refs/tags/$TAG"; then
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "build=$BUILD" >> "$GITHUB_OUTPUT"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch origin
            if git merge-base --is-ancestor HEAD origin/main; then
              # The bump commit actually landed; make sure the tag is there too.
              git push origin "refs/tags/$TAG"
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "build=$BUILD" >> "$GITHUB_OUTPUT"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Another push raced in; undo the local bump and rebase onto it.
            git tag -d "$TAG"
            git reset --hard HEAD~1
            git pull --rebase origin main
          done
          echo "Failed to push version bump after 3 attempts" >&2
          exit 1

      - name: Read and verify version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          BUMP_VERSION: ${{ steps.bump.outputs.version }}
          BUMP_BUILD: ${{ steps.bump.outputs.build }}
          BUMP_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # Version was just bumped and pushed by the previous step.
            echo "version=$BUMP_VERSION" >> "$GITHUB_OUTPUT"
            echo "build=$BUMP_BUILD" >> "$GITHUB_OUTPUT"
            echo "tag=$BUMP_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(python3 -c 'import json; print(json.load(open("apps/mac/version.json"))["version"])')
          BUILD=$(python3 -c 'import json; print(json.load(open("apps/mac/version.json"))["buildNumber"])')
          if [[ "$VERSION" != "$REQUESTED_VERSION" ]]; then
            echo "Requested $REQUESTED_VERSION but main contains $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # SwiftPM build cache: restores compiled deps (FluidAudio, cmark,
      # Sparkle, swift-markdown — the bulk of both compile steps) so
      # `swift test` (debug) and make-app.sh (release) only rebuild what
      # changed. Keyed on the runner image (toolchain identity) and the
      # package manifest/lockfile; the restore-key prefix still matches on
      # app-only source changes, and SwiftPM revalidates anything stale, so
      # a mismatched restore degrades to today's full build.
      - name: Restore SwiftPM build cache
        uses: actions/cache@v4
        with:
          path: apps/mac/.build
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ runner.imageVersion }}-${{ hashFiles('apps/mac/Package.swift', 'apps/mac/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-${{ runner.arch }}-

      # The staged Node runtime is a pinned, checksum-verified binary that
      # only changes when stage-sidecar.sh's pin does; the script itself
      # skips the download when the staged binary already matches.
      - name: Restore staged Node runtime cache
        uses: actions/cache@v4
        with:
          path: apps/mac/dist/sidecar/SergeCodeNode
          key: sidecar-node-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/mac/scripts/stage-sidecar.sh') }}

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Run repository checks
        run: |
          vp check
          vp run typecheck
          # --no-parallel: the suites share process-wide static caches
          # (TimelineDisplayCache, StreamingMarkdownCache) and are all
          # @MainActor, so parallel execution only interleaves them at
          # await points on the main thread — one suite's resetForTesting()
          # can land inside another suite's counter assertions (this flaked
          # AppModelTimelineEvictionTests on the alpha.7 release run).
          # Parallelism buys nothing here anyway: MainActor tests already
          # serialize on the main thread.
          swift test --package-path apps/mac --no-parallel

      - name: Build server sidecar
        run: vp run build:server

      - name: Stage Node runtime and server sidecar
        # Downloads the pinned darwin-arm64 Node runtime (curl --fail,
        # checksum- and extraction-verified) and assembles the production
        # server payload into apps/mac/dist/sidecar/ for make-app.sh to embed.
        # The Node version is pinned in the script so local and CI builds match.
        run: ./apps/mac/scripts/stage-sidecar.sh

      - name: Build macOS app
        run: ./apps/mac/scripts/make-app.sh

      - name: Require standalone sidecar packaging
        run: |
          APP_PATH="$PWD/apps/mac/dist/SurgeCode.app"
          if [[ ! -x "$APP_PATH/Contents/Resources/SergeCodeNode/node" || \
                ! -f "$APP_PATH/Contents/Resources/SergeCodeServer/bin.mjs" ]]; then
            echo "The release app does not yet contain the standalone Node runtime and server bundle." >&2
            echo "Complete packaged sidecar support before publishing a public Sparkle release." >&2
            exit 1
          fi

      - name: Install matching Sparkle tools
        env:
          SPARKLE_VERSION: "2.9.4"
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          tar -xf sparkle.tar.xz
          echo "SPARKLE_BIN=$PWD/bin" >> "$GITHUB_ENV"

      - name: Require Sparkle signing key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "SPARKLE_PRIVATE_KEY is not configured; refusing to publish an unsigned update." >&2
            exit 1
          fi

      - name: Create distributable archives
        id: archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          APP_PATH="$PWD/apps/mac/dist/SurgeCode.app"
          DIST_DIR="$PWD/apps/mac/dist"
          DMG_PATH="$DIST_DIR/SurgeCode-$VERSION.dmg"
          ZIP_PATH="$DIST_DIR/SurgeCode-$VERSION.zip"
          mkdir -p "$PWD/apps/mac/dmg-temp"
          cp -R "$APP_PATH" "$PWD/apps/mac/dmg-temp/"
          # DMG compression and zip are independent; run them concurrently
          # (saves roughly half of this step's wall time).
          hdiutil create -volname "SurgeCode" \
            -srcfolder "$PWD/apps/mac/dmg-temp" \
            -ov -format UDZO "$DMG_PATH" &
          DMG_PID=$!
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"
          wait "$DMG_PID"
          rm -rf "$PWD/apps/mac/dmg-temp"
          echo "dmg=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Generate signed appcast
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          TAG: ${{ steps.version.outputs.tag }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          UPDATE_DIR="$PWD/sparkle-updates"
          mkdir -p "$UPDATE_DIR"
          cp "apps/mac/Support/appcast.xml" "$UPDATE_DIR/appcast.xml"
          cp "${{ steps.archive.outputs.zip }}" "$UPDATE_DIR/"
          RELEASE_BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/"
          printf '%s' "$SPARKLE_PRIVATE_KEY" |
            "$SPARKLE_BIN/generate_appcast" \
              --ed-key-file - \
              --download-url-prefix "$RELEASE_BASE" \
              "$UPDATE_DIR"
          cp "$UPDATE_DIR/appcast.xml" apps/mac/Support/appcast.xml

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # Note: bash 3.2 (macOS runners) cannot parse `$(case ... esac)`
          # with unparenthesized patterns, so compute the flag separately.
          PRERELEASE_FLAG=""
          case "$VERSION" in
            *-alpha.*|*-beta.*|*-rc.*) PRERELEASE_FLAG="--prerelease";;
          esac
          gh release create "$TAG" \
            "${{ steps.archive.outputs.dmg }}" \
            "${{ steps.archive.outputs.zip }}" \
            --repo SergeSerb2/SergeCode \
            --target main \
            --title "SurgeCode $VERSION" \
            --generate-notes \
            $PRERELEASE_FLAG

      - name: Commit appcast to main
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mac/Support/appcast.xml
          if git diff --cached --quiet; then
            echo "Appcast unchanged; skipping commit."
            exit 0
          fi
          for attempt in 1 2 3; do
            git commit -m "chore: publish appcast for $VERSION [skip release]"
            if git push origin main; then
              exit 0
            fi
            git reset --soft HEAD~1
            git pull --rebase --autostash origin main
            git add apps/mac/Support/appcast.xml
          done
          echo "Failed to push appcast commit after 3 attempts" >&2
          exit 1
