name: Release macOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version from apps/mac/version.json to release"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, publish, and update appcast
    runs-on: macos-latest
    timeout-minutes: 45
    # Bot commits pushed by this workflow carry "[skip release]" so they
    # don't trigger another release. Everything else on main releases.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip release]')

    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require main branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run this workflow from the merged main branch." >&2
            exit 1
          fi

      - name: Bump prerelease version
        if: github.event_name == 'push'
        id: bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            BUMP_OUTPUT="$(apps/mac/scripts/compute-version.sh prerelease)"
            VERSION=$(sed -n 's/^version=//p' <<< "$BUMP_OUTPUT")
            BUILD=$(sed -n 's/^buildNumber=//p' <<< "$BUMP_OUTPUT")
            TAG=$(sed -n 's/^tag=//p' <<< "$BUMP_OUTPUT")
            printf '{\n  "version": "%s",\n  "buildNumber": "%s"\n}\n' \
              "$VERSION" "$BUILD" > apps/mac/version.json
            git add apps/mac/version.json
            git commit -m "chore: bump version to $VERSION [skip release]"
            git tag -f "$TAG"
            if git push origin main "refs/tags/$TAG"; then
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "build=$BUILD" >> "$GITHUB_OUTPUT"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch origin
            if git merge-base --is-ancestor HEAD origin/main; then
              # The bump commit actually landed; make sure the tag is there too.
              git push origin "refs/tags/$TAG"
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "build=$BUILD" >> "$GITHUB_OUTPUT"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Another push raced in; undo the local bump and rebase onto it.
            git tag -d "$TAG"
            git reset --hard HEAD~1
            git pull --rebase origin main
          done
          echo "Failed to push version bump after 3 attempts" >&2
          exit 1

      - name: Read and verify version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          BUMP_VERSION: ${{ steps.bump.outputs.version }}
          BUMP_BUILD: ${{ steps.bump.outputs.build }}
          BUMP_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            # Version was just bumped and pushed by the previous step.
            echo "version=$BUMP_VERSION" >> "$GITHUB_OUTPUT"
            echo "build=$BUMP_BUILD" >> "$GITHUB_OUTPUT"
            echo "tag=$BUMP_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(python3 -c 'import json; print(json.load(open("apps/mac/version.json"))["version"])')
          BUILD=$(python3 -c 'import json; print(json.load(open("apps/mac/version.json"))["buildNumber"])')
          if [[ "$VERSION" != "$REQUESTED_VERSION" ]]; then
            echo "Requested $REQUESTED_VERSION but main contains $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Run repository checks
        run: |
          vp check
          vp run typecheck
          swift test --package-path apps/mac

      - name: Build server sidecar
        run: vp run build:server

      - name: Stage Node runtime and server sidecar
        # Downloads the pinned darwin-arm64 Node runtime (curl --fail,
        # checksum- and extraction-verified) and assembles the production
        # server payload into apps/mac/dist/sidecar/ for make-app.sh to embed.
        # The Node version is pinned in the script so local and CI builds match.
        run: ./apps/mac/scripts/stage-sidecar.sh

      - name: Build macOS app
        run: ./apps/mac/scripts/make-app.sh

      - name: Require standalone sidecar packaging
        run: |
          APP_PATH="$PWD/apps/mac/dist/SurgeCode.app"
          if [[ ! -x "$APP_PATH/Contents/Resources/SergeCodeNode/node" || \
                ! -f "$APP_PATH/Contents/Resources/SergeCodeServer/bin.mjs" ]]; then
            echo "The release app does not yet contain the standalone Node runtime and server bundle." >&2
            echo "Complete packaged sidecar support before publishing a public Sparkle release." >&2
            exit 1
          fi

      - name: Install matching Sparkle tools
        env:
          SPARKLE_VERSION: "2.9.4"
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          tar -xf sparkle.tar.xz
          echo "SPARKLE_BIN=$PWD/bin" >> "$GITHUB_ENV"

      - name: Require Sparkle signing key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "SPARKLE_PRIVATE_KEY is not configured; refusing to publish an unsigned update." >&2
            exit 1
          fi

      - name: Create distributable archives
        id: archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          APP_PATH="$PWD/apps/mac/dist/SurgeCode.app"
          DIST_DIR="$PWD/apps/mac/dist"
          DMG_PATH="$DIST_DIR/SurgeCode-$VERSION.dmg"
          ZIP_PATH="$DIST_DIR/SurgeCode-$VERSION.zip"
          mkdir -p "$PWD/apps/mac/dmg-temp"
          cp -R "$APP_PATH" "$PWD/apps/mac/dmg-temp/"
          hdiutil create -volname "SurgeCode" \
            -srcfolder "$PWD/apps/mac/dmg-temp" \
            -ov -format UDZO "$DMG_PATH"
          rm -rf "$PWD/apps/mac/dmg-temp"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"
          echo "dmg=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Generate signed appcast
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          TAG: ${{ steps.version.outputs.tag }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          UPDATE_DIR="$PWD/sparkle-updates"
          mkdir -p "$UPDATE_DIR"
          cp "apps/mac/Support/appcast.xml" "$UPDATE_DIR/appcast.xml"
          cp "${{ steps.archive.outputs.zip }}" "$UPDATE_DIR/"
          RELEASE_BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/"
          printf '%s' "$SPARKLE_PRIVATE_KEY" |
            "$SPARKLE_BIN/generate_appcast" \
              --ed-key-file - \
              --download-url-prefix "$RELEASE_BASE" \
              "$UPDATE_DIR"
          cp "$UPDATE_DIR/appcast.xml" apps/mac/Support/appcast.xml

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "${{ steps.archive.outputs.dmg }}" \
            "${{ steps.archive.outputs.zip }}" \
            --repo SergeSerb2/SergeCode \
            --target main \
            --title "SurgeCode $VERSION" \
            --generate-notes \
            $(case "$VERSION" in *-alpha.*|*-beta.*|*-rc.*) echo --prerelease;; esac)

      - name: Commit appcast to main
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mac/Support/appcast.xml
          if git diff --cached --quiet; then
            echo "Appcast unchanged; skipping commit."
            exit 0
          fi
          for attempt in 1 2 3; do
            git commit -m "chore: publish appcast for $VERSION [skip release]"
            if git push origin main; then
              exit 0
            fi
            git reset --soft HEAD~1
            git pull --rebase --autostash origin main
            git add apps/mac/Support/appcast.xml
          done
          echo "Failed to push appcast commit after 3 attempts" >&2
          exit 1
