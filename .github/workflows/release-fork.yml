name: Release fork

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Force this version (X.Y.Z) instead of bumping the latest patch
        required: false
        type: string

concurrency:
  group: release-fork
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    if: github.repository == 'KLI31/t3code'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            latest="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // empty')"
            latest="${latest#v}"
            IFS=. read -r major minor patch <<< "${latest:-1.0.-1}"
            version="$major.$minor.$((patch + 1))"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$version is already released; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  linux:
    name: Build Linux AppImage
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # .repos holds orphaned gitlinks that break checkout's submodule cleanup.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux desktop build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      - name: Build AppImage
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: KLI31/t3code
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node scripts/build-desktop-artifact.ts \
            --platform linux --target AppImage --arch x64 \
            --build-version "$VERSION" --output-dir "release/$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          path: |
            release/${{ needs.version.outputs.version }}/*.AppImage
            release/${{ needs.version.outputs.version }}/*.blockmap
            release/${{ needs.version.outputs.version }}/*.deb
            release/${{ needs.version.outputs.version }}/latest-linux.yml

  # Unsigned and without the embedded WSL runtime: Windows shows a SmartScreen
  # prompt on first run, and the WSL backend is unavailable.
  windows:
    name: Build Windows installer
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Build installer
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: KLI31/t3code
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node scripts/build-desktop-artifact.ts \
            --platform win --target nsis --arch x64 --keep-stage \
            --build-version "$VERSION" --output-dir "release/$VERSION"

      - name: List packaged files
        if: always()
        run: |
          tmp="$(node -p "require('os').tmpdir()")"
          find "$tmp" -maxdepth 4 -type d -name win-unpacked | while read -r dir; do
            echo "== $dir"; (cd "$dir" && find . -type f | sort)
          done

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            release/${{ needs.version.outputs.version }}/*.exe
            release/${{ needs.version.outputs.version }}/*.exe.blockmap
            release/${{ needs.version.outputs.version }}/latest.yml

  publish:
    name: Publish release
    needs: [version, linux, windows]
    if: false
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish release
        run: |
          set -euo pipefail
          ls out/*.AppImage out/latest-linux.yml out/*.exe out/latest.yml >/dev/null
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "v$VERSION" --notes "Fork build of ${GITHUB_SHA::7}." \
            out/*
