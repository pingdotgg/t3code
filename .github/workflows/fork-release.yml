name: Fork release

# A fork's own Linux server releases. A version tag builds standalone CLI archives and
# SHA256SUMS into a draft release; publishing the draft is the approval. `t3 update` and
# T3CODE_AUTO_UPDATE servers never see drafts, so nothing reaches a server before that.
on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-nightly.*"
      - "!v*-preview.*"

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    if: github.repository != 'pingdotgg/t3code'
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          # Built natively: the single executable cannot be cross-built for arm64 page sizes.
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # Standalone builds refuse T3 Code's scheme, so the fork names its own in a repository variable.
      T3CODE_APP_SCHEME: ${{ vars.T3CODE_APP_SCHEME }}
    steps:
      - name: Require the fork's app scheme
        run: |
          [ -n "$T3CODE_APP_SCHEME" ] || {
            echo "::error::Set the repository variable T3CODE_APP_SCHEME to this fork's deep-link scheme: gh variable set T3CODE_APP_SCHEME --body <scheme>"
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # .repos/ holds vendored references with gitlinks that checkout cannot resolve.
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Install patchelf
        run: command -v patchelf || { sudo apt-get update && sudo apt-get install -y patchelf; }

      - name: Build CLI archive
        run: scripts/build-standalone-linux-cli.sh "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" release-cli

      - name: Upload CLI archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-linux-${{ matrix.arch }}
          path: release-cli/*
          if-no-files-found: error

  release:
    name: Draft GitHub release
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download CLI archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-linux-*
          merge-multiple: true
          path: release-cli

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd release-cli
          sha256sum t3-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes \
            --title "T3 Code $GITHUB_REF_NAME" t3-*.tar.gz SHA256SUMS
