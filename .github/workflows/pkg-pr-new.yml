name: pkg.pr.new

on:
  push:
    branches:
      - "**"
    tags:
      - "!**"
  workflow_dispatch:

concurrency:
  group: pkg-pr-new-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish preview packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - run: vp run --filter @t3tools/contracts --filter @t3tools/provider-runtime build
      - run: vp dlx publint './packages/contracts' --pack npm && vp dlx publint './packages/provider-runtime' --pack npm
      - run: vp dlx pkg-pr-new publish './packages/contracts' './packages/provider-runtime' --pnpm --packageManager=pnpm
