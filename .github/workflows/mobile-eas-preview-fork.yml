name: Mobile EAS Preview (Fork)

# EAS previews for fork PRs. This runs the PR's code with an Expo token: the
# app config and plugins run on this runner; both clients build on Blacksmith
# with preview signing credentials.
#
# Dispatch manually after reviewing the PR's code, pinning the exact commit SHA
# you reviewed:
#
#   gh workflow run mobile-eas-preview-fork.yml \
#     -f pr_number=<PR_NUMBER> \
#     -f head_sha=<40_CHAR_COMMIT_SHA>
#
# The validate job checks that pr_number is an open fork PR whose current head
# is head_sha (failing fast if the PR moved since review) and removes any
# "🚀 Mobile Continuous Deployment" label if present. A later push deploys
# nothing until a maintainer dispatches this workflow again for the new commit.
# To retry a failed run, use "Re-run all jobs" so validation runs again on the
# current attempt.
#
# Same-repo PRs deploy on every push while labeled, via mobile-eas-preview.yml.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open fork PR number to preview
        required: true
        type: string
      head_sha:
        description: Full 40-character commit SHA reviewed on the fork PR
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Runs before any PR code is checked out or EXPO_PREVIEW_TOKEN is accessed.
  validate:
    name: Validate fork PR
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    outputs:
      pr_number: ${{ steps.check.outputs.pr_number }}
      head_sha: ${{ steps.check.outputs.head_sha }}
      run_attempt: ${{ steps.check.outputs.run_attempt }}
    steps:
      - id: check
        name: Validate fork PR and commit SHA
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const defaultBranch = context.payload.repository?.default_branch;
            if (!defaultBranch || context.ref !== `refs/heads/${defaultBranch}`) {
              core.setFailed(
                `This workflow must be dispatched from the default branch (${defaultBranch ?? "unknown"}), got ${context.ref}.`,
              );
              return;
            }

            const runAttempt = (process.env.RUN_ATTEMPT ?? "").trim();
            if (!/^[1-9][0-9]*$/.test(runAttempt)) {
              core.setFailed(`Invalid github.run_attempt "${runAttempt}".`);
              return;
            }

            const rawPrNumber = (process.env.INPUT_PR_NUMBER ?? "").trim();
            if (!/^[1-9][0-9]*$/.test(rawPrNumber)) {
              core.setFailed(`Invalid pr_number "${rawPrNumber}": expected a positive integer.`);
              return;
            }
            const prNumber = Number(rawPrNumber);
            if (!Number.isSafeInteger(prNumber)) {
              core.setFailed(`Invalid pr_number "${rawPrNumber}": exceeds safe integer range.`);
              return;
            }

            const headSha = (process.env.INPUT_HEAD_SHA ?? "").trim();
            if (!/^[0-9a-f]{40}$/.test(headSha)) {
              core.setFailed(
                `Invalid head_sha "${headSha}": expected a full 40-character lowercase hex commit SHA.`,
              );
              return;
            }

            let pull;
            try {
              ({ data: pull } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              }));
            } catch (error) {
              if (error.status === 404) {
                core.setFailed(`PR #${prNumber} was not found.`);
                return;
              }
              throw error;
            }

            if (pull.state !== "open") {
              core.setFailed(`PR #${prNumber} is ${pull.state}; only open fork PRs can be previewed.`);
              return;
            }

            const baseRepo = `${context.repo.owner}/${context.repo.repo}`.toLowerCase();
            const headRepo = pull.head?.repo?.full_name ?? null;
            if (!headRepo) {
              core.setFailed(`PR #${prNumber} has no head repository (fork may have been deleted).`);
              return;
            }
            if (headRepo.toLowerCase() === baseRepo) {
              core.setFailed(
                `PR #${prNumber} is a same-repository PR (${headRepo}); apply the "🚀 Mobile Continuous Deployment" label to trigger mobile-eas-preview.yml instead.`,
              );
              return;
            }

            if (pull.head?.sha !== headSha) {
              core.setFailed(
                `PR #${prNumber} head is now ${pull.head?.sha ?? "(unknown)"}, not reviewed commit ${headSha}. Review the latest commit before dispatching again.`,
              );
              return;
            }

            const deployLabel = "🚀 Mobile Continuous Deployment";
            if (pull.labels?.some((label) => label.name === deployLabel)) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: deployLabel,
                });
                core.info(`Removed "${deployLabel}" label from PR #${prNumber}.`);
              } catch (error) {
                if (error.status !== 404) throw error;
                core.info(`Label "${deployLabel}" was already removed from PR #${prNumber}.`);
              }
            }

            core.setOutput("pr_number", String(prNumber));
            core.setOutput("head_sha", headSha);
            core.setOutput("run_attempt", runAttempt);

  preview:
    name: EAS Preview
    needs: validate
    # Require validate to have run in this attempt so partial reruns cannot
    # reuse stale validation outputs after the PR moved or closed.
    if: needs.validate.outputs.run_attempt == github.run_attempt
    runs-on: blacksmith-8vcpu-ubuntu-2404
    concurrency:
      group: mobile-eas-preview-fork-${{ needs.validate.outputs.pr_number }}
      cancel-in-progress: true
    permissions:
      contents: read
    outputs:
      ios_group: ${{ steps.ios_update.outputs.group }}
      ios_client: ${{ steps.ios_client.outputs.link }}
      group: ${{ steps.update.outputs.group }}
      client: ${{ steps.client.outputs.link }}
      ios_build: ${{ steps.ios_client.outputs.build }}
      ios_fingerprint: ${{ steps.ios_client.outputs.fingerprint }}
      build: ${{ steps.client.outputs.build }}
      fingerprint: ${{ steps.client.outputs.fingerprint }}
    env:
      APP_VARIANT: preview
      NODE_OPTIONS: --max-old-space-size=8192
      MOBILE_VERSION_POLICY: fingerprint
    steps:
      - id: expo-token
        name: Check for EXPO_PREVIEW_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_PREVIEW_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_PREVIEW_TOKEN is not set; skipping EAS preview."
          fi

      # The reviewed commit SHA validated above, not a branch ref, so a push
      # after review cannot swap in unreviewed code. No credentials stay in
      # .git for the PR's scripts to read.
      - name: Checkout reviewed commit
        if: steps.expo-token.outputs.present == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.validate.outputs.head_sha }}
          fetch-depth: 0
          # No sparse-checkout: see mobile-eas-preview.yml.

      # Scripts and actions come from the default branch, not from the PR.
      - name: Checkout trusted scripts
        if: steps.expo-token.outputs.present == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          path: .trusted
          sparse-checkout: |
            .github/scripts
            .github/actions

      # The steps below run dependency and build scripts; they get no token.
      - name: Drop checkout credentials
        if: steps.expo-token.outputs.present == 'true'
        uses: ./.trusted/.github/actions/drop-checkout-credentials

      # No caches: workflow_dispatch runs under main's cache scope, where
      # trusted workflows with other secrets would restore what PR code wrote.
      - name: Setup Vite+
        if: steps.expo-token.outputs.present == 'true'
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: false
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Expose pnpm
        if: steps.expo-token.outputs.present == 'true'
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup EAS
        if: steps.expo-token.outputs.present == 'true'
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8.2.1
        with:
          eas-version: latest
          eas-cache: false
          token: ${{ secrets.EXPO_PREVIEW_TOKEN }}
          packager: npm

      - name: Pull preview environment variables
        if: steps.expo-token.outputs.present == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_PREVIEW_TOKEN }}
        run: |
          eas env:pull preview --non-interactive
          # See mobile-eas-preview.yml: keeps Android build and OTA fingerprints matching.
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          import { parseEnv } from "node:util";
          const env = parseEnv(readFileSync(".env.local", "utf8"));
          const googleServicesFile = env.T3CODE_ANDROID_GOOGLE_SERVICES_FILE;
          if (googleServicesFile) {
            appendFileSync(process.env.GITHUB_ENV, `T3CODE_ANDROID_GOOGLE_SERVICES_FILE=${googleServicesFile}\n`);
          }
          NODE

      - id: ios_client
        name: Find the iOS client for this fingerprint
        if: steps.expo-token.outputs.present == 'true'
        working-directory: apps/mobile
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_PREVIEW_TOKEN }}
        run: |
          hash="$(eas env:exec --non-interactive preview "npx expo-updates fingerprint:generate --platform ios" | sed -n '/^{/,$p' | jq -er '.hash | select(type == "string" and length > 0)')"
          echo "fingerprint=$hash" >> "$GITHUB_OUTPUT"
          tag="mobile-ios-preview-build/$hash"
          link=""
          if git fetch --quiet origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null; then
            link="$(git tag -l --format='%(contents)' "$tag" | node "$GITHUB_WORKSPACE/.trusted/.github/scripts/mobile-ios-preview-record.cjs" read)"
          fi
          if [ -z "$link" ]; then
            link="$(eas build:list --platform ios --build-profile preview:dev --runtime-version "$hash" --status finished --limit 5 --json --non-interactive \
              | sed -n '/^\[/,$p' \
              | jq -r --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '[.[] | select((.expirationDate // "9999") > $now)][0] | select(. != null) | "https://expo.dev/accounts/pingdotgg/projects/t3-code/builds/\(.id)"')"
          fi
          echo "link=$link" >> "$GITHUB_OUTPUT"
          if [ -z "$link" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; fi

      - id: ios_update
        name: Publish the iOS update
        if: steps.expo-token.outputs.present == 'true'
        working-directory: apps/mobile
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_PREVIEW_TOKEN }}
          PR: ${{ needs.validate.outputs.pr_number }}
        run: |
          group="$(eas update --auto --branch "pr-$PR" --platform ios --environment preview --non-interactive --json | sed -n '/^\[/,$p' | jq -er '.[0].group')"
          echo "group=$group" >> "$GITHUB_OUTPUT"

      # Android, as in mobile-eas-preview.yml: the same fingerprint command the Expo
      # action runs. A client built for a same-repo PR (its tag) or by EAS is reused.
      - id: client
        name: Find the Android client for this fingerprint
        if: steps.expo-token.outputs.present == 'true'
        working-directory: apps/mobile
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_PREVIEW_TOKEN }}
        run: |
          hash="$(eas env:exec --non-interactive preview "npx expo-updates fingerprint:generate --platform android" | sed -n '/^{/,$p' | jq -er '.hash | select(type == "string" and length > 0)')"
          echo "fingerprint=$hash" >> "$GITHUB_OUTPUT"
          tag="mobile-android-preview-build/$hash"
          link=""
          if git fetch --quiet origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null; then
            link="$(git tag -l --format='%(contents:subject)' "$tag")"
          else
            link="$(eas build:list --platform android --build-profile preview:dev --runtime-version "$hash" --status finished --limit 5 --json --non-interactive \
              | sed -n '/^\[/,$p' \
              | jq -r --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '[.[] | select((.expirationDate // "9999") > $now)][0] | select(. != null) | "https://expo.dev/accounts/pingdotgg/projects/t3-code/builds/\(.id)"')"
          fi
          echo "link=$link" >> "$GITHUB_OUTPUT"
          if [ -z "$link" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; fi

      - id: update
        name: Publish the Android update
        if: steps.expo-token.outputs.present == 'true'
        working-directory: apps/mobile
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_PREVIEW_TOKEN }}
          PR: ${{ needs.validate.outputs.pr_number }}
        run: |
          group="$(eas update --auto --branch "pr-$PR" --platform android --environment preview --non-interactive --json | sed -n '/^\[/,$p' | jq -er '.[0].group')"
          echo "group=$group" >> "$GITHUB_OUTPUT"

  # The reviewed commit's Android client, built cold: no sticky disk, because PR
  # code could leave Gradle or ccache state that trusted builds would restore, and
  # no build record tag, so nobody else is served an APK a fork's code built.
  android-build:
    name: Android preview client
    needs: [validate, preview]
    if: needs.validate.outputs.run_attempt == github.run_attempt && needs.preview.outputs.build == 'true'
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      client: ${{ steps.build.outputs.link }}
    env:
      APP_VARIANT: preview
      NODE_OPTIONS: --max-old-space-size=8192
      MOBILE_VERSION_POLICY: fingerprint
      FINGERPRINT: ${{ needs.preview.outputs.fingerprint }}
      # Phones only: emulators use the development client from the native-client cache.
      ORG_GRADLE_PROJECT_reactNativeArchitectures: armeabi-v7a,arm64-v8a
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.validate.outputs.head_sha }}
          fetch-depth: 0

      # Scripts and actions come from the default branch, not from the PR.
      - name: Checkout trusted scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          path: .trusted
          sparse-checkout: |
            .github/scripts
            .github/actions

      # The steps below run dependency and build scripts; they get no token.
      - name: Drop checkout credentials
        uses: ./.trusted/.github/actions/drop-checkout-credentials

      # Cold: no sticky disk or EAS cache that trusted builds would restore.
      - name: Build
        uses: ./.trusted/.github/actions/eas-local-build
        with:
          platform: android
          profile: preview:dev
          environment: preview
          expo-token: ${{ secrets.EXPO_PREVIEW_TOKEN }}
          output: ${{ runner.temp }}/t3code-preview.apk
          cache: "false"

      - id: build
        name: Upload
        working-directory: apps/mobile
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_PREVIEW_TOKEN }}
        run: |
          eas upload --platform android --build-path "$RUNNER_TEMP/t3code-preview.apk" --fingerprint "$FINGERPRINT" --non-interactive --json | tee "$RUNNER_TEMP/upload.json"
          link="$(sed -n '/^{/,$p' "$RUNNER_TEMP/upload.json" | jq -r '.url // empty')"
          if [ -z "$link" ]; then
            echo "::error::eas upload returned no install link"
            exit 1
          fi
          echo "link=$link" >> "$GITHUB_OUTPUT"

  ios-build:
    name: iOS preview client
    needs: [validate, preview]
    if: needs.validate.outputs.run_attempt == github.run_attempt && needs.preview.outputs.ios_build == 'true'
    runs-on: blacksmith-12vcpu-macos-27
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      client: ${{ steps.build.outputs.link }}
    env:
      APP_VARIANT: preview
      NODE_OPTIONS: --max-old-space-size=8192
      MOBILE_VERSION_POLICY: fingerprint
      FINGERPRINT: ${{ needs.preview.outputs.ios_fingerprint }}
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.validate.outputs.head_sha }}
          fetch-depth: 0

      # Scripts and actions come from the default branch, not from the PR.
      - name: Checkout trusted scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          path: .trusted
          sparse-checkout: |
            .github/scripts
            .github/actions

      # The steps below run dependency and build scripts; they get no token.
      - name: Drop checkout credentials
        uses: ./.trusted/.github/actions/drop-checkout-credentials

      # Cold: no sticky disk or EAS cache that trusted builds would restore.
      - name: Build
        uses: ./.trusted/.github/actions/eas-local-build
        with:
          platform: ios
          profile: preview:dev
          environment: preview
          expo-token: ${{ secrets.EXPO_PREVIEW_TOKEN }}
          output: ${{ runner.temp }}/t3code-preview.ipa
          cache: "false"

      - id: build
        name: Upload
        working-directory: apps/mobile
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_PREVIEW_TOKEN }}
        run: |
          eas upload --platform ios --build-path "$RUNNER_TEMP/t3code-preview.ipa" --fingerprint "$FINGERPRINT" --non-interactive --json | tee "$RUNNER_TEMP/upload.json"
          link="$(sed -n '/^{/,$p' "$RUNNER_TEMP/upload.json" | jq -r '.url // empty')"
          if [ -z "$link" ]; then
            echo "::error::eas upload returned no install link"
            exit 1
          fi
          echo "link=$link" >> "$GITHUB_OUTPUT"

  comment:
    name: Mobile preview comment
    needs: [validate, preview, android-build, ios-build]
    if: >-
      always() && !cancelled() &&
      needs.validate.result == 'success' &&
      needs.validate.outputs.run_attempt == github.run_attempt &&
      needs.preview.result == 'success'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    concurrency:
      group: mobile-preview-comment-${{ needs.validate.outputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout comment script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts

      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.validate.outputs.pr_number }}
          PR_HEAD_SHA: ${{ needs.validate.outputs.head_sha }}
          ANDROID_FINGERPRINT: ${{ needs.preview.outputs.fingerprint }}
          ANDROID_GROUP: ${{ needs.preview.outputs.group }}
          ANDROID_CLIENT: ${{ needs.android-build.outputs.client || needs.preview.outputs.client }}
          IOS_FINGERPRINT: ${{ needs.preview.outputs.ios_fingerprint }}
          IOS_GROUP: ${{ needs.preview.outputs.ios_group }}
          IOS_CLIENT: ${{ needs.ios-build.outputs.client || needs.preview.outputs.ios_client }}
        run: node .github/scripts/mobile-preview-comment.cjs
