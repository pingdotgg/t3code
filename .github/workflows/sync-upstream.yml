name: Sync upstream

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream and publish packages
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream main
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          before=$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)

          # The fork-sync API can update workflow files with contents:write.
          # A Git push with GITHUB_TOKEN cannot.
          gh api --method POST "repos/$GH_REPO/merge-upstream" -f branch=main

          after=$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)
          if [[ "$before" == "$after" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish updated packages
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pkg-pr-new.yml --ref main
