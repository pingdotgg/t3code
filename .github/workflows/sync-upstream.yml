name: Sync upstream

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream and publish packages
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream main
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh auth setup-git
          git clone --single-branch --branch main --no-tags "https://github.com/$GH_REPO.git" .
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          workflow_base=$(git merge-base HEAD upstream/main)
          git diff --name-status "$workflow_base" upstream/main -- .github/workflows \
            > "$RUNNER_TEMP/upstream-workflows.txt"

          # Workflows are fork-owned. GITHUB_TOKEN cannot push upstream workflow
          # changes, and the fork has different release and package operations.
          if ! git merge --no-commit upstream/main; then
            conflicts=$(git diff --name-only --diff-filter=U -- . \
              ':(exclude).github/workflows/**')
            if [[ -n "$conflicts" ]]; then
              printf 'Unresolved upstream conflicts:\n%s\n' "$conflicts" >&2
              exit 1
            fi
          fi
          git restore --source=HEAD --staged --worktree -- .github/workflows
          git commit --no-edit
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

          if [[ -s "$RUNNER_TEMP/upstream-workflows.txt" ]]; then
            echo "::warning title=Upstream workflows preserved::Review the workflow changes listed in the job summary"
            {
              echo "### Upstream workflow changes need manual review"
              echo
              echo '```text'
              cat "$RUNNER_TEMP/upstream-workflows.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish updated packages
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pkg-pr-new.yml --ref main
