name: Continuum CI

# Continuum IDE's own checks on GitHub-hosted runners. Upstream T3 Code's ci.yml
# targets paid Blacksmith runners and is disabled in this fork's Actions settings.

on:
  pull_request:
  push:
    branches:
      - main
      - "continuum/**"
  workflow_dispatch:
    inputs:
      platform_smoke:
        description: Run the stock Android pairing and iOS simulator source build
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: continuum-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Vite+ and dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Lint
        run: vp run lint

      - name: Typecheck
        run: vp run typecheck

  test:
    name: Test ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: contracts, shared, client-runtime
            command: vp run --filter @t3tools/contracts --filter @t3tools/shared --filter @t3tools/client-runtime test
          - name: desktop
            command: vp run --filter @t3tools/desktop test
          # The server suite takes over 45 minutes on one hosted runner; its preview tests drive Chromium.
          - name: server 1/4
            command: vp test run --shard 1/4
            directory: apps/server
            browsers: true
          - name: server 2/4
            command: vp test run --shard 2/4
            directory: apps/server
            browsers: true
          - name: server 3/4
            command: vp test run --shard 3/4
            directory: apps/server
            browsers: true
          - name: server 4/4
            command: vp test run --shard 4/4
            directory: apps/server
            browsers: true
          - name: web (unit)
            command: vp test run --passWithNoTests --project unit
            directory: apps/web
          # The browser project is sharded: one Chromium for every file runs out of memory here.
          - name: web (browser 1/4)
            command: vp test run --passWithNoTests --project browser --shard 1/4
            directory: apps/web
            browsers: true
          - name: web (browser 2/4)
            command: vp test run --passWithNoTests --project browser --shard 2/4
            directory: apps/web
            browsers: true
          - name: web (browser 3/4)
            command: vp test run --passWithNoTests --project browser --shard 3/4
            directory: apps/web
            browsers: true
          - name: web (browser 4/4)
            command: vp test run --passWithNoTests --project browser --shard 4/4
            directory: apps/web
            browsers: true
          - name: scripts
            command: vp run --filter @t3tools/scripts test
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Vite+ and dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Install native build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Install Electron runtime
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Install Playwright Chromium
        if: matrix.browsers
        run: node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium

      - name: Test
        working-directory: ${{ matrix.directory || '.' }}
        run: ${{ matrix.command }}

  desktop-build:
    name: Linux desktop package (smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Vite+ and dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Install Electron runtime
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Build AppImage and .deb
        run: vp run dist:desktop:artifact --platform linux --target AppImage --arch x64 --verbose

      - name: Check the package identity
        run: |
          set -euo pipefail
          ls -l release
          test -f release/Continuum-IDE-x86_64.AppImage
          test -f release/Continuum-IDE-amd64.deb
          dpkg-deb --field release/Continuum-IDE-amd64.deb Package Version Maintainer
          test "$(dpkg-deb --field release/Continuum-IDE-amd64.deb Package)" = "continuum-ide"

  stock-android:
    name: Pair stock Android beta with Continuum
    if: inputs.platform_smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-ci-deps
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and pair stock beta APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          script: bash scripts/continuum-android-smoke.sh

  ios-simulator-source:
    name: Build the iOS simulator client from source
    if: inputs.platform_smoke
    runs-on: macos-15
    timeout-minutes: 45
    env:
      T3_NATIVE_CLIENT_CACHE: "off"
      T3_NATIVE_CLIENT_BUILD: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-ci-deps
      - name: Build the native simulator app
        run: |
          set -euo pipefail
          xcrun --find xcodebuild
          pod --version
          result="$(vp run mobile:install ios --prepare | tail -1)"
          echo "$result" | jq -e '.status == "ready" and .source == "build"'
          fingerprint="$(echo "$result" | jq -r '.fingerprint')"
          app="$HOME/.cache/t3code/native-clients/artifacts/ios/development/$fingerprint/T3CodeDev.app"
          test -f "$app/Info.plist"
          xcrun vtool -show-build "$app/T3CodeDev" | grep -qi IOSSIMULATOR
