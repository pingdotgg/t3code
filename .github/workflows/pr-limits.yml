name: PR Limits

# Deterministic PR rules from CONTRIBUTING.md: the open PR limit, the conflict
# window, and the 72 hour close window that follows a triage notice.
#
# Nothing is labeled, commented on, or closed until the repository variable
# PR_LIMITS_ENFORCE is "true". Until then every run logs what it would do.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log what the sweep would do without labeling, commenting, or closing.
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  open-limit:
    name: Open PR limit
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.action == 'opened' || github.event.action == 'reopened')
    runs-on: ubuntu-24.04
    steps:
      # pull_request_target has a write token. Load the script from the default
      # branch and never run PR code. Cone mode also checks out the files beside
      # .github/scripts, which is where TRIAGE_EXEMPTIONS.td lives.
      - name: Checkout trusted scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts

      - id: vouch
        name: Check PR author trust
        uses: mitchellh/vouch/action/check-user@v1
        with:
          user: ${{ github.event.pull_request.user.login }}
          allow-fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Close PRs over the limit
        uses: actions/github-script@v8
        env:
          VOUCH_STATUS: ${{ steps.vouch.outputs.status }}
          DRY_RUN: ${{ vars.PR_LIMITS_ENFORCE != 'true' }}
        with:
          script: |
            const limits = require("./.github/scripts/pr-limits.cjs");
            await limits.enforceOpenLimit({ github, context, core, dryRun: process.env.DRY_RUN === "true" });

  author-activity:
    name: Clear windows on author activity
    # A push answers a rebase request, and a push or an author reply sends a
    # triage notice back to triage. Skip everything else before a runner starts.
    if: >-
      vars.PR_LIMITS_ENFORCE == 'true' &&
      ((github.event_name == 'pull_request_target' &&
        github.event.action == 'synchronize' &&
        (contains(github.event.pull_request.labels.*.name, 'needs-rebase') ||
          contains(github.event.pull_request.labels.*.name, 'triage:closing'))) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.issue.labels.*.name, 'triage:closing') &&
        github.event.comment.user.login == github.event.issue.user.login))
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts

      - name: Remove answered labels
        uses: actions/github-script@v8
        with:
          script: |
            const limits = require("./.github/scripts/pr-limits.cjs");
            await limits.clearAnswered({ github, context, core });

  sweep:
    name: Close windows
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    concurrency:
      group: pr-limits-sweep
      cancel-in-progress: false
    steps:
      # Cone mode also checks out the files beside .github/scripts, which is
      # where TRIAGE_EXEMPTIONS.td lives.
      - name: Checkout trusted scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts

      - name: Apply the conflict and close windows
        uses: actions/github-script@v8
        env:
          DRY_RUN: ${{ vars.PR_LIMITS_ENFORCE != 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        with:
          script: |
            const limits = require("./.github/scripts/pr-limits.cjs");
            await limits.sweep({ github, context, core, dryRun: process.env.DRY_RUN === "true" });
