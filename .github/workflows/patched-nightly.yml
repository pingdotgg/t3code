name: Patched nightly desktop builds

on:
  schedule:
    - cron: "23 20 * * *"
  workflow_dispatch:
    inputs:
      force_testflight:
        description: "Build and upload to TestFlight even if the native fingerprint is unchanged"
        type: boolean
        default: false
  # Kept so the "Prepare latest upstream nightly" check still reports on PRs; nothing is built from one.
  pull_request:
    branches: [main]

concurrency:
  group: patched-nightly-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve:
    name: Prepare latest upstream nightly
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.prepare.outputs.should_build }}
      source_tag: ${{ steps.prepare.outputs.source_tag }}
      release_tag: ${{ steps.prepare.outputs.release_tag }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - name: Check out fork main
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PATCHED_NIGHTLY_RELEASE_TOKEN || github.token }}
          ref: ${{ github.sha }}
          fetch-depth: 0

      - id: prepare
        name: Resolve upstream source and prepare draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.sha }}
          # Newest upstream nightly merged into main; upstream-sync.yml moves these two together.
          PATCH_BASE: v0.1.13-nightly.20261125.5258
          PATCH_BASE_SHA: bf961f8121c6336915ecf7b3f97ce6e68ab38fd7
        run: |
          set -euo pipefail

          # A pull request only proves the workflow parses and its resolve job runs; CI covers the code.
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Pull request: nothing to build."
            exit 0
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Patched nightlies build main; this run is on $GITHUB_REF." >&2
            exit 1
          fi

          # main already contains the upstream nightly named by PATCH_BASE (docs/operations/upstream-sync.md
          # keeps it current), so the source of every build is main itself.
          source_tag="$PATCH_BASE"
          source_sha="$PATCH_BASE_SHA"
          fork_sha="$WORKFLOW_SHA"
          if ! git merge-base --is-ancestor "$source_sha" "$fork_sha"; then
            echo "main does not contain $source_tag ($source_sha); PATCH_BASE_SHA is stale." >&2
            exit 1
          fi

          releases="$(gh api "repos/$FORK_REPOSITORY/releases?per_page=100")"
          prior="$(jq -r --arg source "Source nightly: $source_tag" --arg fork "Fork commit: $fork_sha" \
            '[.[] | select(((.body // "") | contains($source)) and ((.body // "") | contains($fork)))] | first // empty' <<<"$releases")"
          if [[ -n "$prior" ]]; then
            release_tag="$(jq -r '.tag_name' <<<"$prior")"
            draft="$(jq -r '.draft' <<<"$prior")"
            if [[ "$draft" != "true" ]]; then
              echo "main at ${fork_sha:0:12} on $source_tag is already published as $release_tag; no build needed."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            version="${release_tag#v}"
          else
            source_version="${source_tag#v}"
            if [[ ! "$source_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-nightly\.([0-9]{8})\.([0-9]+)$ ]]; then
              echo "Unexpected upstream nightly version: $source_tag" >&2
              exit 1
            fi
            product_version="${BASH_REMATCH[1]}"
            nightly_date="${BASH_REMATCH[2]}"
            source_number="${BASH_REMATCH[3]}"
            prefix="v${product_version}-nightly.${nightly_date}."
            fork_max="$(jq -r --arg prefix "$prefix" \
              '[.[] | .tag_name | select(startswith($prefix)) | ltrimstr($prefix) | select(test("^[0-9]+$")) | tonumber] | max // 0' \
              <<<"$releases")"
            for existing_tag in $(git tag -l "${prefix}*"); do
              tag_number="${existing_tag#"$prefix"}"
              if [[ "$tag_number" =~ ^[0-9]+$ ]] && (( tag_number > fork_max )); then
                fork_max="$tag_number"
              fi
            done
            next_number=$((source_number + 1))
            if (( fork_max >= next_number )); then next_number=$((fork_max + 1)); fi
            version="${product_version}-nightly.${nightly_date}.${next_number}"
            release_tag="v$version"
          fi

          printf 'should_build=true\nsource_tag=%s\nrelease_tag=%s\nversion=%s\n' \
            "$source_tag" "$release_tag" "$version" >> "$GITHUB_OUTPUT"
          if [[ -n "$prior" ]]; then
            echo "Reusing incomplete draft release $release_tag for $source_tag."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet "refs/tags/$release_tag"; then
            existing_sha="$(git rev-parse "$release_tag^{commit}")"
            if [[ "$existing_sha" != "$fork_sha" ]]; then
              echo "Tag $release_tag already points at a different source commit." >&2
              exit 1
            fi
          else
            git tag "$release_tag" "$fork_sha"
            git push origin "refs/tags/$release_tag"
          fi
          upstream_notes="$(gh api "repos/pingdotgg/t3code/releases/tags/$source_tag" --jq '.body // empty' \
            | awk '/^<details>/ {exit} {print}' \
            | grep -v -E '^\*\*v|^#+ Plus [0-9]+ more' || true)"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## Upstream improvements

          $upstream_notes

          ## Fork changes

          ### Mobile
          - Show Mark unread in the mobile thread hold menu instead of under More.
          - Keep mobile thread rows on three lines: project, title, then branch and machine.

          ### Desktop
          - Add named workspace agents, a Composer picker, a project default agent, and per-launch model or reasoning/economy tier selection.
          - Hide settled or confirmed deleted child threads in Lineage; mark offline linked-environment children unavailable.
          - Render Codex memory citations as readable references.
          - Hide threads from disconnected environments and restore them on reconnect.
          - Order active threads by the latest message or run activity.

          ### Server
          - Allow named T3 delegate_task targets according to each lead agent's allowlist.

          <details>
          <summary>Full changelog</summary>

          https://github.com/pingdotgg/t3code/releases/tag/$source_tag

          </details>

          ---
          Source nightly: $source_tag
          Fork commit: $fork_sha
          EOF
          if gh release view "$release_tag" --repo "$FORK_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$release_tag" --repo "$FORK_REPOSITORY" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$release_tag" --repo "$FORK_REPOSITORY" \
              --title "T3 Code Nightly $version (Patched)" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --draft --prerelease
          fi

  windows:
    name: Build Windows installer
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      BUILD_VERSION: ${{ needs.resolve.outputs.version }}
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out fork workflow
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check out prepared patched nightly source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$RELEASE_TAG"
          git checkout --detach 'FETCH_HEAD^{commit}'

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Restore Windows resource monitor cache
        id: resource_monitor_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: native/resource-monitor/target/x86_64-pc-windows-msvc/release/t3-resource-monitor.exe
          key: resource-monitor-x86_64-pc-windows-msvc-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Set up Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-xwin
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-xwin@0.23.1

      - name: Build Windows resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        run: cargo xwin build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Save Windows resource monitor cache
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: native/resource-monitor/target/x86_64-pc-windows-msvc/release/t3-resource-monitor.exe
          key: ${{ steps.resource_monitor_cache.outputs.cache-primary-key }}

      - name: Load official upstream T3 Connect settings
        shell: bash
        run: cp .env.example .env

      - name: Install Linux bundle build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libsecret-1-dev

      - name: Build patched Windows installer
        shell: bash
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          T3CODE_SERVER_UPDATE_VERSION: ${{ needs.resolve.outputs.release_tag }}
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP"
          export T3CODE_SERVER_UPDATE_VERSION="${T3CODE_SERVER_UPDATE_VERSION#v}"
          node scripts/build-desktop-artifact.ts \
            --platform win --target nsis --arch x64 \
            --build-version "$BUILD_VERSION" \
            --keep-stage \
            --verbose \
            --output-dir release-patched
          gh release upload "$RELEASE_TAG" release-patched/* \
            --clobber --repo "$GITHUB_REPOSITORY"

      - name: Stage Windows runtime verification
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP"
          mkdir -p verify
          unpacked="$(find "${TMPDIR:-/tmp}" -type d -path '*/t3code-desktop-win-stage-*/app/dist/win-unpacked' -print -quit)"
          if [[ -z "$unpacked" ]]; then
            echo "The staged Windows app directory was not found." >&2
            exit 1
          fi
          tar -C "$(dirname "$unpacked")" -cf verify/unpacked.tar "$(basename "$unpacked")"
          esbuild=scripts/node_modules/.bin/esbuild
          banner="import{createRequire as __cr}from'node:module';const require=__cr(import.meta.url);"
          "$esbuild" scripts/verify-windows-desktop-artifact.ts --bundle --platform=node --format=esm \
            --target=node24 --define:import.meta.main=false --banner:js="$banner" \
            --outfile=verify/verify-windows-desktop-artifact.mjs

      - name: Upload Windows runtime verification inputs
        uses: actions/upload-artifact@v7
        with:
          name: patched-nightly-windows-verify
          path: verify/*
          if-no-files-found: error
          compression-level: 1

  windows_verify:
    name: Verify Windows installer
    needs: [resolve, windows]
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    env:
      BUILD_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Download Windows verification inputs
        uses: actions/download-artifact@v8
        with:
          name: patched-nightly-windows-verify
          path: verify

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Windows packaged runtime
        shell: bash
        run: |
          set -euo pipefail
          tar -C verify -xf verify/unpacked.tar
          node verify/verify-windows-desktop-artifact.mjs \
            --app-dir "$(cygpath -w "$PWD/verify/win-unpacked")" \
            --arch x64 --build-version "$BUILD_VERSION" --verbose

  linux:
    name: Build Linux x64 server archive
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      BUILD_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Check out fork workflow
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check out prepared patched nightly source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$RELEASE_TAG"
          git checkout --detach 'FETCH_HEAD^{commit}'

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      # The CLI archive embeds the server bundle and web client only, so the
      # desktop and mobile workspaces are not installed.
      - name: Install server dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Restore Linux resource monitor cache
        id: resource_monitor_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor
          key: resource-monitor-x86_64-unknown-linux-gnu-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Set up Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Build Linux resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu

      - name: Save Linux resource monitor cache
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor
          key: ${{ steps.resource_monitor_cache.outputs.cache-primary-key }}

      - name: Load official upstream T3 Connect settings
        shell: bash
        run: cp .env.example .env

      # Every key must resolve through loadRepoEnv, the loader the build scripts use, so a build
      # without T3 Connect settings fails here instead of shipping an unconfigured app.
      - name: Verify official upstream T3 Connect settings
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { loadRepoEnv } from "./scripts/lib/public-config.ts";
          const env = loadRepoEnv({ baseEnv: {} });
          const required = [
            "T3CODE_CLERK_PUBLISHABLE_KEY",
            "T3CODE_CLERK_JWT_TEMPLATE",
            "T3CODE_CLERK_CLI_OAUTH_CLIENT_ID",
            "T3CODE_RELAY_URL",
          ];
          const missing = required.filter((name) => !env[name]?.trim());
          if (missing.length > 0) {
            console.error(`Missing official T3 Connect settings: ${missing.join(", ")}`);
            process.exit(1);
          }
          console.log("Official T3 Connect settings resolved.");
          EOF

      # The launcher on a server refuses a child whose package version differs
      # from the version directory it was started from.
      - name: Align package versions to the patched release version
        run: node scripts/update-release-package-versions.ts "$BUILD_VERSION"

      - name: Build server bundle and web client
        run: vp run --filter t3 build

      - name: Apply nightly web client branding
        run: node scripts/apply-web-brand-assets.ts nightly apps/server/dist/client

      - name: Build CLI single-executable
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Stage resource monitor for the CLI archive
        run: |
          set -euo pipefail
          target_dir="$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          mkdir -p "$target_dir"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$target_dir/"

      # The archive ships libatomic.so.1 and points t3's RUNPATH at it.
      - name: Install patchelf
        run: command -v patchelf || { sudo apt-get update && sudo apt-get install -y patchelf; }

      - name: Build Linux x64 CLI archive
        run: |
          set -euo pipefail
          node scripts/build-cli-archive.ts \
            --platform linux --arch x64 \
            --version "$BUILD_VERSION" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Smoke-test CLI archive
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "$BUILD_VERSION"

      # The server's own runtime installer reads this file next to the archive,
      # so a server pointed at this repository's releases can install it.
      - name: Upload Linux server archive to the release
        run: |
          set -euo pipefail
          (cd release-cli && sha256sum t3-*.tar.gz > SHA256SUMS)
          gh release upload "$RELEASE_TAG" release-cli/* \
            --clobber --repo "$GITHUB_REPOSITORY"

  macos:
    name: Build macOS installers
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            rust_target: aarch64-apple-darwin
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      BUILD_VERSION: ${{ needs.resolve.outputs.version }}
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out fork workflow
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check out prepared patched nightly source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$RELEASE_TAG"
          git checkout --detach 'FETCH_HEAD^{commit}'

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Load official upstream T3 Connect settings
        shell: bash
        run: cp .env.example .env

      - name: Build patched macOS installer
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          T3CODE_SERVER_UPDATE_VERSION: ${{ needs.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ -z "${CSC_LINK:-}" || -z "${CSC_KEY_PASSWORD:-}" ]]; then
            echo "Missing Developer ID signing secrets; refusing to build an unsigned macOS updater." >&2
            exit 1
          fi
          if [[ -z "${APPLE_API_KEY:-}" || -z "${APPLE_API_KEY_ID:-}" || -z "${APPLE_API_ISSUER:-}" ]]; then
            echo "Missing App Store Connect notarization secrets; refusing to publish an unnotarized macOS build." >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          chmod 600 "$key_path"
          export APPLE_API_KEY="$key_path"
          export T3CODE_SERVER_UPDATE_VERSION="${T3CODE_SERVER_UPDATE_VERSION#v}"
          node scripts/build-desktop-artifact.ts \
            --platform mac --target dmg --arch "${{ matrix.arch }}" \
            --signed \
            --build-version "$BUILD_VERSION" \
            --output-dir "release-patched-${{ matrix.arch }}"
          gh release upload "$RELEASE_TAG" "release-patched-${{ matrix.arch }}"/* \
            --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    name: Publish completed nightly
    needs: [resolve, windows, windows_verify, linux, macos]
    if: ${{ always() && needs.resolve.outputs.should_build == 'true' && needs.windows.result == 'success' && needs.windows_verify.result == 'success' && needs.linux.result == 'success' && needs.macos.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          releases="$(gh api "repos/$FORK_REPOSITORY/releases?per_page=100")"
          release_id="$(jq -r --arg tag "$RELEASE_TAG" \
            '[.[] | select(.tag_name == $tag)] | first | .id // empty' <<<"$releases")"
          if [[ -z "$release_id" || "$release_id" == "null" ]]; then
            echo "Draft release $RELEASE_TAG was not found." >&2
            exit 1
          fi
          gh api --method PATCH "repos/$FORK_REPOSITORY/releases/$release_id" \
            -F draft=false -F prerelease=true >/dev/null

  mobile_ota:
    name: Publish mobile OTA update
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      APP_VARIANT: development
      # Must match the build installed on the devices so the app accepts the update.
      T3CODE_MOBILE_IOS_BUNDLE_IDENTIFIER: com.louisefindlay23.t3code
      T3CODE_MOBILE_UPDATE_CHANNEL: nightly
    steps:
      - name: Check out prepared patched nightly source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: refs/tags/${{ needs.resolve.outputs.release_tag }}

      # app.config.ts reads only .env and .env.local, never .env.example. The file holds public
      # identifiers only; telemetry tokens and other credentials stay out of the build.
      - name: Load official upstream T3 Connect settings
        run: cp .env.example .env

      # Every key must resolve through loadRepoEnv, the loader the build scripts use, so a build
      # without T3 Connect settings fails here instead of shipping an unconfigured app.
      - name: Verify official upstream T3 Connect settings
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { loadRepoEnv } from "./scripts/lib/public-config.ts";
          const env = loadRepoEnv({ baseEnv: {} });
          const required = [
            "T3CODE_CLERK_PUBLISHABLE_KEY",
            "T3CODE_CLERK_JWT_TEMPLATE",
            "T3CODE_CLERK_CLI_OAUTH_CLIENT_ID",
            "T3CODE_RELAY_URL",
          ];
          const missing = required.filter((name) => !env[name]?.trim());
          if (missing.length > 0) {
            console.error(`Missing official T3 Connect settings: ${missing.join(", ")}`);
            process.exit(1);
          }
          console.log("Official T3 Connect settings resolved.");
          EOF

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          echo "$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin" >> "$GITHUB_PATH"

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Publish OTA update
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas update \
            --branch nightly \
            --platform ios \
            --message "Patched nightly $RELEASE_TAG" \
            --non-interactive

      # TestFlight builds register production APNs tokens, so they follow their own channel whose
      # manifest carries that setting. Sandbox-signed dev builds stay on `nightly`.
      - name: Publish TestFlight channel OTA update
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          T3CODE_MOBILE_UPDATE_CHANNEL: testflight
          T3CODE_MOBILE_APS_ENVIRONMENT: production
        run: |
          eas channel:create testflight --non-interactive || true
          eas update \
            --branch testflight \
            --platform ios \
            --message "Patched nightly $RELEASE_TAG" \
            --non-interactive

  # Native code changes rarely, so TestFlight rebuilds only when the iOS native fingerprint
  # changes or the newest build nears TestFlight's 90-day expiry; JS changes ship through OTA.
  mobile_native_check:
    name: Check whether TestFlight needs a build
    needs: [resolve, mobile_ota]
    if: needs.resolve.outputs.should_build == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      key: ${{ steps.decide.outputs.key }}
    env:
      APP_VARIANT: development
      T3CODE_MOBILE_IOS_BUNDLE_IDENTIFIER: com.louisefindlay23.t3code
      T3CODE_MOBILE_UPDATE_CHANNEL: testflight
      T3CODE_MOBILE_APS_ENVIRONMENT: production
    steps:
      - name: Check out prepared patched nightly source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.resolve.outputs.release_tag }}

      - name: Load official upstream T3 Connect settings
        run: cp .env.example .env

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          echo "$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin" >> "$GITHUB_PATH"

      - id: decide
        name: Compare native fingerprint with the last TestFlight build
        working-directory: apps/mobile
        shell: bash
        env:
          FORCE: ${{ inputs.force_testflight || 'false' }}
        run: |
          set -euo pipefail
          hash="$(pnpm exec fingerprint fingerprint:generate --platform ios | sed -n '/^{/,$p' | jq -er '.hash')"
          # The runtime version is the app version, so a bump strands OTAs just like native changes.
          version="$(pnpm exec expo config --json | jq -er '.version')"
          key="${hash:0:12}-$version"
          tag="testflight/$key"
          last="$(git for-each-ref --sort=-creatordate --count=1 --format='%(creatordate:unix)' 'refs/tags/testflight/*')"
          age_days=$(( (  $(date +%s) - ${last:-0} ) / 86400 ))
          build=false
          if [ "$FORCE" = "true" ]; then build=true; reason="forced"
          elif ! git show-ref --verify --quiet "refs/tags/$tag"; then build=true; reason="native fingerprint $key has no TestFlight build"
          elif [ "$age_days" -ge 60 ]; then build=true; reason="last TestFlight build is $age_days days old (expires at 90)"
          else reason="fingerprint $key already on TestFlight ($age_days days old)"; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "TestFlight build: $build ($reason)" | tee -a "$GITHUB_STEP_SUMMARY"

  mobile_testflight:
    name: Build and upload TestFlight
    needs: [resolve, mobile_native_check]
    if: needs.mobile_native_check.outputs.build == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      APP_VARIANT: development
      T3CODE_MOBILE_IOS_BUNDLE_IDENTIFIER: com.louisefindlay23.t3code
      T3CODE_MOBILE_UPDATE_CHANNEL: testflight
      T3CODE_MOBILE_APS_ENVIRONMENT: production
      TEAM_ID: 977GLV4RS3
    steps:
      - name: Check out prepared patched nightly source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.resolve.outputs.release_tag }}

      - name: Load official upstream T3 Connect settings
        run: cp .env.example .env

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          echo "$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin" >> "$GITHUB_PATH"

      - name: Generate the native iOS project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install

      # Apple's cloud signing creates and renews the distribution certificate and profiles from
      # the App Store Connect API key, so no .p12 or profile is stored.
      - name: Archive, export and upload to TestFlight
        working-directory: apps/mobile/ios
        env:
          APPLE_API_KEY: ${{ secrets.ASC_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.ASC_API_ISSUER }}
        run: |
          set -euo pipefail
          for name in APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name}" ] || { echo "$name is not set" >&2; exit 1; }
          done
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          (umask 077; printf '%s' "$APPLE_API_KEY" > "$key_path")
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$APPLE_API_KEY_ID" -authenticationKeyIssuerID "$APPLE_API_ISSUER")
          workspace="$(/bin/ls -d *.xcworkspace | head -n1)"
          scheme="${workspace%.xcworkspace}"
          xcodebuild archive -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/app.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" "${auth[@]}"
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${auth[@]}"
          rm -f "$key_path"

      # Notes are a courtesy: a failure here must not block recording the delivered build.
      - name: Set TestFlight What to Test
        continue-on-error: true
        env:
          APPLE_API_KEY: ${{ secrets.ASC_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.ASC_API_ISSUER }}
          BUNDLE_ID: com.louisefindlay23.t3code
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          BASE_REF="$(git for-each-ref --sort=-creatordate --count=1 --format='%(*objectname)' 'refs/tags/testflight/*')"
          BASE_REF="$BASE_REF" node .github/scripts/testflight-whats-new.cjs

      # The tag means "delivered", so it follows the upload.
      - name: Record the TestFlight build
        env:
          # The tagged commit contains workflow files, so only the release token may push it.
          RELEASE_TOKEN: ${{ secrets.PATCHED_NIGHTLY_RELEASE_TOKEN }}
          KEY: ${{ needs.mobile_native_check.outputs.key }}
        run: |
          git tag -f -a "testflight/$KEY" -m "TestFlight build for ${{ needs.resolve.outputs.release_tag }}"
          git push -f "https://x-access-token:${RELEASE_TOKEN}@github.com/${{ github.repository }}" "refs/tags/testflight/$KEY"
          echo "Uploaded to TestFlight and recorded testflight/$KEY" >> "$GITHUB_STEP_SUMMARY"
