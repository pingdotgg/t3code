name: Jarvis macOS desktop

on:
  workflow_call:
    inputs:
      version:
        description: "Jarvis version to package (for example 1.2.3)"
        required: true
        type: string
      public_release:
        description: "Require complete Apple signing and notarization for public release."
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: "Jarvis version to package (for example 1.2.3)"
        required: true
        type: string
      public_release:
        description: "Require complete Apple signing and notarization for public release."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: jarvis-desktop-mac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Jarvis macOS ${{ matrix.arch }} desktop
    # Package and launch each artifact on a native hosted runner. The startup
    # smoke rejects any accidental architecture mismatch before spawning it.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    env:
      JARVIS_MAC_VERSION: ${{ inputs.version }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_PASSKEY_RP_DOMAINS: ${{ vars.CLERK_PASSKEY_RP_DOMAINS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve Apple signing policy
        id: signing
        shell: bash
        env:
          PUBLIC_RELEASE: ${{ inputs.public_release }}
          T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          T3CODE_CLERK_PASSKEY_RP_DOMAINS: ${{ vars.CLERK_PASSKEY_RP_DOMAINS }}
        run: |
          set -euo pipefail
          required=(
            CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
          )
          missing=()
          present=0
          for name in "${required[@]}"; do
            if [[ -n "${!name:-}" ]]; then
              present=$((present + 1))
            else
              missing+=("$name")
            fi
          done
          if [[ "$PUBLIC_RELEASE" != "true" ]]; then
            echo "Public release disabled; continuing with unsigned preview/manual verification."
            echo "JARVIS_MAC_SIGNED=false" >> "$GITHUB_ENV"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "passkeys=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ((present > 0 && ${#missing[@]} > 0)); then
            echo "Apple signing configuration is incomplete: missing ${missing[*]}" >&2
            exit 1
          fi
          if ((present == 0)); then
            if [[ "$PUBLIC_RELEASE" == "true" ]]; then
              echo "Public Jarvis macOS release is closed: Apple signing/notarization credentials are missing." >&2
              exit 1
            fi
            echo "No Apple credentials supplied; continuing with unsigned manual verification."
            echo "JARVIS_MAC_SIGNED=false" >> "$GITHUB_ENV"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          passkey_values=(
            "$APPLE_TEAM_ID"
            "$MACOS_PROVISIONING_PROFILE"
            "${T3CODE_CLERK_PUBLISHABLE_KEY:-}${T3CODE_CLERK_PASSKEY_RP_DOMAINS:-}"
          )
          passkey_present=0
          for value in "${passkey_values[@]}"; do
            [[ -n "${value//[[:space:]]/}" ]] && passkey_present=$((passkey_present + 1))
          done
          if ((passkey_present > 0 && passkey_present < 3)); then
            echo "macOS passkey configuration is incomplete: APPLE_TEAM_ID, MACOS_PROVISIONING_PROFILE, and Clerk publishable key or RP domains must be supplied together." >&2
            exit 1
          fi
          if ((passkey_present == 3)); then
            [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || {
              echo "APPLE_TEAM_ID must be a 10-character Apple Developer Team ID." >&2
              exit 1
            }
            echo "JARVIS_MAC_PASSKEYS=true" >> "$GITHUB_ENV"
            echo "passkeys=true" >> "$GITHUB_OUTPUT"
          else
            echo "JARVIS_MAC_PASSKEYS=false" >> "$GITHUB_ENV"
            echo "passkeys=false" >> "$GITHUB_OUTPUT"
          fi
          echo "JARVIS_MAC_SIGNED=true" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Resolve and verify version
        shell: bash
        run: |
          set -euo pipefail
          version="${JARVIS_MAC_VERSION#v}"
          package_version="$(node -p "require('./apps/desktop/package.json').version")"
          [[ "$version" == "$package_version" ]] || {
            echo "Requested version $version does not match desktop package $package_version." >&2
            exit 1
          }
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid Jarvis version: $version" >&2
            exit 1
          }
          echo "JARVIS_MAC_VERSION=$version" >> "$GITHUB_ENV"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=@t3tools/jarvis-native-voice...
              - --filter=t3...
              - --filter=@t3tools/scripts...

      - name: Focused Mac contracts and typechecks
        run: |
          vp test run \
            apps/desktop/src/app/DesktopStartupProbe.test.ts \
            apps/desktop/src/shell/DesktopJarvisShell.test.ts \
            apps/desktop/src/preload/RendererPcmCapture.test.ts \
            apps/desktop/src/voice/DesktopVoiceWorkerProtocol.test.ts \
            packages/jarvis-native-voice/src/native-speech.test.ts \
            scripts/build-desktop-artifact.test.ts \
            scripts/mac-desktop-startup-smoke.test.ts \
            scripts/verify-jarvis-release.test.ts
          vp run --filter @t3tools/jarvis-native-voice typecheck
          vp run --filter @t3tools/desktop typecheck

      - name: Materialize Apple signing inputs
        if: ${{ steps.signing.outputs.signed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
          if [[ "${JARVIS_MAC_PASSKEYS:-false}" == "true" ]]; then
            profile_path="$RUNNER_TEMP/jarvis.provisionprofile"
            printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 -D > "$profile_path"
            security cms -D -i "$profile_path" >/dev/null
            echo "T3CODE_MACOS_PROVISIONING_PROFILE=$profile_path" >> "$GITHUB_ENV"
            echo "T3CODE_APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          fi

      - name: Build Pocket speech runtime
        run: node packages/jarvis-native-voice/scripts/build-pocket-runtime.mjs

      - name: Prepare shared native voice resources for macOS Desktop
        run: vp run --filter @t3tools/jarvis-native-voice prepare:voice

      - name: Build Full Desktop DMG
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          args=(
            --platform mac \
            --target dmg \
            --arch "${{ matrix.arch }}" \
            --build-version "$JARVIS_MAC_VERSION" \
            --voice-resources-dir packages/jarvis-native-voice/resources \
            --output-dir release
          )
          if [[ "$JARVIS_MAC_SIGNED" == "true" ]]; then
            args+=(--signed)
          fi
          node scripts/build-desktop-artifact.ts "${args[@]}"

      - name: Verify mounted DMG, installed identity/resources, and startup receipt
        shell: bash
        run: |
          set -euo pipefail
          artifact="release/Jarvis-${JARVIS_MAC_VERSION}-${{ matrix.arch }}.dmg"
          [[ -f "$artifact" ]] || { echo "Expected DMG is missing." >&2; exit 1; }
          mount_root="$RUNNER_TEMP/jarvis-dmg-${{ matrix.arch }}"
          application_root="$RUNNER_TEMP/jarvis-applications-${{ matrix.arch }}"
          copied_app="$application_root/Jarvis.app"
          rm -rf "$application_root"
          mkdir -p "$mount_root" "$application_root"
          mounted=false
          cleanup() {
            if [[ "$mounted" == "true" ]]; then
              if ! hdiutil detach "$mount_root" -quiet; then
                echo "Refusing to remove the still-mounted DMG at $mount_root." >&2
                return 1
              fi
              mounted=false
            fi
            rm -rf "$mount_root" "$application_root"
          }
          trap cleanup EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_root" "$artifact"
          mounted=true
          mounted_app="$mount_root/Jarvis.app"
          [[ -d "$mounted_app" ]] || { echo "Mounted DMG does not contain Jarvis.app." >&2; exit 1; }
          ditto "$mounted_app" "$copied_app"
          hdiutil detach "$mount_root" -quiet
          mounted=false
          rm -rf "$mount_root"
          app="$copied_app"
          [[ -d "$app" ]] || { echo "Copied DMG app is missing." >&2; exit 1; }
          if [[ "$JARVIS_MAC_SIGNED" == "true" ]]; then
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
            xcrun stapler validate "$artifact"
            codesign --display --entitlements :- "$app" 2>/dev/null | grep -q 'com.apple.security.device.audio-input'
          else
            echo "Unsigned manual verification: skipping codesign, Gatekeeper, and stapler checks."
          fi
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")"
          display_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Contents/Info.plist")"
          [[ "$bundle_id" == "com.abstergo.jarvis" && "$display_name" == "Jarvis" ]] || {
            echo "Unexpected macOS app identity: $bundle_id / $display_name" >&2
            exit 1
          }
          test -f "$app/Contents/Resources/jarvis-official-release.json"
          voice_root="$app/Contents/Resources/jarvis-resources"
          for required_voice_file in \
            parakeet/encoder.int8.onnx \
            parakeet/decoder.int8.onnx \
            parakeet/joiner.int8.onnx \
            parakeet/tokens.txt \
            pocket/models/flow_lm_main_int8.onnx \
            pocket/models/flow_lm_flow.onnx \
            pocket/models/mimi_decoder.onnx \
            pocket/models/mimi_encoder.onnx \
            pocket/models/bos_before_voice.f32 \
            pocket/models/tokenizer.model \
            pocket/models/bundle.json \
            pocket/voices/alba-casual-3s.wav \
            pocket/PROVENANCE.json \
            THIRD_PARTY_NOTICES.md; do
            test -f "$voice_root/$required_voice_file"
          done
          # electron-builder may unpack the JavaScript shell of a dependency
          # that has native entry points even when every platform binary was
          # excluded. The Mac contract is about native capture not being
          # shipped, so reject native artifacts rather than an inert package
          # directory (which is harmless and can be produced by builder).
          for native_root in \
            "$app/Contents/Resources/app.asar.unpacked/node_modules/node-cpal" \
            "$app/Contents/Resources/app.asar.unpacked/node_modules/uiohook-napi"; do
            if [[ -d "$native_root" ]]; then
              native_files="$(find "$native_root" -type f \( -name '*.node' -o -name '*.dylib' -o -name '*.so' -o -name '*.dll' \) -print -quit)"
              if [[ -n "$native_files" ]]; then
                echo "Unexpected native microphone or hook artifact staged on macOS: $native_files" >&2
                exit 1
              fi
            fi
          done
          test ! -e "$app/Contents/Resources/app.asar.unpacked/node_modules/@t3tools/jarvis-native-microphone"
          sherpa_root="$app/Contents/Resources/app.asar.unpacked/node_modules"
          test -f "$sherpa_root/sherpa-onnx-darwin-${{ matrix.arch }}/sherpa-onnx.node"
          for sherpa_arch in darwin-arm64 darwin-x64; do
            if [[ "$sherpa_arch" != "darwin-${{ matrix.arch }}" && -e "$sherpa_root/sherpa-onnx-$sherpa_arch" ]]; then
              echo "Unexpected sherpa target directory staged on macOS: $sherpa_arch" >&2
              exit 1
            fi
          done
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Contents/Info.plist" >/dev/null
          # The renderer's deterministic fake-media/AudioWorklet lifecycle is
          # covered by RendererPcmCapture.test.ts above. This packaged check
          # proves its preload entry is present; it cannot prove TCC or a
          # physical microphone on the hosted runner.
          node - "$app/Contents/Resources/app.asar" <<'NODE'
          const { listPackage } = require("./scripts/node_modules/@electron/asar");
          const entries = listPackage(process.argv[2]).map((entry) => entry.replace(/^\/+/, ""));
          for (const entry of ["apps/desktop/dist-electron/preload.cjs", "apps/desktop/dist-electron/desktopVoiceWorker.cjs", "apps/desktop/dist-electron/pocket-worker.cjs"]) {
            if (!entries.includes(entry)) throw new Error(`Missing packaged Full Desktop entry ${entry}`);
          }
          for (const worker of ["desktopVoiceWorker.cjs", "pocket-worker.cjs"]) {
            if (!entries.includes(`apps/desktop/dist-electron/${worker}`)) throw new Error(`Missing native voice worker ${worker}`);
          }
          if (entries.some((entry) => entry.includes("companion"))) throw new Error("Full Desktop contains Companion files.");
          NODE
          probe="$RUNNER_TEMP/jarvis-startup-${{ matrix.arch }}.json"
          rm -f "$probe"
          node scripts/mac-desktop-startup-smoke.mjs \
            "$app" \
            "$probe" \
            "$JARVIS_MAC_VERSION" \
            "${{ matrix.arch }}" \
            "$RUNNER_TEMP/jarvis-mac-${{ matrix.arch }}.log"

      - name: Upload Mac startup log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: jarvis-mac-startup-${{ matrix.arch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/jarvis-mac-${{ matrix.arch }}.log
          if-no-files-found: warn

      - name: Write Mac checksums and provenance
        shell: bash
        run: |
          set -euo pipefail
          for artifact in "release/Jarvis-${JARVIS_MAC_VERSION}-${{ matrix.arch }}.dmg"; do
            (cd release && shasum -a 256 "$(basename "$artifact")" > "$(basename "$artifact").sha256")
            digest="$(shasum -a 256 "$artifact" | awk '{print $1}')"
            node -e '
              const fs = require("node:fs");
              const [file, version, sourceCommit, artifactName, artifactSha256, arch] = process.argv.slice(1);
              fs.writeFileSync(file, `${JSON.stringify({ format: 1, product: "Jarvis", version, platform: "mac", arch, artifactName, artifactSha256, sourceCommit }, null, 2)}\n`);
            ' "${artifact}.provenance.json" "$JARVIS_MAC_VERSION" "$GITHUB_SHA" "$(basename "$artifact")" "$digest" "${{ matrix.arch }}"
          done

      - name: Upload Mac desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: jarvis-desktop-mac-${{ matrix.arch }}-${{ env.JARVIS_MAC_VERSION }}
          path: release/*
          if-no-files-found: error
