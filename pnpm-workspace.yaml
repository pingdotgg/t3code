  "@legendapp/list@3.3.5": patches/@legendapp__list@3.3.5.patch
  # Exports the dependency-light subpaths mobile and the web diff parser import, and keeps
  # measured wrapped-row heights above an edit (fileEditorVirtualization.test.ts).
  "@pierre/diffs@1.5.2": patches/@pierre%2Fdiffs@1.5.2.patch
  "@react-native-ai/apple@0.12.0": patches/@react-native-ai__apple@0.12.0.patch
  "@react-native-menu/menu@2.0.0": patches/@react-native-menu__menu@2.0.0.patch
  "@react-navigation/native-stack@7.21.0": patches/@react-navigation%2Fnative-stack@7.21.0.patch
  dbus-next@0.10.2: patches/dbus-next@0.10.2.patch
  node-pty@1.2.0-beta.15: patches/node-pty@1.2.0-beta.15.patch
  react-native-gesture-handler@3.3.0: patches/react-native-gesture-handler@3.3.0.patch
  # Screens v5 stack, split and tab screens leave at once, like legacy screens. Exiting animations
  # inside one otherwise hold its removal for a later mount, after its stack has moved on.
  react-native-reanimated@4.7.1: patches/react-native-reanimated@4.7.1.patch
  react-native-keyboard-controller@1.22.7: patches/react-native-keyboard-controller@1.22.7.patch
  react-native-pdf-jsi@5.0.0: patches/react-native-pdf-jsi@5.0.0.patch
  # Android: a nested WebView hands a vertical drag to its scrolling parent at the page's edge.
  react-native-webview@14.0.1: patches/react-native-webview@14.0.1.patch
  "@expo/ui@58.0.20": patches/@expo__ui@58.0.20.patch
  # Android: a Compose host that requests layout in a mount (a new screen's app bar) is laid out
  # before that frame is drawn, instead of a frame later.
  expo-modules-core@58.0.22: patches/expo-modules-core@58.0.22.patch
  # Android: Maven-resolved gradle plugins (expo-widgets) have no sourceDir; without this
  # skip, the fingerprint silently drops every Expo native module and OTAs reach stale binaries.
  "@expo/fingerprint@0.21.5": patches/@expo__fingerprint@0.21.5.patch
  app-builder-lib@26.16.1: patches/app-builder-lib@26.16.1.patch

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# pnpm 12 links agent skills that dependencies ship into .claude/skills once
# approved. We curate our own skills, so deny these to keep installs quiet.
permissions:
  "@tanstack/router-plugin":
    skills: false
  drizzle-kit:
    skills: false
  expo-sqlite:
    skills: false

# @cursor/sdk finds its platform package (sandbox helper, rg, tree-sitter) by
# walking up from the entry script for node_modules/@cursor/sdk-<platform>-<arch>.
# pnpm keeps optional deps inside the virtual store, so hoist it to the root.
publicHoistPattern:
  - "@cursor/sdk-*"
