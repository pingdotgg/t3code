  "@expo/metro-config@58.0.6": patches/@expo__metro-config@58.0.6.patch
  expo-sharing@58.0.13: patches/expo-sharing@58.0.13.patch
  expo-widgets@58.0.11: patches/expo-widgets@58.0.11.patch
  "@ff-labs/fff-node@0.9.4": patches/@ff-labs__fff-node@0.9.4.patch
  "@legendapp/list@3.3.5": patches/@legendapp__list@3.3.5.patch
  "@opencode/client@2.0.23": patches/@opencode__client@2.0.23.patch
  "@opencode/protocol@2.0.23": patches/@opencode__protocol@2.0.23.patch
  "@opencode/schema@2.0.23": patches/@opencode__schema@2.0.23.patch
  "@pierre/diffs@1.3.0-beta.10": patches/@pierre%2Fdiffs@1.3.0-beta.10.patch
  "@react-native-ai/apple@0.12.0": patches/@react-native-ai__apple@0.12.0.patch
  "@react-native-menu/menu@2.0.0": patches/@react-native-menu__menu@2.0.0.patch
  "@react-navigation/native-stack@7.17.6": patches/@react-navigation%2Fnative-stack@7.17.6.patch
  dbus-next@0.10.2: patches/dbus-next@0.10.2.patch
  effect@4.0.1: patches/effect@4.0.1.patch
  node-pty@1.2.0-beta.15: patches/node-pty@1.2.0-beta.15.patch
  # Link http(s) URLs with a port or a single-label host. md4c otherwise requires a dotted host and stops at ':'.
  react-native-nitro-markdown@0.5.8: patches/react-native-nitro-markdown@0.5.8.patch
  react-native-gesture-handler@3.2.1: patches/react-native-gesture-handler@3.2.1.patch
  react-native-keyboard-controller@1.22.6: patches/react-native-keyboard-controller@1.22.6.patch
  react-native-nitro-modules@0.35.9: patches/react-native-nitro-modules@0.35.9.patch
