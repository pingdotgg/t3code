query T3Hierarchy($id: String!, $first: Int!, $after: String) {
  issue(id: $id) {
    id
    identifier
    url
    team {
      key
    }
    parent {
      id
      identifier
      url
      team {
        key
      }
      title
      state {
        id
        name
        type
        position
      }
    }
    children(first: $first, after: $after) {
      nodes {
        id
        identifier
        url
        team {
          key
        }
        title
        state {
          id
          name
          type
          position
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

