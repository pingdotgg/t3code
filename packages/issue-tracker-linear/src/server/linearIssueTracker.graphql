fragment LinearIssueRow on Issue {
  id
  identifier
  number
  title
  url
  description
  createdAt
  updatedAt
  completedAt
  canceledAt
  team {
    key
  }
  state {
    id
    name
    type
    position
  }
  projectMilestone {
    name
  }
  creator {
    id
    name
    displayName
    email
    avatarUrl
  }
  assignee {
    id
    name
    displayName
    email
    avatarUrl
  }
}

fragment LinearAssignmentTeam on Team {
  id
  key
  name
  private
  visibility
  restrictedBy {
    id
  }
}
