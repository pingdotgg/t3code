fragment IssueRow on Issue {
  number
  title
  url
  state
  stateReason
  createdAt
  updatedAt
  closedAt
  author {
    login
    avatarUrl
    ... on User {
      name
    }
  }
}

query IssueSearch($q: String!, $cursor: String, $rows: Int!) {
  search(query: $q, type: ISSUE, first: $rows, after: $cursor) {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ... on Issue {
        ...IssueRow
        assignees(first: 20) {
          nodes {
            login
            name
            avatarUrl
          }
        }
        labels(first: 20) {
          nodes {
            name
            color
          }
        }
        comments {
          totalCount
        }
      }
    }
  }
}

fragment IssueDetailFields on Issue {
  ...IssueRow
  assignees(first: 100) {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      login
      name
      avatarUrl
    }
  }
  labels(first: 100) {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      name
      color
    }
  }
  body
  viewerCanUpdate
  viewerCanClose
  viewerCanReopen
  ...Reactions
  comments(last: 100) {
    totalCount
    pageInfo {
      hasPreviousPage
      startCursor
    }
    nodes {
      id
      author {
        login
        avatarUrl
      }
      body
      createdAt
      url
      ...Reactions
    }
  }
  closedByPullRequestsReferences(first: 20, includeClosedPrs: true) {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      number
      title
      url
      state
      isDraft
      repository {
        nameWithOwner
      }
    }
  }
  timelineItems(
    last: 100
    itemTypes: [
      CLOSED_EVENT
      REOPENED_EVENT
      LABELED_EVENT
      UNLABELED_EVENT
      ASSIGNED_EVENT
      UNASSIGNED_EVENT
      RENAMED_TITLE_EVENT
      CROSS_REFERENCED_EVENT
    ]
  ) {
    nodes {
      __typename
      ... on ClosedEvent {
        id
        createdAt
        actor {
          login
          avatarUrl
        }
      }
      ... on ReopenedEvent {
        id
        createdAt
        actor {
          login
          avatarUrl
        }
      }
      ... on LabeledEvent {
        id
        createdAt
        actor {
          login
          avatarUrl
        }
        label {
          name
        }
      }
      ... on UnlabeledEvent {
        id
        createdAt
        actor {
          login
          avatarUrl
        }
        label {
          name
        }
      }
      ... on AssignedEvent {
        id
        createdAt
        actor {
          login
          avatarUrl
        }
        assignee {
          ... on User {
            login
            name
          }
          ... on Bot {
            login
          }
        }
      }
      ... on UnassignedEvent {
        id
        createdAt
        actor {
          login
          avatarUrl
        }
        assignee {
          ... on User {
            login
            name
          }
          ... on Bot {
            login
          }
        }
      }
      ... on RenamedTitleEvent {
        id
        createdAt
        actor {
          login
          avatarUrl
        }
        currentTitle
      }
      ... on CrossReferencedEvent {
        id
        createdAt
        actor {
          login
          avatarUrl
        }
        source {
          __typename
          ... on PullRequest {
            number
            title
            url
            state
            isDraft
            repository {
              nameWithOwner
            }
          }
          ... on Issue {
            number
            url
            repository {
              nameWithOwner
            }
          }
        }
      }
    }
  }
}

query IssueDetail($owner: String!, $name: String!, $number: Int!) {
  viewer {
    login
  }
  repository(owner: $owner, name: $name) {
    viewerPermission
    issue(number: $number) {
      ...IssueDetailFields
    }
  }
}

query IssueComments($owner: String!, $name: String!, $number: Int!, $cursor: String!) {
  viewer {
    login
  }
  repository(owner: $owner, name: $name) {
    issue(number: $number) {
      comments(last: 100, before: $cursor) {
        pageInfo {
          hasPreviousPage
          startCursor
        }
        nodes {
          id
          author {
            login
            avatarUrl
          }
          body
          createdAt
          url
          ...Reactions
        }
      }
    }
  }
}

query IssueLinkMetadata($owner: String!, $name: String!, $number: Int!) {
  repository(owner: $owner, name: $name) {
    issue(number: $number) {
      number
      title
      url
    }
  }
}

query IssueNodeId($owner: String!, $name: String!, $number: Int!) {
  repository(owner: $owner, name: $name) {
    issue(number: $number) {
      id
      state
      stateReason
    }
  }
}

query IssueCommentScope($owner: String!, $name: String!, $number: Int!, $commentId: ID!) {
  repository(owner: $owner, name: $name) {
    issue(number: $number) {
      id
    }
  }
  node(id: $commentId) {
    ... on IssueComment {
      issue {
        id
      }
    }
  }
}

query IssueCandidates($owner: String!, $name: String!) {
  repository(owner: $owner, name: $name) {
    labels(first: 100) {
      pageInfo {
        hasNextPage
      }
      nodes {
        name
        color
        description
      }
    }
    assignableUsers(first: 100) {
      pageInfo {
        hasNextPage
      }
      nodes {
        login
        name
        avatarUrl
      }
    }
  }
}

query IssueTemplates($owner: String!, $name: String!) {
  repository(owner: $owner, name: $name) {
    templateDirectory: object(expression: "HEAD:.github/ISSUE_TEMPLATE") {
      ... on Tree {
        entries {
          name
          object {
            ... on Blob {
              text
              isTruncated
            }
          }
        }
      }
    }
    issueTemplates {
      filename
      name
      about
      title
      body
      assignees(first: 25) {
        nodes {
          login
        }
      }
      labels(first: 50) {
        nodes {
          name
        }
      }
    }
  }
}

query IssueViewer {
  viewer {
    login
  }
}

query IssueCollections(
  $owner: String!
  $name: String!
  $number: Int!
  $labelsCursor: String
  $assigneesCursor: String
  $closingPullRequestsCursor: String
  $withLabels: Boolean!
  $withAssignees: Boolean!
  $withClosingPullRequests: Boolean!
) {
  repository(owner: $owner, name: $name) {
    issue(number: $number) {
      labels(first: 100, after: $labelsCursor) @include(if: $withLabels) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          name
          color
        }
      }
      assignees(first: 100, after: $assigneesCursor) @include(if: $withAssignees) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          login
          name
          avatarUrl
        }
      }
      closedByPullRequestsReferences(
        first: 100
        after: $closingPullRequestsCursor
        includeClosedPrs: true
      ) @include(if: $withClosingPullRequests) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          number
          title
          url
          state
          isDraft
          repository {
            nameWithOwner
          }
        }
      }
    }
  }
}

# Issue statuses are a github.com preview. They live in their own documents because a server
# without them rejects any document that names them, whatever `@include` says.
fragment PlanningStatusFields on PlanningStatus {
  id
  name
  category {
    key
    state
    stateReason
  }
}

query IssueSearchWithStatus($q: String!, $cursor: String, $rows: Int!) {
  search(query: $q, type: ISSUE, first: $rows, after: $cursor) {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ... on Issue {
        ...IssueRow
        status {
          ...PlanningStatusFields
        }
        assignees(first: 20) {
          nodes {
            login
            name
            avatarUrl
          }
        }
        labels(first: 20) {
          nodes {
            name
            color
          }
        }
        comments {
          totalCount
        }
      }
    }
  }
}

# One document so an issue read costs a single query against the viewer's GraphQL allowance.
query IssueDetailWithStatus($owner: String!, $name: String!, $number: Int!) {
  viewer {
    login
  }
  repository(owner: $owner, name: $name) {
    viewerPermission
    planningStatuses(first: 50) {
      nodes {
        ...PlanningStatusFields
      }
    }
    issue(number: $number) {
      ...IssueDetailFields
      viewerCanSetStatus
      status {
        ...PlanningStatusFields
      }
    }
  }
}

query IssueStatuses($owner: String!, $name: String!, $number: Int!) {
  repository(owner: $owner, name: $name) {
    planningStatuses(first: 50) {
      nodes {
        ...PlanningStatusFields
      }
    }
    issue(number: $number) {
      viewerCanSetStatus
      status {
        ...PlanningStatusFields
      }
    }
  }
}

mutation SetIssueStatus($issueId: ID!, $statusId: ID!) {
  setIssueStatus(input: { issueId: $issueId, statusId: $statusId }) {
    clientMutationId
  }
}
