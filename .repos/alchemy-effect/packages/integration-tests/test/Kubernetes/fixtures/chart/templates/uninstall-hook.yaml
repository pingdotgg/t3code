apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-uninstall-hook
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: uninstall
          image: busybox
          command: ["sh", "-c", "echo uninstall"]
