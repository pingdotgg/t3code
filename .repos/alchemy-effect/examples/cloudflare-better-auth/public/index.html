<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Better Auth on Cloudflare</title>
    <style>
      body {
        max-width: 44rem;
        margin: 3rem auto;
        padding: 0 1rem;
        font:
          1rem/1.5 system-ui,
          sans-serif;
      }
      label {
        display: block;
        margin-top: 1rem;
      }
      input {
        display: block;
        box-sizing: border-box;
        width: 100%;
        padding: 0.5rem;
      }
      button {
        margin: 1rem 0.5rem 0 0;
        padding: 0.5rem 0.75rem;
        cursor: pointer;
      }
      output {
        display: block;
        margin-top: 1rem;
      }
      pre {
        padding: 1rem;
        background: #f2f4f6;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h1>Better Auth on Cloudflare</h1>
    <p>A same-origin client, an Effect HTTP API, and D1-backed sessions.</p>
    <form id="auth-form">
      <label for="name">Name (sign up only)</label>
      <input id="name" name="name" autocomplete="name" />
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required />
      <label for="password">Password (at least 8 characters)</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        minlength="8"
        required
      />
      <button id="sign-up" type="button">Sign up</button>
      <button id="sign-in" type="button">Sign in</button>
      <button id="sign-out" type="button">Sign out</button>
      <button id="refresh" type="button">Refresh session</button>
    </form>
    <div id="providers"></div>
    <output id="status" role="status" aria-live="polite">Loading…</output>
    <h2>Session</h2>
    <pre id="session">Not loaded</pre>
    <h2>GET /api/me</h2>
    <pre id="me">Not loaded</pre>
    <script type="module" src="/ui.js"></script>
  </body>
</html>
