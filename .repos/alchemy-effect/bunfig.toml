[install]
minimumReleaseAge = 259200
minimumReleaseAgeExcludes = [
  "astro",
  "@astrojs/check",
  "@astrojs/mdx",
  "@astrojs/react",
  "@astrojs/starlight",
  "@opentui/core",
  "@opentui/core-darwin-arm64",
  "@opentui/core-darwin-x64",
  "@opentui/core-linux-x64",
  "@opentui/core-linux-arm64",
  "@opentui/core-linux-x64-musl",
  "@opentui/core-linux-arm64-musl",
  "@opentui/core-win32-x64",
  "@opentui/core-win32-arm64",
  "@distilled.cloud/aws",
  "@distilled.cloud/axiom",
  "@alchemy.run/cloudflare-runtime",
  "@alchemy.run/cloudflare-frameworks",
  "@distilled.cloud/cloudflare",
  "@distilled.cloud/core",
  "@distilled.cloud/neon",
  "@distilled.cloud/planetscale",
  # TODO: remove once we pin a drizzle 1.0.0-rc.5 stable that is >3 days old —
  # excluded because we track fresh rc5-branch builds for Effect 4 RC support.
  "drizzle-kit",
  "drizzle-orm",
  "effect",
  "fast-check",
  "foldkit",
  "@foldkit/vite-plugin",
  "@effect/platform-browser",
  "@effect/atom-react",
  "@effect/language-service",
  "@effect/platform-bun",
  "@effect/platform-node-shared",
  "@effect/platform-node",
  "@effect/sql-d1",
  "@effect/sql-mysql2",
  "@effect/sql-pg",
  "@effect/sql-sqlite-do",
  "@effect/vitest",
  "miniflare",
  "typescript",
  "@typescript/typescript-win32-x64",
  "@typescript/typescript-win32-arm64",
  "@typescript/typescript-linux-x64",
  "@typescript/typescript-linux-arm",
  "@typescript/typescript-linux-arm64",
  "@typescript/typescript-darwin-x64",
  "@typescript/typescript-darwin-arm64",
  "@typescript/typescript-aix-ppc64",
  "@typescript/typescript-freebsd-arm64",
  "@typescript/typescript-freebsd-x64",
  "@typescript/typescript-linux-loong64",
