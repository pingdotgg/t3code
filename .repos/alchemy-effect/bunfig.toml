  "@typescript/typescript-netbsd-x64",
  "@typescript/typescript-openbsd-arm64",
  "@typescript/typescript-openbsd-x64",
  "@typescript/typescript-sunos-x64",
  # AWS SDK (credentials chain only — distilled implements the API calls
  # itself; `@aws-sdk/credential-providers` is our sole direct dependency).
  # AWS publishes the whole SDK monorepo near-daily, so caret ranges in
  # published alchemy tarballs (installed fresh by e.g. the
  # StaticSiteBeta67Migration test, with no lockfile) routinely have range
  # minimums younger than the gate and hard-fail with "blocked by
  # minimum-release-age". Exact names because this bun ignores wildcard
  # patterns in this list (verified empirically); the set is every
  # @aws-sdk/@smithy/@aws-crypto name in bun.lock — extend it if an AWS
  # refactor introduces a new subpackage.
  "@aws-sdk/checksums",
  "@aws-sdk/client-cloudfront",
  "@aws-sdk/client-dynamodb",
  "@aws-sdk/client-lambda",
  "@aws-sdk/client-s3",
  "@aws-sdk/client-sqs",
  "@aws-sdk/core",
  "@aws-sdk/credential-provider-cognito-identity",
  "@aws-sdk/credential-provider-env",
  "@aws-sdk/credential-provider-http",
  "@aws-sdk/credential-provider-ini",
  "@aws-sdk/credential-provider-login",
  "@aws-sdk/credential-provider-node",
  "@aws-sdk/credential-provider-process",
  "@aws-sdk/credential-provider-sso",
  "@aws-sdk/credential-provider-web-identity",
  "@aws-sdk/credential-providers",
  "@aws-sdk/dynamodb-codec",
  "@aws-sdk/endpoint-cache",
  "@aws-sdk/middleware-bucket-endpoint",
  "@aws-sdk/middleware-endpoint-discovery",
  "@aws-sdk/middleware-expect-continue",
  "@aws-sdk/middleware-flexible-checksums",
  "@aws-sdk/middleware-host-header",
  "@aws-sdk/middleware-location-constraint",
  "@aws-sdk/middleware-logger",
  "@aws-sdk/middleware-recursion-detection",
  "@aws-sdk/middleware-sdk-s3",
  "@aws-sdk/middleware-sdk-sqs",
  "@aws-sdk/middleware-ssec",
  "@aws-sdk/middleware-user-agent",
  "@aws-sdk/nested-clients",
  "@aws-sdk/region-config-resolver",
  "@aws-sdk/signature-v4-multi-region",
  "@aws-sdk/token-providers",
  "@aws-sdk/types",
  "@aws-sdk/util-endpoints",
  "@aws-sdk/util-locate-window",
  "@aws-sdk/util-user-agent-browser",
  "@aws-sdk/util-user-agent-node",
  "@aws-sdk/xml-builder",
  "@aws-crypto/crc32",
  "@aws-crypto/sha1-browser",
  "@aws-crypto/sha256-browser",
  "@aws-crypto/sha256-js",
  "@aws-crypto/supports-web-crypto",
  "@aws-crypto/util",
  "@smithy/config-resolver",
  "@smithy/core",
  "@smithy/credential-provider-imds",
  "@smithy/eventstream-serde-browser",
  "@smithy/eventstream-serde-config-resolver",
  "@smithy/eventstream-serde-node",
  "@smithy/fetch-http-handler",
