"@effect/platform/Socket#CloseEventTypeId":
  replacement: "Socket.CloseEvent"
  note: "The close-event marker is internal in v4; use the CloseEvent class or Socket.isCloseEvent."
"@effect/platform/Socket#currentSendQueueCapacity":
  replacement: "Socket.SendQueueCapacity"
  note: "The FiberRef was replaced by a defaulted Context.Reference."
"@effect/platform/Socket#layerWebSocket":
  replacement: "Socket.layerWebSocket"
  note: "The constructor remains in effect/unstable/socket/Socket; its URL may now also be an Effect."
"@effect/platform/Socket#SocketError":
  replacement: "Socket.SocketError"
  note: "The old union became a tagged wrapper around SocketReadError, SocketWriteError, SocketOpenError, or SocketCloseError."
"@effect/platform/Socket#SocketErrorTypeId":
  replacement: "Socket.SocketErrorTypeId"
  note: "The error marker remains in effect/unstable/socket/Socket."
"@effect/platform/Socket#SocketGenericError":
  replacement: "Socket.SocketReadError | Socket.SocketWriteError | Socket.SocketOpenError"
  note: "The generic reason discriminator was replaced by dedicated read, write, and open error classes."
"@effect/platform/Socket#TypeId":
  replacement: "typeof Socket.TypeId"
  note: "The socket marker remains exported, but the separate type alias was removed."
"@effect/platform/Socket#WebSocket":
  replacement: "Socket.WebSocket"
  note: "The opaque service moved to effect/unstable/socket/Socket and is now a Context.Service class for globalThis.WebSocket."
"@effect/platform/Socket#WebSocketConstructor":
  replacement: "Socket.WebSocketConstructor"
  note: "The service moved to effect/unstable/socket/Socket and is now a Context.Service class."
