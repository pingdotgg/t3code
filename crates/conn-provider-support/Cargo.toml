[package]
name = "conn-provider-support"
description = "Shared pieces of the CLI providers: ids, line framing, the child-process supervisor."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "process", "io-util", "time", "rt", "macros"] }
# Signals process groups without forking `/bin/kill`, which slim images may lack. Already in
# the tree through conn-terminal (`pty-process`); safe wrappers, no `unsafe` here.
rustix = { version = "1", default-features = false, features = ["std", "process"] }

[lints]
workspace = true
