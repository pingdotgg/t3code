[package]
name = "conn-source-control"
description = "Source control hosts (GitHub, GitLab, ...): discovery, repositories, pull requests."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
conn-contract.workspace = true
conn-vcs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "sync", "time", "rt", "macros", "net"] }
# HTTPS to a host's API, as the T3 server's drivers call it. hyper and hyper-util are already
# linked through axum; the client side adds about 100 KB (README, "Dependencies").
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
# The one TLS stack: rustls on ring, TLS 1.2 and 1.3, with Mozilla's roots (webpki-roots), the
# same set Node bundles and the T3 server trusts. No C TLS library (deny.toml bans openssl-sys).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "test-util", "net"] }

[lints]
workspace = true
