[package]
name = "conn-web"
description = "Embedded Chromium browser runtime (CEF-on-demand) for conn-gpui, modeled on threadbear-web."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = []
cef = [
    "dep:bzip2",
    "dep:cef",
    "dep:cef-dll-sys",
    "dep:libc",
    "dep:sha1",
    "dep:sha2",
    "dep:tar",
    "dep:ureq",
]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Optional CEF download/verify/unpack dependencies (enabled by feature `cef`).
bzip2 = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
cef = { workspace = true, optional = true }
cef-dll-sys = { workspace = true, optional = true }
libc = { workspace = true, optional = true }

[build-dependencies]
cc.workspace = true

[[example]]
name = "cef_smoke"
required-features = ["cef"]

[lints]
workspace = true
