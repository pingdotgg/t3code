[package]
name = "conn-terminal"
description = "Shells on PTYs for Conn clients: sessions, scrollback, viewers."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
conn-support.workspace = true
conn-contract.workspace = true
# The PTY: the master fd sits on tokio's reactor (no reader thread), the shell is a
# `tokio::process::Child`. Pulls in only rustix, which wraps the libc calls without `unsafe`
# on our side.
pty-process = { version = "0.5", features = ["async"] }
# Signals to the shell's process group and the PTY's foreground group; already under
# pty-process.
rustix = { workspace = true, features = ["process", "termios"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "sync", "time", "rt", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["process", "io-util", "sync", "time", "rt", "macros", "test-util"] }

[lints]
workspace = true
