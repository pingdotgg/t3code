[package]
name = "conn-server"
description = "The Conn server binary: HTTP, WebSocket, pairing, method table."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "conn-server"
path = "src/main.rs"

[dependencies]
conn-wire.workspace = true
conn-contract.workspace = true
conn-engine.workspace = true
conn-provider.workspace = true
conn-provider-claude.workspace = true
conn-mcp = { path = "../conn-mcp" }
# Only for the `rmcp` feature: calls the SDK's tower service.
tower = { version = "0.5", default-features = false, features = ["util"], optional = true }
axum = { workspace = true, features = ["form"] }
# Already in the tree through tungstenite; fills tokens from the OS random source.
getrandom = "0.3"
# Hashes credentials at rest; shares `digest` with tungstenite's sha1.
sha2 = { version = "0.10", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[features]
# /mcp over the official SDK (rmcp) instead of conn-mcp's own transport; README.md compares.
rmcp = ["conn-mcp/rmcp", "dep:tower"]

[dev-dependencies]
# examples/replay_server.rs: the scripted provider instead of Claude.
conn-engine = { workspace = true, features = ["fake-provider"] }
# Paused clock: tests wait for "all tasks idle" instead of real time.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
