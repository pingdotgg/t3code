[package]
name = "conn-files"
description = "Project files, search, signed asset URLs and the attachment store."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
conn-support.workspace = true
conn-contract.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "process", "io-util", "time"] }
# Already in the tree (conn-server): HMAC-SHA256 for signed URLs, random ids and the key.
sha2.workspace = true
getrandom.workspace = true
# ripgrep's directory walker: Git's ignore rules without running git, serial walk only.
ignore = "0.4"
# ripgrep's line searcher and its regex matcher: bounded line buffer, binary detection.
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
# Fuzzy path ranking (helix's matcher).
nucleo-matcher = "0.3"
# Escapes a literal query; already in the tree through grep-regex.
regex-syntax = { version = "0.8", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "process", "io-util", "time"] }

[lints]
workspace = true
