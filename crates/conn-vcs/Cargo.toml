[package]
name = "conn-vcs"
description = "Git through the `git` CLI: status, refs, worktrees, diffs, and the status hub."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
conn-contract.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "sync", "time", "rt", "macros"] }
# Already in the tree through conn-server: diff hashes.
sha2 = { version = "0.10", default-features = false }
# Already in the tree through conn-server and conn-terminal: kills a setup script's process
# group without `unsafe`.
rustix = { version = "1", default-features = false, features = ["std", "process"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }

[lints]
workspace = true
