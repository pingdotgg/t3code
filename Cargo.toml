[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.95"

[workspace.dependencies]
conn-wire = { path = "crates/conn-wire" }
conn-contract = { path = "crates/conn-contract" }
conn-engine = { path = "crates/conn-engine" }
conn-provider = { path = "crates/conn-provider" }
conn-provider-claude = { path = "crates/conn-provider-claude" }
conn-provider-codex = { path = "crates/conn-provider-codex" }
conn-provider-support = { path = "crates/conn-provider-support" }
conn-mcp = { path = "crates/conn-mcp" }
conn-vcs = { path = "crates/conn-vcs" }
conn-files = { path = "crates/conn-files" }
conn-terminal = { path = "crates/conn-terminal" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# One thread, no work-stealing pool: each container serves one or two clients.
tokio = { version = "1", default-features = false, features = [
  "rt",
  "net",
  "io-util",
  "sync",
  "time",
  "macros",
] }
# Third-party crates that more than one crate uses: one version for the workspace.
# HMAC-SHA256 for signed URLs and tokens, diff hashes; shares `digest` with tungstenite's sha1.
sha2 = { version = "0.10", default-features = false }
# Tokens, keys and random ids from the OS random source; already in the tree through tungstenite.
getrandom = "0.3"
# Process groups, signals and terminal calls through safe wrappers; no `unsafe` in our code.
# Each crate adds the features it needs.
rustix = { version = "1", default-features = false, features = ["std"] }
# Bundled SQLite with JSON1 (built in since 3.38). No statement cache, no extra features.
rusqlite = { version = "0.37", default-features = false, features = ["bundled"] }
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "json",
  "tokio",
  "ws",
  "query",
] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
# Smaller than opt-level 3 on every measure (README, "Memory"): binary, RSS and footprint.
opt-level = "z"
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
