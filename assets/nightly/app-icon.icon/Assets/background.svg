    <linearGradient id="sky" x1="64" y1="0" x2="64" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#04071A"/>
      <stop offset="0.5" stop-color="#0A1238"/>
      <stop offset="0.82" stop-color="#16307F"/>
      <stop offset="1" stop-color="#2B5AD0"/>
    </linearGradient>
    <radialGradient id="milkyWay" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(78 40) rotate(-28) scale(70 11)">
      <stop stop-color="#B9C6FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#B9C6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dawn" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(96 110) scale(54 26)">
      <stop stop-color="#FFE2B0" stop-opacity="0.9"/>
      <stop offset="0.18" stop-color="#FF9F5A" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#C45C9A" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#5A3AA8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planet" x1="64" y1="104" x2="64" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F2E66"/>
      <stop offset="1" stop-color="#0A1031"/>
    </linearGradient>
    <radialGradient id="sun" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(96 110) scale(3.2 1.6)">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#FFF1D2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFD08A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="128" height="128" rx="10"/>
    </clipPath>
  </defs>

