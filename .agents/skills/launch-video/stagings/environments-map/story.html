<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--
      Real-app story: each beat is a frozen page of the real app (beats/<name>.html, written by
      snapshot.mjs from a staging scenario), stacked as iframes in .app. The app was frozen at a
      1440×720 viewport; .app scales it 1.0556× into the 1520×760 window, so a point (x, y) in a
      beat is canvas (40 + 1.0556·x, 26 + 1.0556·y).
    -->
    <style>
      @font-face {
        font-family: Inter;
        src: url(inter.woff2) format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: JB;
        src: url(jbmono.woff2) format("woff2");
        font-weight: 100 800;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      :root {
        --text: #f1f3f7;
        --muted: #a3a3a3;
        --dim: #636368;
      }
      html,
      body {
        width: 1600px;
        height: 900px;
        overflow: hidden;
        background: #000;
        font-family: Inter, sans-serif;
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      .canvas {
        position: relative;
        width: 1600px;
        height: 900px;
        overflow: hidden;
        background:
          radial-gradient(1000px 520px at 50% 0%, rgba(52, 107, 241, 0.13), transparent 70%), #000;
      }
      .cam {
        position: absolute;
        inset: 0;
        transform-origin: 0 0;
      }
      .win {
        position: absolute;
        left: 40px;
        top: 26px;
        width: 1520px;
        height: 1235px;
        border-radius: 14px;
        overflow: hidden;
        background: #000;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.1),
          0 40px 120px rgba(0, 0, 0, 0.8);
      }
      .app {
        position: absolute;
        left: 0;
        top: 0;
        width: 1600px;
        height: 1300px;
        transform: scale(0.95);
        transform-origin: 0 0;
      }
      .app iframe {
        position: absolute;
        inset: 0;
        width: 1600px;
        height: 1300px;
        border: 0;
        opacity: 0;
        background: #000;
      }
      .cursor {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 20;
        transform-origin: 4px 3px;
        filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.6));
      }
      .shade {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 190px;
        background: linear-gradient(to bottom, transparent, rgba(0, 0, 0, 0.96) 42%);
        z-index: 30;
      }
      .cap {
        position: absolute;
        left: 0;
        right: 0;
        top: 806px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 16px;
        font-size: 40px;
        font-weight: 700;
        letter-spacing: -0.025em;
        z-index: 31;
        opacity: 0;
      }
      .cap .n {
        width: 50px;
        height: 50px;
        border-radius: 13px;
        display: grid;
        place-items: center;
        font-family: JB;
        font-size: 25px;
        font-weight: 700;
        background: #191a1d;
        color: var(--text);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      }
      .cap .m {
        color: var(--muted);
        font-weight: 560;
      }
      .outro {
        position: absolute;
        inset: 0;
        z-index: 50;
        opacity: 0;
        display: grid;
        place-items: center;
        text-align: center;
        background:
          radial-gradient(760px 460px at 50% 34%, rgba(52, 107, 241, 0.16), transparent 70%), #000;
      }
      .outro .logo {
        width: 176px;
        height: 176px;
        display: block;
        margin: 0 auto -10px;
        filter: drop-shadow(0 0 1px rgba(255, 255, 255, 0.35))
          drop-shadow(0 18px 60px rgba(52, 107, 241, 0.35));
      }
      .outro h2 {
        margin-top: 44px;
        font-size: 76px;
        line-height: 1.02;
        font-weight: 760;
        letter-spacing: -0.045em;
      }
      .outro h2 .and {
        color: var(--muted);
      }
      .outro p {
        margin-top: 22px;
        font-size: 34px;
        color: var(--muted);
        font-weight: 550;
        letter-spacing: -0.02em;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .outro p b {
        color: var(--text);
        font-weight: 650;
      }
      .ver {
        font-family: JB;
        font-size: 22px;
        font-weight: 600;
        color: var(--text);
        padding: 6px 13px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.07);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
      }
      .outro .url {
        margin-top: 46px;
        font-family: JB;
        font-size: 22px;
        color: var(--dim);
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="cam">
        <div class="win">
          <div class="app">
            <iframe data-beat="map" src="beats/map.html"></iframe>
            <iframe data-beat="drag1-mid" src="beats/drag1-mid.html"></iframe>
            <iframe data-beat="drag1-over" src="beats/drag1-over.html"></iframe>
            <iframe data-beat="single-open" src="beats/single-open.html"></iframe>
            <iframe data-beat="single-linked" src="beats/single-linked.html"></iframe>
            <iframe data-beat="select-1" src="beats/select-1.html"></iframe>
            <iframe data-beat="select-2" src="beats/select-2.html"></iframe>
            <iframe data-beat="drag2-mid" src="beats/drag2-mid.html"></iframe>
            <iframe data-beat="drag2-over" src="beats/drag2-over.html"></iframe>
            <iframe data-beat="batch-open" src="beats/batch-open.html"></iframe>
            <iframe data-beat="batch-done" src="beats/batch-done.html"></iframe>
            <iframe data-beat="linked" src="beats/linked.html"></iframe>
          </div>
        </div>
        <div class="cursor" id="cur">
          <svg viewBox="0 0 24 24" width="26" height="26">
            <path
              d="M4 2.5 L4 19.5 L8.6 15.2 L11.6 21.6 L14.6 20.2 L11.7 14 L18 14 Z"
              fill="#fff"
              stroke="#000"
              stroke-width="1.4"
              stroke-linejoin="round"
            />
          </svg>
        </div>
      </div>
      <div class="shade"></div>
      <div class="cap" id="cap1">
        <span class="n">1</span
        ><span>Every machine <span class="m">and how you reach it.</span></span>
      </div>
      <div class="cap" id="cap2">
        <span class="n">2</span><span>Fleets fold <span class="m">into one card.</span></span>
      </div>
      <div class="cap" id="cap3">
        <span class="n">3</span
        ><span>Drag to link <span class="m">a plus onto any machine.</span></span>
      </div>
      <div class="cap" id="cap4">
        <span class="n">4</span
        ><span>Select several <span class="m">and drop on them all.</span></span>
      </div>
    </div>
    <div class="outro">
      <div>
        <img class="logo" src="logo-prod.png" />
        <h2>Environments map<br /><span class="and">all your machines at a glance</span></h2>
        <p>Available now in <b>T3 Code</b> <span class="ver">0.1.12</span></p>
        <div class="url">t3.codes</div>
      </div>
    </div>
    <!-- kit.js last: Kit.ready waits for the beat iframes above. -->
    <script src="kit.js"></script>
    <script>
      const cap = (id, from, to) =>
        Kit.anim(
          id,
          [
            { opacity: 0, transform: "translateY(14px)" },
            { opacity: 1, transform: "none", offset: 0.06 },
            { opacity: 1, transform: "none", offset: 0.94 },
            { opacity: 0, transform: "translateY(-8px)" },
          ],
          { at: from, dur: to - from, ease: "linear" },
        );
      const MAP = '[aria-label="Map of your machines"]';
      const node = (beat, label) => `${beat} >> button[data-fleet-item][aria-label^="${label},"]`;
      const handle = (beat, label) =>
        `${beat} >> button[aria-label="Link ${label} to another machine"]`;
      const DRAG_LINE = `${MAP} path[stroke-dasharray="5 4"]`;
      const DIALOG = "[role=dialog][aria-labelledby]";
      const WIDE = { on: [800, 560], s: 0.78, y: 440 };

      window.setup = () => {
        Kit.beats([
          ["map", 0],
          ["drag1-mid", 13.0],
          ["drag1-over", 13.45],
          ["single-open", 14.05],
          ["single-linked", 15.2],
          ["select-1", 17.25],
          ["select-2", 17.75],
          ["drag2-mid", 18.35],
          ["drag2-over", 18.8],
          ["batch-open", 19.4],
          ["batch-done", 20.6],
          ["linked", 21.65],
        ]);
        Kit.anim(
          ".win",
          [
            { opacity: 0, transform: "translateY(40px) scale(.98)" },
            { opacity: 1, transform: "none" },
          ],
          { at: 0, dur: 0.8 },
        );

        // 1. The map builds itself.
        Kit.stagger(`map >> ${MAP} button[data-fleet-item]`, 0.35, 0.06, "pop", { from: 0.85 });
        Kit.draw(`map >> ${MAP} svg path`, 0.5, 0.7, 0.02);
        Kit.stagger(`map >> ${MAP} > span`, 0.9, 0.025, "pop", { from: 0.7 });
        Kit.glow(`map >> ${MAP} > span:text(LAN)`, 2.6, 1.4);
        // Machines on the T3 Connect account that this app hasn't added: online and offline.
        Kit.stagger(
          `map >> ${MAP} button[data-fleet-item][aria-label*="T3 Connect account"]`,
          5.0,
          0.15,
          "punch",
        );
        Kit.glow(node("map", "old-thinkpad"), 5.6, 1.3);
        cap("#cap1", 0.9, 6.8);

        // 2. The fleet card.
        Kit.glow(node("map", "fs-44 … fs-87"), 7.7, 1.8);
        Kit.punch(node("map", "fs-44 … fs-87"), 7.7, 1.05);
        cap("#cap2", 7.0, 10.1);

        // 3. Drag a plus onto a machine.
        Kit.press(handle("map", "MacBook"), 12.7);
        Kit.reveal(`drag1-mid >> ${DRAG_LINE}`, 13.0, 0.45, "bottom");
        Kit.pop(`drag1-over >> ${MAP} p[role=status]`, 13.5, { from: 0.6, origin: "left center" });
        Kit.pop(`single-open >> ${DIALOG}`, 14.05, { from: 0.92 });
        Kit.press(`single-open >> ${DIALOG} button:text(Link)`, 14.9);
        Kit.draw(
          `single-linked >> ${MAP} path[data-fleet-item]:text(Link from MacBook)`,
          15.25,
          0.7,
        );
        Kit.stagger(`single-linked >> ${MAP} > span:text(Supervised)`, 15.7, 0.1, "pop", {
          from: 0.6,
        });
        Kit.glow(node("single-linked", "gpu-1"), 15.7, 1.3);
        cap("#cap3", 9.0, 16.9);

        // 4. Select several, drop on the selection.
        Kit.press(node("select-1", "gpu-2"), 17.2);
        Kit.press(node("select-2", "gpu-3"), 17.7);
        Kit.press(handle("select-2", "MacBook"), 18.2);
        Kit.reveal(`drag2-mid >> ${DRAG_LINE}`, 18.35, 0.45, "bottom");
        Kit.pop(`drag2-over >> ${MAP} p[role=status]`, 18.85, { from: 0.6, origin: "left center" });
        Kit.pop(`batch-open >> ${DIALOG}`, 19.4, { from: 0.92 });
        Kit.press(`batch-open >> ${DIALOG} [data-slot=dialog-footer] button:text(Link 2)`, 20.35);
        Kit.rise(`batch-done >> ${DIALOG} form > p`, 20.6, { y: 8 });
        Kit.press(`batch-done >> button[data-slot=dialog-close]`, 21.4);
        Kit.draw(`linked >> ${MAP} path[data-fleet-item]:text(Link from MacBook)`, 21.7, 0.7, 0.12);
        Kit.stagger(`linked >> ${MAP} > span:text(Supervised)`, 22.1, 0.1, "pop", { from: 0.6 });
        Kit.glow(node("linked", "MacBook"), 22.4, 1.6);
        cap("#cap4", 17.0, 24.0);

        Kit.anim(".outro", [{ opacity: 0 }, { opacity: 1 }], { at: 24.2, dur: 0.5 });
        Kit.stagger(".outro .logo, .outro h2, .outro p, .outro .url", 24.25, 0.08, "rise", {
          y: 18,
        });
      };

      window.layoutTime = 24.1;
      window.placeCursor = () =>
        Kit.measure(() => {
          const drag = [node("map", "gpu-2"), { dx: -40, s: 1.55, y: 430 }];
          const dialogAt = (beat) => ({ on: `${beat} >> ${DIALOG}`, s: 1.35, y: 430 });
          Kit.camera([
            { t: 0, ...WIDE },
            { t: 1.6, ...WIDE },
            {
              t: 2.2,
              on: node("map", "studio"),
              dx: -150,
              s: 1.8,
              y: 380,
              ease: "cubic-bezier(.3,1.2,.4,1)",
            },
            { t: 4.1, on: node("map", "studio"), dx: -150, s: 1.8, y: 380 },
            { t: 4.8, on: node("map", "office-pc"), dx: -120, s: 1.7, y: 420 },
            { t: 6.6, on: node("map", "office-pc"), dx: -120, s: 1.7, y: 420 },
            { t: 7.3, on: node("map", "fs-44 … fs-87"), dx: -200, s: 1.6, y: 420 },
            { t: 9.8, on: node("map", "fs-44 … fs-87"), dx: -200, s: 1.6, y: 420 },
            { t: 10.5, ...WIDE },
            { t: 11.4, ...WIDE },
            { t: 12.1, on: drag[0], ...drag[1] },
            { t: 13.9, on: drag[0], ...drag[1] },
            { t: 14.3, ...dialogAt("single-open") },
            { t: 15.0, ...dialogAt("single-open") },
            { t: 15.4, on: drag[0], ...drag[1] },
            { t: 19.2, on: drag[0], ...drag[1] },
            { t: 19.6, ...dialogAt("batch-open") },
            { t: 21.5, ...dialogAt("batch-open") },
            { t: 21.9, on: drag[0], ...drag[1] },
            { t: 24.1, on: drag[0], ...drag[1] },
          ]);
          const over = (beat, label) => ({ at: node(beat, label), dx: -30 });
          Kit.cursor("#cur", [
            { t: 11.6, at: [1200, 760], hidden: true },
            { t: 11.8 },
            { t: 12.65, at: handle("map", "MacBook"), click: true },
            { t: 12.95 },
            { t: 13.9, ...over("drag1-over", "gpu-1") },
            { t: 14.0, hidden: true },
            { t: 14.4, at: `single-open >> ${DIALOG} button:text(Link)`, hidden: true },
            { t: 14.6 },
            { t: 14.85, at: `single-open >> ${DIALOG} button:text(Link)`, click: true },
            { t: 15.3, hidden: true },
            { t: 16.7, at: node("select-1", "gpu-2"), hidden: true },
            { t: 16.9 },
            { t: 17.15, at: node("select-1", "gpu-2"), click: true },
            { t: 17.65, at: node("select-2", "gpu-3"), click: true },
            { t: 18.15, at: handle("select-2", "MacBook"), click: true },
            { t: 18.3 },
            { t: 19.25, ...over("drag2-over", "gpu-3") },
            { t: 19.35, hidden: true },
            {
              t: 19.9,
              at: `batch-open >> ${DIALOG} [data-slot=dialog-footer] button:text(Link 2)`,
              hidden: true,
            },
            { t: 20.05 },
            {
              t: 20.3,
              at: `batch-open >> ${DIALOG} [data-slot=dialog-footer] button:text(Link 2)`,
              click: true,
            },
            { t: 21.35, at: "batch-done >> button[data-slot=dialog-close]", click: true },
            { t: 21.7, hidden: true },
            { t: 24, hidden: true },
          ]);
        });
      Kit.timeline([
        [1.6, 0, 1.6],
        [0.8, 1.6, 2.2],
        [2.4, 2.2, 4.1],
        [0.8, 4.1, 4.8],
        [2.4, 4.8, 6.6],
        [0.8, 6.6, 7.3],
        [2.8, 7.3, 9.8],
        [0.8, 9.8, 10.5],
        [0.9, 10.5, 11.4],
        [1.0, 11.4, 12.1],
        [0.8, 12.1, 12.9],
        [1.4, 12.9, 14.0],
        [1.4, 14.0, 15.1],
        [1.8, 15.1, 16.6],
        [1.2, 16.6, 17.8],
        [1.4, 17.8, 19.3],
        [1.4, 19.3, 20.4],
        [1.4, 20.4, 21.6],
        [2.2, 21.6, 24.1],
        [0.7, 24.1, 24.8],
        [2.8, 24.8, 24.8],
      ]);
    </script>
  </body>
</html>
