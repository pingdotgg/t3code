<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="robots" content="noindex" />
    <script>
      // The marketing demo follows the visitor's OS appearance. Apply it
      // before the app loads so the iframe never flashes the opposite theme.
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.classList.toggle("dark", prefersDark);
      document.documentElement.style.backgroundColor = prefersDark ? "#161616" : "#ffffff";
      try {
        window.localStorage.setItem("t3code:theme", "system");
        window.localStorage.setItem("t3code:theme-appearance-mode", "system");
        window.localStorage.removeItem("t3code:theme-halves:v1");
      } catch {}
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #ffffff;
        color: #262626;
        font-family:
          "DM Sans Variable",
          "DM Sans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }

      html.dark body {
        background: #161616;
        color: #f5f5f5;
      }
    </style>
    <title>T3 Code demo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/demo/main.tsx"></script>
  </body>
</html>
