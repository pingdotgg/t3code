<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#161616" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script type="module" src="/src/themeBootstrap.ts"></script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #ffffff;
        color: #262626;
        font-family:
          "DM Sans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }

      html[data-theme="noir"] body {
        background: #161616;
        color: #f5f5f5;
      }

      html[data-theme="dawn"] body {
        background: #f6ebe2;
        color: #42352e;
      }

      html[data-theme="dusk"] body {
        background: #f5e8e3;
        color: #47312d;
      }

      html[data-theme="midnight"] body {
        background: #171b22;
        color: #edf2fb;
      }

      html[data-theme="stone"] body {
        background: #171413;
        color: #ece7e2;
      }

      html[data-theme="blueberry"] body {
        background: #eaf3ff;
        color: #24364b;
      }

      html[data-theme="cosmic"] body {
        background: #121018;
        color: #efeaf7;
      }

      #boot-shell {
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background: inherit;
      }

      #boot-shell-card {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
      }

      #boot-shell-logo {
        width: 64px;
        height: auto;
        color: inherit;
      }

      #boot-shell-logo path {
        stroke: currentColor;
        stroke-width: 5;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: forma-mark-draw 1.05s ease forwards;
      }

      #boot-shell-logo .boot-shell-logo-path-2 {
        animation-delay: 220ms;
      }

      #boot-shell-logo .boot-shell-logo-path-3 {
        animation-delay: 440ms;
      }

      @keyframes forma-mark-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&display=swap"
      rel="stylesheet"
    />
    <title>Forma (Alpha)</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <div id="boot-shell-card" aria-label="Forma splash screen">
          <svg
            id="boot-shell-logo"
            aria-label="Forma"
            fill="none"
            role="img"
            viewBox="0 0 432 489"
            xmlns="http://www.w3.org/2000/svg"
          >
            <title>Forma</title>
            <path
              class="boot-shell-logo-path-1"

              pathLength="1"
            />
            <path
              class="boot-shell-logo-path-2"
              d="M2.50061 172.121C2.50078 166.347 8.75073 162.739 13.7506 165.625L182.065 262.802C184.385 264.142 185.815 266.618 185.815 269.297V463.649C185.815 469.422 179.565 473.032 174.565 470.145V470.144L121.427 439.465C119.107 438.126 117.676 435.65 117.676 432.97V312.055C117.676 307.589 115.294 303.463 111.426 301.23L6.25061 240.505C3.93016 239.166 2.50059 236.69 2.50061 234.01V172.121Z"
              pathLength="1"
            />
            <path
              class="boot-shell-logo-path-3"
              d="M2.50098 288.522C2.50118 282.749 8.75107 279.141 13.751 282.027L81.7178 321.27C84.038 322.609 85.4678 325.085 85.4678 327.765L85.4668 405.715C85.4668 411.488 79.2168 415.097 74.2168 412.21L6.25 372.97C3.92956 371.63 2.5001 369.154 2.5 366.475L2.50098 288.522Z"
              pathLength="1"
            />
          </svg>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
