appId: com.13kparkin.agentboard
productName: Agent Board
extraMetadata:
  name: agent-board
directories:
  output: release
# The renderer and the main process are bundled, so the app ships no node_modules.
files:
  - dist/**/*
  - dist-electron/electron/*.cjs
  - package.json
  - "!node_modules/**/*"
asar: false
artifactName: Agent-Board-${version}-win-x64.${ext}
win:
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64
  signAndEditExecutable: false
nsis:
  artifactName: Agent-Board-Setup-${version}.exe
  createDesktopShortcut: always
  createStartMenuShortcut: true
