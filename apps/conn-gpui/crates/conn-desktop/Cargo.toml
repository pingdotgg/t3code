[package]
name = "conn-desktop"
description = "Native backends for conn-gpui's right-panel surfaces (API, Database, MCP, Orbit Tasks): the Rust equivalents of Conn's Electron main-process IPC methods."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "=0.22.1"
conn-orbit.workspace = true
# Database panel: one async driver stack for MySQL/MariaDB, PostgreSQL and SQLite.
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "mysql", "postgres", "sqlite-bundled", "json", "chrono", "uuid", "bigdecimal"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
futures.workspace = true
# Also trust the macOS system keychain: Orbit's root CA (the Gateway, `*.test` app hosts and
# HTTP MCP servers) lives there, as in Conn, which uses Chromium's network stack.
reqwest = { workspace = true, features = ["rustls-tls-native-roots"] }
serde.workspace = true
# Keep JSON object order: pretty bodies as JSON.stringify writes them, tool input schemas list
# form fields, `.mcp.json` lists servers.
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
url.workspace = true

[target.'cfg(unix)'.dependencies]
# Safe `killpg` for stopping a stdio MCP server's whole process group.
nix = { version = "=0.31.3", default-features = false, features = ["signal"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "rt-multi-thread", "macros"] }

[lints]
workspace = true
