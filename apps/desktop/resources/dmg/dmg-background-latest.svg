      <g fill="#E4EAFF">
        <circle cx="17" cy="18" r="0.55" fill-opacity="0.82"/>
        <circle cx="54" cy="14" r="0.4" fill-opacity="0.65"/>
        <circle cx="116" cy="42" r="0.45" fill-opacity="0.72"/>
        <circle cx="10" cy="70" r="0.35" fill-opacity="0.56"/>
        <circle cx="117" cy="88" r="0.4" fill-opacity="0.6"/>
      </g>
      <path d="M31 22V24.8M29.6 23.4H32.4" stroke="#EEF2FF" stroke-width="0.5" stroke-linecap="round" opacity="0.72"/>
      <path d="M111 58V60M110 59H112" stroke="#CBD8FF" stroke-width="0.45" stroke-linecap="round" opacity="0.58"/>
      <!-- Broad horizon remains below the T3 baseline (y=94). -->
      <path d="M-12 119C14 99 39 99 63 110C87 121 110 116 140 96V140H-12V119Z" fill="#20184E" fill-opacity="0.42"/>
      <path d="M-12 129C15 111 42 112 66 122C91 132 114 124 140 107V140H-12V129Z" fill="#6946B8" fill-opacity="0.22"/>
    </g>
  </svg>
  <circle cx="435" cy="200" r="200" fill="url(#glow)" opacity="1"/>
  <path d="M-60 293C95 220 214 304 362 256S559 191 707 257" stroke="url(#veil)" stroke-width="146" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M-60 306C113 252 223 298 367 272S553 242 707 280" stroke="url(#silk)" stroke-width="86" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M-60 266C113 212 223 258 367 232S553 202 707 240" stroke="#C7F2F1" stroke-width="0.8" fill="none" opacity="0.42" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="32" y="40" fill="#edf0ff" font-family="Helvetica" font-size="17" font-weight="700" text-anchor="start">T3 Code</text>
  <text x="608" y="38" fill="#C3C8E5" font-family="Helvetica" font-size="9" font-weight="400" text-anchor="end">FOR MAC</text>
  <text x="320" y="104" fill="#edf0ff" font-family="Helvetica" font-size="23" font-weight="700" text-anchor="middle">Drag T3 Code into Applications.</text>
  <path d="M270 204Q320 179 370 204M358 190L370 204L351 209" stroke="#ECEDFF" stroke-width="2.2" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="320" y="367" fill="#D0CFE6" font-family="Helvetica" font-size="12" font-weight="400" text-anchor="middle">Once copied, open it from Applications.</text>
