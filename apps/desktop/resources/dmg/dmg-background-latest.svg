<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="864" viewBox="0 0 640 432">
  <defs>
    <radialGradient id="glow">
      <stop stop-color="#6F73BB" stop-opacity=".28"/>
      <stop offset="1" stop-color="#5B6BA2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#817BE0" stop-opacity="0"/>
      <stop offset=".55" stop-color="#6679C3" stop-opacity=".24"/>
      <stop offset="1" stop-color="#C2B8E7" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#AED7D9"/>
      <stop offset=".5" stop-color="#BACAE9"/>
      <stop offset="1" stop-color="#B8A7DE"/>
    </linearGradient>
  </defs>
  <svg width="640" height="400" viewBox="0 0 128 128" preserveAspectRatio="none">
    <defs>
      <linearGradient id="night" x1="12" y1="6" x2="116" y2="124" gradientUnits="userSpaceOnUse">
        <stop stop-color="#07152F"/>
        <stop offset="0.5" stop-color="#151443"/>
        <stop offset="1" stop-color="#32155B"/>
      </linearGradient>
      <radialGradient id="skyGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(90 28) rotate(137) scale(78 70)">
        <stop stop-color="#5165D8" stop-opacity="0.4"/>
        <stop offset="0.5" stop-color="#283075" stop-opacity="0.16"/>
        <stop offset="1" stop-color="#111635" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="horizonGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(42 127) rotate(-70) scale(68 96)">
        <stop stop-color="#6646B6" stop-opacity="0.34"/>
        <stop offset="1" stop-color="#352066" stop-opacity="0"/>
      </radialGradient>
      <clipPath id="frame">
        <rect width="128" height="128"/>
      </clipPath>
    </defs>
    <g clip-path="url(#frame)">
      <rect width="128" height="128" fill="url(#night)"/>
      <rect width="128" height="128" fill="url(#skyGlow)"/>
      <rect width="128" height="128" fill="url(#horizonGlow)"/>
