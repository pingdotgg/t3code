[package]
name = "conn-server"
description = "The Conn server binary: HTTP, WebSocket, pairing, method table."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "conn-server"
path = "src/main.rs"

[dependencies]
# Decodes compressed text generator answers (text_generation/drivers.rs).
flate2.workspace = true
conn-support.workspace = true
conn-preview.workspace = true
conn-wire.workspace = true
conn-contract.workspace = true
conn-engine.workspace = true
conn-provider.workspace = true
# Image attachments of a title through an agent provider (`attachments::saved_path`).
conn-provider-support.workspace = true
conn-provider-claude.workspace = true
conn-provider-codex.workspace = true
conn-provider-acp.workspace = true
conn-mcp.workspace = true
conn-vcs.workspace = true
conn-files.workspace = true
conn-terminal.workspace = true
conn-features.workspace = true
# The scheduled tasks' time zone, as conn-features reads it (workspace dependency).
jiff.workspace = true
conn-source-control.workspace = true
axum = { workspace = true, features = ["form"] }
# Already in the tree through tungstenite; fills tokens from the OS random source.
getrandom.workspace = true
# Hashes credentials at rest; shares `digest` with tungstenite's sha1.
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `signal`: a clean stop on SIGTERM and SIGINT. `fs` streams asset files and uploads
# (tokio's own spawn_blocking file I/O).
# `io-std`: the `acp-mcp-bridge` command relays stdin and stdout (tokio reads stdin on its
# blocking pool).
tokio = { workspace = true, features = ["signal", "fs", "io-std"] }
# The ownership lock shared with the T3 server (`server-owner.sqlite`); already in the tree
# through conn-engine, same version and features.
rusqlite.workspace = true
# Signals a process (`signalProcess`) without forking `/bin/kill`; already in the tree.
# `event`: `poll` waits for the desktop bootstrap line with a deadline.
# `fs`: nonblocking workflow script opens also reject FIFOs without waiting.
rustix = { workspace = true, features = ["process", "event", "fs"] }
# Already in the tree through axum: the Stream trait an asset response body implements.
futures-core = "0.3"
# Parses the Orbit Instance URL the same way the TypeScript server does. Already in the graph.
url = "2"
# Managed access (`src/managed/`): the Gateway's target routes over HTTPS with the lab Orbit CA
# only, and its Reverb notices over a WebSocket. All of these are already in the tree, at these
# versions, through axum and conn-source-control; no new crate is built.
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[dev-dependencies]
conn-support = { workspace = true, features = ["test-util"] }
# examples/replay_server.rs: the scripted provider instead of Claude.
conn-engine = { workspace = true, features = ["fake-provider"] }
# Paused clock: tests wait for "all tasks idle" instead of real time.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
