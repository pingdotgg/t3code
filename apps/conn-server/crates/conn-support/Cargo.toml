[package]
name = "conn-support"
description = "Small helpers several crates share: time, hex, base64, HMAC, atomic file writes."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
test-util = []
tls = ["dep:rustls", "dep:webpki-roots"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
regex-automata.workspace = true
# HMAC-SHA256 needs the hash; already in the tree (workspace dependency).
sha2.workspace = true
uuid.workspace = true
# The random bytes for v4 ids, from the OS random source.
getrandom.workspace = true

rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = { version = "1", optional = true }

[lints]
workspace = true
