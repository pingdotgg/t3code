[package]
name = "conn-mcp"
description = "`/mcp`: T3's MCP tool server over Streamable HTTP, on the engine."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
conn-support.workspace = true
conn-preview.workspace = true
conn-contract.workspace = true
conn-engine.workspace = true
# Reuse the client attachment store, git services and project setup terminals.
conn-files.workspace = true
conn-vcs.workspace = true
conn-terminal.workspace = true
# Scheduled tasks for `schedule_task` and its siblings.
conn-features.workspace = true
# The device service behind `device_list`, `device_open`, `device_screenshot` and `device_close`.
conn-devices.workspace = true
# The host definition registry: pull request keys, URLs and chains for the link tools.
conn-source-control.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
# Already in the tree through axum: request and response types without a framework.
http = "1"
# Already in the tree (conn-server): agent tokens from the OS random source, hashed at rest.
getrandom.workspace = true
sha2.workspace = true
# Already in the binary through source control: the same URL parser as browser inputs.
url = "2"
[dev-dependencies]
conn-support = { workspace = true, features = ["test-util"] }
# The scheduled task tests pick UTC (workspace dependency).
jiff.workspace = true
conn-engine = { workspace = true, features = ["fake-provider"] }
# A handoff on Codex's shared app-server (`src/tests/shared_runtime.rs`); already in the tree.
conn-provider.workspace = true
conn-provider-codex.workspace = true
tokio = { workspace = true, features = ["test-util"] }
# Already in the tree (conn-engine): a test breaks a stored thread row to fail a read.
rusqlite.workspace = true

[lints]
workspace = true
