[package]
name = "conn-vcs"
description = "Git through the `git` CLI: status, refs, worktrees, diffs, and the status hub."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
conn-support.workspace = true
conn-contract.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "sync", "time", "rt", "macros"] }
# Already in the tree through conn-server: diff hashes.
sha2.workspace = true
# Already in the tree through conn-server and conn-terminal: kills a git process group
# without `unsafe` (process.rs).
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
conn-support = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }

[lints]
workspace = true
