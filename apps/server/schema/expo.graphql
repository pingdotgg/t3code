"""Aggregate statistics about account members"""
type AccountMemberStats {
  """
  Whether all human members (Users only, not SSO) have 2FA enabled.
  Also checks the implicit account owner for personal accounts.
  """
  allHave2FAEnabled: Boolean!

  """Count of human members (Users + SSOUsers)"""
  humanCount: Int!

  """Count of members with OWN permission"""
  ownerCount: Int!

  """Count of robot members"""
  robotCount: Int!

  """Count of SSO users only"""
  ssoUserCount: Int!

  """Total count of all members"""
  totalCount: Int!
}

"""Filter for account member types in membersPaginated query"""
enum AccountMemberType {
  """All members (default)"""
  ALL

  """Human members (Users + SSOUsers)"""
  HUMAN

  """Robot members only"""
  ROBOT

  """SSO users only"""
  SSO_USER
}

type AccountMembersConnection {
  edges: [AccountMembersEdge!]!
  pageInfo: PageInfo!
}

type AccountMembersEdge {
  cursor: String!
  node: UserPermission!
}

input AccountMembersFilterInput {
  """Filter by members containing all of the specified permissions."""
  exactPermissions: [Permission!]

  """
  Filter members by 2FA status. Only regular users are returned when set, since SSO users
  and robots don't have 2FA. Requires admin permission on the account.
  """
  isSecondFactorAuthenticationEnabled: Boolean

  """Case-insensitive substring match on username, email, and name"""
  searchTerm: String
}

type AccountMutation {
  """Cancels all subscriptions immediately"""
  cancelAllSubscriptionsImmediately(accountID: ID!): Account!

  """Cancel scheduled subscription change"""
  cancelScheduledSubscriptionChange(accountID: ID!): Account!

  """
  Buys or revokes account's additional concurrencies, charging the account the appropriate amount if needed.
  """
  changeAdditionalConcurrenciesCount(accountID: ID!, newAdditionalConcurrenciesCount: Int!): Account!

  """
  Upgrades or downgrades the active subscription to the newPlanIdentifier, which must be one of the EAS plans (i.e., Production or Enterprise).
  """
  changePlan(accountID: ID!, couponCode: String, newPlanIdentifier: String!): Account!

  """
  Add specified account Permissions for Actor. Actor must already have at least one permission on the account.
  """
  grantActorPermissions(accountID: ID!, actorID: ID!, permissions: [Permission]): Account!

  """
  Remove profile image for the account. Do nothing if there's no profile image associated.
  """
  removeProfileImage(accountID: ID!): Account!

  """
  Rename this account and the primary user's username if this account is a personal account
  """
  rename(accountID: ID!, newName: String!): Account!

  """
  Requests a refund for the specified charge by requesting a manual refund from support
  """
  requestRefund(accountID: ID!, chargeID: ID!, description: String, reason: String): Boolean

  """
  Revoke specified Permissions for Actor. Actor must already have at least one permission on the account.
  """
  revokeActorPermissions(accountID: ID!, actorID: ID!, permissions: [Permission]): Account!

  """
  Set the display name for the account. Pass null to clear it and fall back to the account identifier.
  """
  setDisplayName(accountID: ID!, displayName: String): Account!

  """
  Set whether environment variable protection is on for this account. When it is on, using,
  creating, changing, or deleting a SECRET environment variable needs the PUBLISH_PROTECTED
  permission on the account, in every project of the account. Requires the ADMIN permission on
  the account. Turning protection off also requires a sudo session.
  """
  setEnvironmentVariableProtectionEnabled(accountID: ID!, environmentVariableProtectionEnabled: Boolean!): Account!

  """Set whether EAS Observe ingestion is paused for this account."""
  setObserveIngestionPaused(accountID: ID!, paused: Boolean!): Account!

  """
  Require authorization to send push notifications for experiences owned by this account
  """
  setPushSecurityEnabled(accountID: ID!, pushSecurityEnabled: Boolean!): Account!

  """
  Set whether two-factor authentication is required for this account. When enabled:
    - Existing members with 2FA cannot disable it
    - New members must enable 2FA before joining
    - Existing members without 2FA are not affected
  """
  setRequireTwoFactor(accountID: ID!, requireTwoFactor: Boolean!): Account!

  """Set the user specified account usage for the account."""
  setUserSpecifiedAccountUsage(accountID: ID!, userSpecifiedAccountUsage: UserSpecifiedAccountUsage!): Account!
}

