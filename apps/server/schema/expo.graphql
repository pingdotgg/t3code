schema {
  query: RootQuery
  mutation: RootMutation
}

type AcceptUserInvitationResult {
  success: Boolean!
}

"""A method of authentication for an Actor"""
type AccessToken {
  createdAt: DateTime!
  id: ID!
  lastUsedAt: DateTime
  note: String
  owner: Actor!
  revokedAt: DateTime

  """
  Scopes this token is restricted to. Null for a full token that authenticates as the owner
  with all of their permissions.
  """
  scopes: [AccessTokenScope!]
  updatedAt: DateTime!
  visibleTokenPrefix: String!
}

type AccessTokenMutation {
  """Create an AccessToken for an Actor"""
  createAccessToken(createAccessTokenData: CreateAccessTokenInput!): CreateAccessTokenResponse!

  """Delete an AccessToken"""
  deleteAccessToken(id: ID!): DeleteAccessTokenResult!

  """Revoke an AccessToken"""
  setAccessTokenRevoked(id: ID!, revoked: Boolean): AccessToken!
}

"""One scope narrowing an AccessToken below its owner's full access"""
type AccessTokenScope {
  """The account this scope applies to. Only present for ACCOUNT scopes."""
  accountID: ID
  permissions: [Permission!]!
  type: AccessTokenScopeType!
}

input AccessTokenScopeInput {
  """
  The account this scope applies to. Required for ACCOUNT scopes and must be omitted for
  ALL_ACCOUNTS scopes.
  """
  accountID: ID
  permissions: [Permission!]!
  type: AccessTokenScopeType!
}

enum AccessTokenScopeType {
  """One account, named by accountID, narrowed to the scope's permissions."""
  ACCOUNT

  """
  Every account the token's owner has permissions on at request time, narrowed to the
  scope's permissions.
  """
  ALL_ACCOUNTS
}

