<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <title>Auldric Marketing narrow shell proposal</title>
  <desc>Single-column operational Marketing workspace with explicit Dev exit, scrollable domain navigation, evidence state, and next work.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .muted { fill: #687386; }
    .tiny { font-size: 10px; letter-spacing: .07em; }
    .small { font-size: 12px; }
    .body { font-size: 13px; }
    .label { font-size: 14px; font-weight: 650; }
    .title { font-size: 21px; font-weight: 700; }
    .white { fill: #fff; }
  </style>
  <rect width="390" height="844" rx="26" fill="#f7f8fa"/>
  <rect x="0.5" y="0.5" width="389" height="843" rx="25.5" fill="none" stroke="#cfd5df"/>
  <rect x="0" y="0" width="390" height="54" rx="26" fill="#fff"/>
  <path d="M0 54H390" stroke="#dfe3ea"/>
  <rect x="14" y="13" width="28" height="28" rx="7" fill="#22344d"/>
  <text x="23" y="33" style="font-size:18px" class="white">/</text>
  <text x="52" y="33" class="label">Marketing</text>
  <rect x="304" y="12" width="72" height="30" rx="8" fill="#fff" stroke="#d9dee7"/>
  <text x="326" y="31" class="small">Dev</text>

  <g transform="translate(14 70)">
    <rect x="0" y="0" width="76" height="30" rx="15" fill="#22344d"/>
    <text x="16" y="19" class="small white">Overview</text>
    <rect x="84" y="0" width="67" height="30" rx="15" fill="#fff" stroke="#d9dee7"/>
    <text x="99" y="19" class="small">Sources</text>
    <rect x="159" y="0" width="77" height="30" rx="15" fill="#fff" stroke="#d9dee7"/>
    <text x="173" y="19" class="small">Workflows</text>
    <rect x="244" y="0" width="64" height="30" rx="15" fill="#fff" stroke="#d9dee7"/>
    <text x="259" y="19" class="small">Library</text>
  </g>

  <g transform="translate(14 120)">
    <text x="0" y="12" class="tiny muted">PROPOSAL · NOT PRODUCT PROOF</text>
    <text x="0" y="46" class="title">Marketing overview</text>
    <text x="0" y="68" class="body muted">Decisions, evidence, and next work.</text>

    <rect x="0" y="88" width="362" height="146" rx="14" fill="#fff" stroke="#d9dee7"/>
    <text x="16" y="114" class="tiny muted">NEXT USEFUL WORK</text>
    <text x="16" y="144" class="label">Complete the Day 0 evidence pass</text>
    <text x="16" y="166" class="small muted">2 source gaps still change the route.</text>
    <rect x="16" y="184" width="330" height="7" rx="3.5" fill="#edf0f4"/>
    <rect x="16" y="184" width="218" height="7" rx="3.5" fill="#34526f"/>
    <rect x="16" y="202" width="330" height="24" rx="7" fill="#22344d"/>
    <text x="126" y="219" class="small" style="fill:#fff">Continue Day 0</text>

    <rect x="0" y="246" width="362" height="92" rx="12" fill="#fff" stroke="#d9dee7"/>
    <text x="16" y="272" class="tiny muted">WORKSPACE STATE</text>
    <text x="16" y="305" style="font-size:27px;font-weight:700">68%</text>
    <text x="76" y="304" class="small muted">ready</text>
    <circle cx="168" cy="298" r="4" fill="#4d816d"/><text x="180" y="302" class="small">7 ready</text>
    <circle cx="252" cy="298" r="4" fill="#e8b84f"/><text x="264" y="302" class="small">2 open</text>

    <text x="0" y="373" class="label">Attention</text>
    <rect x="0" y="388" width="362" height="72" rx="11" fill="#fff" stroke="#d9dee7"/>
    <rect x="14" y="405" width="26" height="26" rx="7" fill="#fff7e3"/>
    <text x="52" y="412" class="label">Confirm primary audience</text>
    <text x="52" y="434" class="small muted">Decision · 2 sources disagree</text>
    <path d="m335 419 5 5 8-10" fill="none" stroke="#687386" stroke-width="1.5"/>
    <rect x="0" y="470" width="362" height="72" rx="11" fill="#fff" stroke="#d9dee7"/>
    <rect x="14" y="487" width="26" height="26" rx="7" fill="#fcecef"/>
    <text x="52" y="494" class="label">Reconnect analytics</text>
    <text x="52" y="516" class="small muted">Access · freshness unknown</text>
    <path d="m335 501 5 5 8-10" fill="none" stroke="#687386" stroke-width="1.5"/>

    <text x="0" y="577" class="label">Canonical outputs</text>
    <rect x="0" y="592" width="362" height="82" rx="11" fill="#fff" stroke="#d9dee7"/>
    <text x="16" y="621" class="label">Day 0 operating packet</text>
    <text x="16" y="644" class="small muted">Draft · revision 3 · 6 sources</text>
    <rect x="0" y="684" width="362" height="82" rx="11" fill="#fff" stroke="#d9dee7"/>
    <text x="16" y="713" class="label">Route decision</text>
    <text x="16" y="736" class="small muted">Pending approval · Marketing Strategy</text>
  </g>

  <rect x="0" y="788" width="390" height="56" rx="26" fill="#fff"/>
  <path d="M0 788H390" stroke="#dfe3ea"/>
  <text x="29" y="821" class="small">Overview</text>
  <text x="125" y="821" class="small muted">Sources</text>
  <text x="214" y="821" class="small muted">Workflows</text>
  <text x="316" y="821" class="small muted">Library</text>
</svg>
