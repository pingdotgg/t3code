  <rect x="12" y="106" width="208" height="38" rx="8" fill="#e9edf3"/>
  <rect x="20" y="117" width="16" height="16" rx="4" fill="#22344d"/>
  <text x="48" y="131" class="label">Overview</text>
  <text x="20" y="177" class="tiny muted">SOURCES</text>
  <text x="48" y="210" class="body">Intake</text>
