<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <title>Auldric Marketing desktop shell proposal</title>
  <desc>Dense operational workspace with explicit Marketing and Dev switch, bounded navigation, evidence readiness, decisions, and reviews.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .muted { fill: #687386; }
    .tiny { font-size: 11px; letter-spacing: .08em; }
    .small { font-size: 13px; }
    .body { font-size: 14px; }
    .label { font-size: 14px; font-weight: 600; }
    .title { font-size: 24px; font-weight: 680; }
    .section { font-size: 16px; font-weight: 650; }
    .white { fill: #fff; }
  </style>
  <rect width="1440" height="900" fill="#f7f8fa"/>
  <rect x="0.5" y="0.5" width="1439" height="899" rx="14" fill="none" stroke="#d9dee7"/>

  <rect x="0" y="0" width="1440" height="56" rx="14" fill="#fff"/>
  <path d="M0 56H1440" stroke="#dfe3ea"/>
  <rect x="18" y="14" width="28" height="28" rx="7" fill="#22344d"/>
  <path d="M28 20v16l8-8v-8zM27 20l-8 8v8h8" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
