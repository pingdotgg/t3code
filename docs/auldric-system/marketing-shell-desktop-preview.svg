    <rect x="20" y="470" width="258" height="34" rx="8" fill="#22344d"/>
    <text x="99" y="492" class="small" style="fill:#fff">Open review queue</text>
    <path d="M20 534H278" stroke="#e5e8ed"/>
    <text x="20" y="568" class="tiny muted">CURRENT VIEW</text>
    <text x="20" y="598" class="label">Organization-owned records</text>
    <text x="20" y="621" class="small muted">Every detail opens its canonical source,</text>
    <text x="20" y="641" class="small muted">artifact, revision, or decision.</text>
