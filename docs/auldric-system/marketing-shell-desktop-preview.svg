    <text x="572" y="179" style="font-size:32px;font-weight:700">68%</text>
    <text x="646" y="178" class="small muted">ready</text>
    <circle cx="580" cy="217" r="5" fill="#4d816d"/><text x="594" y="222" class="small">Sources 7 ready</text>
    <circle cx="580" cy="244" r="5" fill="#e8b84f"/><text x="594" y="249" class="small">Decisions 2 open</text>
    <circle cx="580" cy="271" r="5" fill="#bd6371"/><text x="594" y="276" class="small">Access 1 blocked</text>

    <text x="0" y="335" class="section">Attention</text>
    <rect x="0" y="352" width="822" height="62" rx="10" fill="#fff" stroke="#d9dee7"/>
    <rect x="16" y="369" width="28" height="28" rx="7" fill="#fff7e3"/>
