    <rect x="698" y="512" width="104" height="28" rx="7" fill="#22344d"/>
    <text x="718" y="530" class="small" style="fill:#fff">Review</text>

    <text x="0" y="610" class="section">Canonical outputs</text>
    <rect x="0" y="628" width="260" height="116" rx="12" fill="#fff" stroke="#d9dee7"/>
    <text x="16" y="655" class="label">Day 0 operating packet</text>
    <text x="16" y="680" class="small muted">Draft · revision 3</text>
    <text x="16" y="718" class="small">6 sources · 2 assumptions</text>
    <rect x="276" y="628" width="260" height="116" rx="12" fill="#fff" stroke="#d9dee7"/>
    <text x="292" y="655" class="label">Audience evidence map</text>
    <text x="292" y="680" class="small muted">Needs decision</text>
    <text x="292" y="718" class="small">7 sources · 1 conflict</text>
    <rect x="552" y="628" width="270" height="116" rx="12" fill="#fff" stroke="#d9dee7"/>
    <text x="568" y="655" class="label">Route decision</text>
    <text x="568" y="680" class="small muted">Pending approval</text>
    <text x="568" y="718" class="small">Marketing Strategy</text>
