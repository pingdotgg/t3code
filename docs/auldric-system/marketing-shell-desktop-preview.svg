  <text x="20" y="292" class="tiny muted">WORKFLOWS</text>
  <text x="48" y="325" class="body">Day 0</text>
  <text x="48" y="363" class="body">Marketing Strategy</text>
  <text x="48" y="401" class="body">GTM</text>
  <text x="20" y="445" class="tiny muted">OUTPUTS</text>
  <text x="48" y="478" class="body">Artifacts</text>
