  <text x="637" y="33" class="small">Marketing</text>
  <text x="764" y="33" class="small muted">Dev</text>
  <circle cx="1370" cy="28" r="15" fill="#e7eaf0"/>
  <text x="1361" y="33" class="small">NR</text>

  <rect x="0" y="56" width="232" height="844" fill="#fbfbfc"/>
  <path d="M232 56V900" stroke="#dfe3ea"/>
