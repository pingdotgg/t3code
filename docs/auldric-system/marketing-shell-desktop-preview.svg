  <g transform="translate(1118 84)">
    <rect x="0" y="0" width="298" height="792" rx="14" fill="#fff" stroke="#d9dee7"/>
    <text x="20" y="34" class="section">Evidence and review</text>
    <path d="M20 50H278" stroke="#e5e8ed"/>
    <text x="20" y="82" class="tiny muted">SOURCE COVERAGE</text>
    <text x="20" y="112" class="label">7 ready · 2 partial · 1 blocked</text>
    <rect x="20" y="130" width="258" height="8" rx="4" fill="#edf0f4"/>
    <rect x="20" y="130" width="181" height="8" rx="4" fill="#4d816d"/>
    <text x="20" y="178" class="tiny muted">OPEN DECISIONS</text>
    <rect x="20" y="194" width="258" height="72" rx="9" fill="#f8f9fb"/>
    <text x="32" y="219" class="label">Primary audience</text>
    <text x="32" y="242" class="small muted">Evidence conflict · due today</text>
    <rect x="20" y="276" width="258" height="72" rx="9" fill="#f8f9fb"/>
