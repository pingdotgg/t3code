[package]
name = "t3-resource-monitor"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sysinfo = "0.39.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "CFBase",
  "CFData",
  "CFDictionary",
  "CFNumber",
  "CFString",
] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["std", "libc"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_System_Performance",
] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
