[package]
name = "t3-phone-passkeys"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[dependencies]
libwebauthn = "=0.11.0"
psl = "2"
# Unify libwebauthn's D-Bus dependency without requiring libdbus development headers.
dbus = { version = "0.9", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
