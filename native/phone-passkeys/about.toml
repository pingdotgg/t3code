# Apache-2.0 first: several dual-licensed crates publish no MIT text with a copyright line.
accepted = [
  "Apache-2.0",
  "MIT",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
  "LGPL-2.1-or-later",
]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
ignore-dev-dependencies = true
workarounds = ["ring"]

[private]
ignore = true

