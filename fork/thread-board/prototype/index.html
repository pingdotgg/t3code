<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Thread Board prototype</title>
<!--
  Thread Board, phase 1 UX prototype. Fake data, no build step, no app code.
  Open this file in a browser. Tokens mirror apps/web/src/index.css.
-->
<style>
:root {
  color-scheme: light;
  --font-sans: -apple-system, BlinkMacSystemFont, "Inter Variable", "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  /* Set from JS to the window height; fixed when embedded in a preview frame. */
  --app-h: 860px;

  --zinc-25: oklch(99.2% 0 0);
  --zinc-50: oklch(98.5% 0 0);
  --zinc-100: oklch(96.7% 0.001 286.375);
  --zinc-200: oklch(92% 0.004 286.32);
  --zinc-300: oklch(87.1% 0.006 286.286);
  --zinc-500: oklch(55.2% 0.016 285.938);
  --zinc-900: oklch(21% 0.006 285.885);

  --background: var(--zinc-25);
  --foreground: var(--zinc-900);
  --card: #fff;
  --popover: #fff;
  --primary: oklch(0.488 0.217 264);
  --primary-foreground: #fff;
  --muted: var(--zinc-50);
  --muted-foreground: var(--zinc-500);
  --accent: var(--zinc-100);
  --border: var(--zinc-200);
  --input: var(--zinc-300);
  --ring: var(--primary);
  --message-surface: color-mix(in srgb, var(--zinc-200) 55%, var(--zinc-100));
  --code-background: color-mix(in srgb, var(--card) 90%, var(--background));
  --info: oklch(62.3% 0.214 259.815);
  --info-foreground: oklch(48.8% 0.243 264.376);
  --success: oklch(69.6% 0.17 162.48);
  --success-foreground: oklch(50.8% 0.118 165.612);
  --warning: oklch(76.9% 0.188 70.08);
  --warning-foreground: oklch(55.5% 0.163 48.998);
  --error: oklch(63.7% 0.237 25.331);
  --error-foreground: oklch(50.5% 0.213 27.518);
  --input-tone: oklch(51.1% 0.262 276.966);
  --input-foreground: oklch(51.1% 0.262 276.966);
  --merged: oklch(54.1% 0.281 293.009);
  --merged-foreground: oklch(54.1% 0.281 293.009);
  --sidebar: var(--zinc-50);
  --sidebar-foreground: var(--foreground);
  --sidebar-row-hover: var(--zinc-100);
  --sidebar-row-active: #fff;
  --sidebar-border: var(--border);
  --sidebar-icon-color: color-mix(in srgb, var(--muted-foreground) 85%, var(--sidebar));
  --lane-bg: var(--zinc-50);
  --backdrop: rgb(0 0 0 / 28%);
  --shadow-card: 0 1px 2px rgb(0 0 0 / 5%);
  --shadow-float: 0 18px 48px rgb(0 0 0 / 16%), 0 2px 6px rgb(0 0 0 / 6%);
  --seg-on: #fff;
}

/* Dark tokens, twice: once for the OS preference, once for the explicit toggle. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --background: #000;
    --foreground: oklch(97% 0 0);
    --card: color-mix(in srgb, oklch(14.5% 0 0) 97%, #fff);
    --popover: color-mix(in srgb, oklch(14.5% 0 0) 97%, #fff);
    --primary: oklch(0.571 0.21 264);
    --muted: rgb(255 255 255 / 3%);
    --muted-foreground: oklch(70.8% 0 0);
    --accent: rgb(255 255 255 / 5%);
    --border: rgb(255 255 255 / 8%);
    --input: rgb(255 255 255 / 11%);
    --message-surface: color-mix(in srgb, oklch(14.5% 0 0) 92%, #fff);
    --info-foreground: oklch(70.7% 0.165 254.624);
    --success-foreground: oklch(76.5% 0.177 163.223);
    --warning-foreground: oklch(82.8% 0.189 84.429);
    --error: color-mix(in srgb, oklch(63.7% 0.237 25.331) 90%, #fff);
    --error-foreground: oklch(70.4% 0.191 22.216);
    --input-tone: oklch(67.3% 0.182 276.935);
    --input-foreground: oklch(78.5% 0.115 274.713);
    --merged: oklch(70.2% 0.183 293.541);
    --merged-foreground: oklch(70.2% 0.183 293.541);
    --sidebar: var(--card);
    --sidebar-row-hover: rgb(255 255 255 / 5%);
    --sidebar-row-active: rgb(255 255 255 / 8%);
    --lane-bg: rgb(255 255 255 / 2.5%);
    --backdrop: rgb(0 0 0 / 60%);
    --shadow-card: none;
    --shadow-float: 0 18px 48px rgb(0 0 0 / 60%);
    --seg-on: rgb(255 255 255 / 12%);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --background: #000;
  --foreground: oklch(97% 0 0);
  --card: color-mix(in srgb, oklch(14.5% 0 0) 97%, #fff);
  --popover: color-mix(in srgb, oklch(14.5% 0 0) 97%, #fff);
  --primary: oklch(0.571 0.21 264);
  --muted: rgb(255 255 255 / 3%);
  --muted-foreground: oklch(70.8% 0 0);
  --accent: rgb(255 255 255 / 5%);
  --border: rgb(255 255 255 / 8%);
  --input: rgb(255 255 255 / 11%);
  --message-surface: color-mix(in srgb, oklch(14.5% 0 0) 92%, #fff);
  --info-foreground: oklch(70.7% 0.165 254.624);
  --success-foreground: oklch(76.5% 0.177 163.223);
  --warning-foreground: oklch(82.8% 0.189 84.429);
  --error: color-mix(in srgb, oklch(63.7% 0.237 25.331) 90%, #fff);
  --error-foreground: oklch(70.4% 0.191 22.216);
  --input-tone: oklch(67.3% 0.182 276.935);
  --input-foreground: oklch(78.5% 0.115 274.713);
  --merged: oklch(70.2% 0.183 293.541);
  --merged-foreground: oklch(70.2% 0.183 293.541);
  --sidebar: var(--card);
  --sidebar-row-hover: rgb(255 255 255 / 5%);
  --sidebar-row-active: rgb(255 255 255 / 8%);
  --lane-bg: rgb(255 255 255 / 2.5%);
  --backdrop: rgb(0 0 0 / 60%);
  --shadow-card: none;
  --shadow-float: 0 18px 48px rgb(0 0 0 / 60%);
  --seg-on: rgb(255 255 255 / 12%);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--background);
  color: var(--foreground);
  font-family: var(--font-sans);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; }
code { font-family: var(--font-mono); font-size: 0.86em; background: var(--accent); border-radius: 4px; padding: 0.05em 0.3em; }
.i { width: 16px; height: 16px; flex: none; }
.i-sm { width: 13px; height: 13px; }
.i-xs { width: 12px; height: 12px; }
.spacer { flex: 1; }
.mono { font-family: var(--font-mono); }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

.tone-info { color: var(--info-foreground); --tone: var(--info); }
.tone-warning { color: var(--warning-foreground); --tone: var(--warning); }
.tone-error { color: var(--error-foreground); --tone: var(--error); }
.tone-success { color: var(--success-foreground); --tone: var(--success); }
.tone-input { color: var(--input-foreground); --tone: var(--input-tone); }
.tone-muted { color: var(--muted-foreground); --tone: var(--muted-foreground); }
.tone-merged { color: var(--merged-foreground); --tone: var(--merged); }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 30px; padding: 0 10px; border-radius: 8px;
  border: 1px solid var(--input); background: var(--popover); color: var(--foreground);
  font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;
  box-shadow: var(--shadow-card);
}
.btn:hover { background: color-mix(in srgb, var(--accent) 100%, var(--popover)); }
.btn:focus-visible, .seg button:focus-visible, .sb-row:focus-visible, .sb-util:focus-visible, .chip-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
.btn-primary:hover { background: color-mix(in srgb, var(--primary) 88%, var(--background)); }
.btn-ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--muted-foreground); }
.btn-ghost:hover { background: var(--accent); color: var(--foreground); }
.btn-sm { height: 26px; padding: 0 8px; font-size: 12px; border-radius: 7px; }
.btn-icon { width: 30px; padding: 0; }
.btn-icon.btn-sm { width: 26px; }
.btn-danger { color: var(--error-foreground); }
.kbd {
  font-family: var(--font-mono); font-size: 10.5px; line-height: 16px;
  border: 1px solid var(--border); border-radius: 4px; padding: 0 4px;
  color: var(--muted-foreground); background: var(--muted);
}
.seg { display: flex; background: var(--accent); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button {
  flex: 1; height: 24px; border: 0; background: transparent; border-radius: 6px;
  font-size: 11.5px; color: var(--muted-foreground); cursor: pointer; white-space: nowrap; padding: 0 6px;
}
.seg button.on { background: var(--seg-on); color: var(--foreground); box-shadow: 0 1px 2px rgb(0 0 0 / 10%); }
.chip {
  display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px;
  border-radius: 6px; border: 1px solid var(--border); background: var(--muted);
  font-size: 11px; color: var(--muted-foreground); white-space: nowrap;
}
.chip .add { color: var(--success-foreground); }
.chip .del { color: var(--error-foreground); }
.fav {
  display: inline-grid; place-items: center; width: 16px; height: 16px; flex: none;
  border-radius: 4px; background: var(--fav); color: #fff; font-size: 9.5px; font-weight: 700;
}

/* ---------- app shell ---------- */
/* The stage is the containing block for every fixed layer. Embedded in a narrow
   preview frame it lays out at 1280x800 and scales down (see fitStage). */
#frame { overflow: hidden; }
#stage { position: relative; width: 100%; height: var(--app-h); overflow: hidden; transform: scale(var(--s, 1)); transform-origin: 0 0; }
html.embed #stage { width: 1280px; }
.app { display: flex; height: 100%; min-height: 0; }
.sidebar {
  width: 264px; flex: none; background: var(--sidebar); border-right: 1px solid var(--sidebar-border);
  display: flex; flex-direction: column; min-height: 0;
}
.sb-header { height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 16px; flex: none; }
.sb-brand { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
.sb-brand small { font-weight: 500; color: var(--muted-foreground); font-size: 11px; margin-left: 4px; }
.sb-scroll { flex: 1; overflow-y: auto; padding: 2px 8px 8px; min-height: 0; }
.sb-folder-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 4px; font-size: 12px; font-weight: 500; color: var(--muted-foreground); }
.sb-row {
  display: flex; align-items: center; gap: 8px; width: 100%; height: 30px; padding: 0 10px;
  border-radius: 8px; border: 0; background: transparent; color: var(--sidebar-foreground);
  font-size: 13px; cursor: pointer; text-align: left;
}
.sb-row:hover { background: var(--sidebar-row-hover); }
.sb-row.active { background: var(--sidebar-row-active); box-shadow: 0 0 0 1px var(--border); }
.sb-row .sb-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-row.recede .sb-title { color: var(--muted-foreground); }
.sb-status { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; flex: none; }
.sb-time { font-size: 11px; color: var(--muted-foreground); flex: none; }
.sb-board-row {
  margin: 0 8px 4px; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px;
  border-radius: 8px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font-size: 13px; font-weight: 500;
}
.sb-board-row:hover { background: var(--sidebar-row-hover); }
.sb-board-row.on { border-color: var(--primary); }
.sb-footer { display: flex; align-items: center; gap: 2px; padding: 6px 8px 10px; flex: none; }
.sb-util {
  position: relative; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center;
  color: var(--sidebar-icon-color); background: transparent; border: 0; cursor: pointer;
}
.sb-util:hover { background: var(--sidebar-row-hover); color: var(--foreground); }
.sb-util.on { background: var(--sidebar-row-active); color: var(--foreground); box-shadow: 0 0 0 1px var(--border); }
.sb-util.is-new::after {
  content: ""; position: absolute; inset: -1px; border-radius: 9px; border: 1px dashed color-mix(in srgb, var(--primary) 55%, transparent); pointer-events: none;
}
.badge-count {
  position: absolute; top: 1px; right: 0; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 8px;
  background: var(--warning); color: oklch(27% 0.07 50); font-size: 9.5px; font-weight: 700;
  display: grid; place-items: center; border: 2px solid var(--sidebar); box-sizing: content-box;
}

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--background); min-height: 0; }

/* ---------- thread view (stub) ---------- */
.thread-view { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.topbar {
  height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 16px;
  border-bottom: 1px solid var(--border); font-size: 13px; min-width: 0;
}
.topbar .crumb { color: var(--muted-foreground); display: inline-flex; align-items: center; gap: 6px; }
.topbar .title { font-weight: 600; }
.stub-tag { font-size: 10.5px; color: var(--muted-foreground); border: 1px dashed var(--border); border-radius: 6px; padding: 1px 6px; }
.thread-scroll { flex: 1; overflow-y: auto; min-height: 0; }
.thread-col { max-width: 46rem; margin: 0 auto; padding: 0 20px; }
.msgs { display: flex; flex-direction: column; gap: 14px; padding: 24px 0 32px; }
.msg-user { align-self: flex-end; background: var(--message-surface); border-radius: 16px; padding: 9px 14px; max-width: 80%; line-height: 1.5; }
.msg-assistant { line-height: 1.6; }
.tool-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted-foreground); }
.thread-bottom { flex: none; padding-bottom: 16px; }
.thread-bottom .pending-box { margin-bottom: 8px; }

/* ---------- board page ---------- */
.board { display: flex; flex-direction: column; height: 100%; min-height: 0; background: var(--background); }
.board-header {
  height: 52px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 16px;
  border-bottom: 1px solid var(--border); min-width: 0;
}
.board-title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; flex: none; }
.filters { display: flex; gap: 4px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.chip-btn {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 9px; border-radius: 8px;
  border: 1px solid transparent; background: transparent; cursor: pointer; font-size: 12.5px; color: var(--muted-foreground); white-space: nowrap;
}
.chip-btn:hover { background: var(--accent); color: var(--foreground); }
.chip-btn.on { background: var(--card); border-color: var(--border); color: var(--foreground); box-shadow: var(--shadow-card); }
.chip-btn .n { font-size: 11px; color: var(--muted-foreground); }
.search {
  display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; width: 200px; flex: none;
  border: 1px solid var(--input); border-radius: 8px; background: var(--card); color: var(--muted-foreground);
}
.search input { border: 0; outline: 0; background: transparent; color: var(--foreground); font: inherit; font-size: 13px; width: 100%; }
.search:focus-within { border-color: var(--ring); }
.board-body { position: relative; flex: 1; display: flex; min-height: 0; }
.swim-scroll { flex: 1; min-width: 0; overflow: auto; padding: 0 16px 24px; }
.swim { --cols: 3; min-width: calc(var(--cols) * 240px + (var(--cols) - 1) * 10px); }
.swim-grid { display: grid; grid-template-columns: repeat(var(--cols), minmax(240px, 1fr)); gap: 10px; }
.swim-cols { position: sticky; top: 0; z-index: 2; background: var(--background); padding: 12px 0 6px; }
.col-head { display: flex; align-items: center; gap: 8px; padding: 0 4px; font-size: 12.5px; font-weight: 600; }
.col-head .count { font-weight: 500; color: var(--muted-foreground); font-size: 12px; }
.lane-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tone); flex: none; }
.swim-row { margin-top: 10px; }
.swim-head {
  display: flex; align-items: center; gap: 8px; width: 100%; height: 30px; padding: 0 6px; border: 0; border-radius: 8px;
  background: transparent; cursor: pointer; text-align: left; font-size: 13px; font-weight: 600;
}
.swim-head:hover { background: var(--accent); }
.swim-head:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
.swim-head .chev { color: var(--muted-foreground); transition: transform 120ms; }
.swim-row.collapsed .swim-head .chev { transform: rotate(-90deg); }
.swim-head .mini { font-weight: 400; font-size: 12px; color: var(--muted-foreground); display: inline-flex; gap: 10px; margin-left: 4px; }
.swim-head .mini span { display: inline-flex; align-items: center; gap: 5px; }
.swim-row.collapsed .swim-cells { display: none; }
.cell { background: var(--lane-bg); border: 1px solid var(--border); border-radius: 12px; padding: 6px; display: flex; flex-direction: column; gap: 6px; min-height: 52px; }
.cell:empty { background: transparent; border-style: dashed; }

.card {
  position: relative; background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 9px 11px 10px; display: flex; flex-direction: column; gap: 5px; cursor: pointer;
  box-shadow: var(--shadow-card); transition: border-color 120ms, box-shadow 120ms; flex: none;
}
.card:hover { border-color: color-mix(in srgb, var(--foreground) 20%, transparent); }
.card:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.card.is-active { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.card.is-changed { animation: card-flash 1400ms ease-out 1; }
@keyframes card-flash {
  0% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 45%, transparent); }
  100% { box-shadow: 0 0 0 0 transparent; }
}
.card-head { display: flex; align-items: center; gap: 6px; min-width: 0; }
.card-head .time { margin-left: auto; flex: none; font-size: 11.5px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.card-title { font-size: 13.5px; line-height: 1.35; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; min-width: 0; }
.status .dur { font-weight: 400; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.card-now { font-size: 12.5px; line-height: 1.45; color: var(--muted-foreground); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.asked {
  font-size: 12.5px; line-height: 1.45; border-radius: 8px; padding: 7px 9px;
  background: color-mix(in srgb, var(--tone) 9%, transparent);
  border: 1px solid color-mix(in srgb, var(--tone) 26%, transparent);
  color: var(--foreground);
}
.asked .q { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.asked .quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
.card-foot { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }

/* ---------- peek (side panel, popover look) ---------- */
.peek-panel {
  width: 400px; flex: none; margin: 8px 8px 8px 0; display: flex; min-height: 0;
  background: var(--popover); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-float); overflow: hidden;
  animation: panel-in 160ms var(--ease-drawer) 1;
}
.peek-panel.float { position: absolute; right: 0; top: 0; bottom: 0; z-index: 5; }
.peek-panel[hidden] { display: none; }
@keyframes panel-in { from { opacity: 0; transform: translateX(12px); } }

.peek { display: flex; flex-direction: column; flex: 1; min-height: 0; min-width: 0; }
.peek-scroll { flex: 1; overflow-y: auto; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
.peek-top { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted-foreground); min-width: 0; }
.peek-top .project { color: var(--foreground); font-weight: 500; white-space: nowrap; }
.peek-title { font-size: 16px; font-weight: 600; line-height: 1.35; margin: 6px 0 6px; }
.peek-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted-foreground); }
.sec-title { font-size: 11.5px; font-weight: 600; color: var(--muted-foreground); margin: 0 0 6px; display: flex; align-items: center; gap: 6px; }
.sec-title .tag { font-weight: 500; font-size: 10.5px; border: 1px solid var(--border); border-radius: 5px; padding: 0 5px; }
.summary-text { font-size: 13px; line-height: 1.55; margin: 0; }
.summary-list { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.55; }
.summary-list li + li { margin-top: 3px; }
.activity { display: flex; flex-direction: column; gap: 5px; }
.activity .tool-row { font-size: 12px; }
.pending-box {
  border: 1px solid color-mix(in srgb, var(--tone) 32%, transparent); background: color-mix(in srgb, var(--tone) 8%, transparent);
  border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; color: var(--foreground);
}
.pending-box .head { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; }
.pending-box .body { font-size: 13px; line-height: 1.5; }
.pending-box .actions { display: flex; gap: 6px; flex-wrap: wrap; }
.cmd {

  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; word-break: break-all;
}
.option-btn {
  display: flex; flex-direction: column; align-items: flex-start; gap: 1px; width: 100%; text-align: left;
  padding: 8px 10px; border-radius: 8px; border: 1px solid var(--input); background: var(--popover); cursor: pointer;
}
.option-btn:hover { border-color: var(--input-tone); }
.option-btn .l { font-size: 13px; font-weight: 500; }
.option-btn .d { font-size: 12px; color: var(--muted-foreground); }
.rows { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.rows .r { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 12px; min-width: 0; }
.rows .r + .r { border-top: 1px solid var(--border); }
.rows .path { font-family: var(--font-mono); font-size: 11.5px; flex: 1; direction: rtl; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.add { color: var(--success-foreground); font-variant-numeric: tabular-nums; }
.del { color: var(--error-foreground); font-variant-numeric: tabular-nums; }
.peek-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.peek-composer { border-top: 1px solid var(--border); padding: 10px 12px 12px; flex: none; }
.queued { font-size: 12px; color: var(--muted-foreground); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }

.composer {
  border: 1px solid var(--border); border-radius: 14px; background: var(--card); padding: 8px 8px 6px 12px;
  box-shadow: 0 1px 2px rgb(0 0 0 / 5%);
}
.composer:focus-within { border-color: color-mix(in srgb, var(--foreground) 25%, transparent); }
.composer textarea {
  display: block; width: 100%; resize: none; border: 0; outline: 0; background: transparent; color: var(--foreground);
  font: inherit; font-size: 14px; line-height: 1.45; min-height: 42px; padding: 2px 0;
}
.composer textarea::placeholder { color: var(--muted-foreground); }
.composer-row { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.model-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted-foreground); }
.send {
  width: 28px; height: 28px; border-radius: 50%; border: 0; background: var(--primary); color: var(--primary-foreground);
  display: grid; place-items: center; cursor: pointer;
}
.send:hover { background: color-mix(in srgb, var(--primary) 88%, var(--background)); }


/* ---------- new thread (stub) ---------- */
.new-thread { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; }
.new-thread h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.new-thread .thread-col { width: 100%; }
.project-pick { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
.settled-box { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted-foreground); border: 1px solid var(--border); border-radius: 12px; padding: 8px 10px 8px 12px; margin-bottom: 8px; }
.toast { display: flex; align-items: center; gap: 10px; pointer-events: auto; }
.lane-empty { border: 1px dashed var(--border); border-radius: 10px; padding: 16px 12px; text-align: center; font-size: 12px; color: var(--muted-foreground); }
.sb-folder-head .sb-folder-new { width: 22px; height: 22px; opacity: 0; }
.sb-folder:hover .sb-folder-new, .sb-folder-new:focus-visible { opacity: 1; }

/* ---------- toasts + prototype controls ---------- */
.toasts { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 95; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { background: var(--popover); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-size: 13px; box-shadow: var(--shadow-float); animation: pop-in 140ms ease-out 1; }
.proto {
  position: fixed; left: 8px; bottom: 52px; z-index: 90; width: 292px; max-height: calc(var(--app-h) - 32px); overflow-y: auto;
  background: var(--popover); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-float); font-size: 12px;
}
.proto-head { display: flex; align-items: center; gap: 6px; padding: 10px 10px 8px 12px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--popover); }
.proto-head b { font-size: 12.5px; }
.proto-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 9px; }
.proto-row label { display: block; font-size: 11px; color: var(--muted-foreground); margin-bottom: 4px; }
.proto-sim { display: flex; gap: 6px; }
.proto-sim .btn { flex: 1; }
.proto-note { font-size: 11px; color: var(--muted-foreground); line-height: 1.45; }
.proto.collapsed { width: 248px; }
.proto.collapsed .proto-head { gap: 4px; }
.proto.collapsed .proto-head { border-bottom: 0; padding: 6px 6px 6px 12px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0s !important; transition-duration: 0s !important; }
}
@media (max-width: 900px) {

const byId = (id) => S.threads.find((t) => t.id === id);
const NEEDS = new Set(["approval", "input", "failed", "limited"]);
const RUNNING = new Set(["preparing", "working", "waiting"]);

const LANES = [
  { id: "needs", name: "Needs you", tone: "tone-warning" },
  { id: "working", name: "Working", tone: "tone-info" },
  { id: "ready", name: "Ready for review", tone: "tone-success" },
];
const checksFailing = (t) => t.status === "ready" && t.pr?.state === "open" && t.pr.checks?.status === "failing";

// Done (merged or settled) threads leave the board; the sidebar still lists them.
function laneOf(t) {
  if (NEEDS.has(t.status) || checksFailing(t)) return "needs";
  if (RUNNING.has(t.status)) return "working";
  if (t.status === "ready") return "ready";
  return null;
}

function statusMeta(t) {
  switch (t.status) {
    case "preparing": return { label: "Setting up", icon: "dashed", tone: "tone-info", since: t.startedAt };
    case "working": return { label: "Working", icon: "working", tone: "tone-info", since: t.startedAt };
    case "waiting": return { label: "Waiting", icon: "dashed", tone: "tone-muted", since: t.startedAt };
    case "approval": return { label: "Approval", icon: "approval", tone: "tone-warning" };
    case "input": return { label: "Input", icon: "question", tone: "tone-input" };
    case "failed": return { label: "Failed", icon: "alert", tone: "tone-error" };
    case "limited": return { label: "Limited", icon: "alert", tone: "tone-warning" };
    case "ready": {
      const c = t.pr?.state === "open" ? t.pr.checks?.status : null;
      if (c === "failing") return { label: "Checks failing", icon: "xCircle", tone: "tone-error" };
      if (c === "running") return { label: "Checks running", icon: "dashed", tone: "tone-info" };
      return { label: "Ready", icon: "checkCircle", tone: "tone-success" };
    }
    default:
      return t.doneKind === "merged" ? { label: "Merged", icon: "merge", tone: "tone-merged" } : { label: "Settled", icon: "checkCheck", tone: "tone-muted" };
  }
}
// The grey line only says something the status doesn't: what a running agent is doing,
// or what a finished turn produced. Waiting cards show the request itself instead.
function cardLine(t) {
  if (RUNNING.has(t.status)) return S.set.summary === "llm" ? t.now.llm : t.now.state;
  if (t.status === "ready" && !checksFailing(t)) return S.set.summary === "llm" ? t.now.llm : t.summary.state || t.now.state;
  return "";
}

/* ================= simulation ================= */
function applyStep(t, step) {
  const prev = t.status;
  if (step.status) t.status = step.status;
  for (const k of ["now", "diff", "summary", "doneKind", "model"]) if (k in step) t[k] = step[k];
  t.pending = "pending" in step ? step.pending : NEEDS.has(t.status) ? t.pending : null;
  if (step.pr) t.pr = { ...(t.pr ?? {}), ...step.pr, checks: step.pr.checks ?? t.pr?.checks };
  if (step.activity) t.activity = [...t.activity, step.activity].slice(-6);
  if (RUNNING.has(t.status) && !RUNNING.has(prev)) t.startedAt = Date.now();
  t.lastAt = Date.now();
  S.flash.add(t.id);
  // A follow-up queued during the turn starts as soon as the turn ends.
  if (t.status === "ready" && t.queued.length) startFollowUp(t, t.queued.shift(), true);
}

function tick() {
  S.ticks++;
  if (S.ticks === 3 && !byId("t16")) {
    const t = spawnThread();
    S.threads.push(t);
    S.flash.add(t.id);
    toast("A scheduled task started a new thread in pocket");
    update();
    return;
  }
  const cands = S.threads.filter((t) => t.script.length && !NEEDS.has(t.status) && !checksFailing(t));
  if (!cands.length) {
    toast("Nothing left to simulate. Act on a card, or reset.");
    setPlaying(false);
    return;
  }
  const t = cands[Math.floor(Math.random() * cands.length)];
  applyStep(t, t.script.shift());
  update();
}
function setPlaying(on) {
  S.playing = on;
  clearInterval(S.timer);
  if (on) S.timer = setInterval(tick, 2600);
  renderProto();
}
function resume(t, step) {
  applyStep(t, step);
  t.script = [...(t.onResume ?? [genericReady()])];
  t.onResume = null;
}
const genericReady = () => ({ status: "ready", now: { state: "Turn finished", llm: "Finished your follow-up. Ready to review." }, activity: "Turn finished" });

function startFollowUp(t, text, fromQueue = false) {
  t.followups.push(text);
  const short = text.length > 70 ? text.slice(0, 68) + "…" : text;
  resume(t, { status: "working", pending: null, doneKind: null, now: { state: `Working on: “${short}”`, llm: `Following up on your note: ${short}` }, activity: fromQueue ? "Started queued follow-up" : "You sent a follow-up" });
}

function createThread(project, text) {
  const n = ++S.newCount;
  const title = text.length > 56 ? text.slice(0, 54).trimEnd() + "…" : text;
  const slug = text.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 28) || `thread-${n}`;
  const t = {

    startedAt: Date.now(), lastAt: Date.now(), prompt: text, source: null,

  },
  deny: (d) => {
    resume(byId(d.id), { status: "working", pending: null, now: { state: "Approval denied · looking for another way", llm: "You declined; the agent is trying another approach." }, activity: "You declined" });
  },
  answer: (d) => {
    const t = byId(d.id);
    const opt = t.pending.options[+d.idx];
    t.followups.push(opt.label);
    resume(t, { status: "working", pending: null, now: { state: `Continuing with “${opt.label}”`, llm: `Going with “${opt.label}”.` }, activity: `You answered: ${opt.label}` });
  },
  retry: (d) => resume(byId(d.id), { status: "preparing", pending: null, now: { state: "Retrying the turn", llm: "Retrying." }, activity: "You retried" }),
  "switch-model": (d) => {
    const t = byId(d.id);
    resume(t, { status: "working", pending: null, model: t.pending.alt, now: { state: `Continuing on ${t.pending.alt}`, llm: `Switched to ${t.pending.alt} and picked up where it stopped.` }, activity: `Switched to ${t.pending.alt}` });
  },
  "wait-limit": (d) => toast(`Resumes automatically at ${byId(d.id).pending.resets} (simulated)`),
  "fix-checks": (d) => {
    const t = byId(d.id);
    startFollowUp(t, `Fix the failing checks: ${t.pr.checks.failed.join(", ")}`);
  },
  stop: (d) => {
    const t = byId(d.id);
    t.script = [];
    applyStep(t, { status: "ready", now: { state: "Stopped by you", llm: "You stopped this turn." }, activity: "You stopped the turn" });
  },
  settle: (d) => {
    const t = byId(d.id);
    if (S.peekId === t.id) S.peekId = null;
    applyStep(t, { status: "done", doneKind: "settled", activity: "You settled the thread" });
    toast(`Settled “${t.title}”`, { label: "Undo", action: "reopen", id: t.id });
  },
  reopen: (d) => applyStep(byId(d.id), { status: "ready", doneKind: null, activity: "You reopened the thread" }),
  "open-pr": (d) => toast(`Opens PR #${byId(d.id).pr.number} in the browser (simulated)`),
  "create-pr": (d) => {
    const t = byId(d.id);
    const n = 42420 + Math.floor(Math.random() * 30);
    applyStep(t, { pr: { number: n, title: t.title, state: "open", checks: { status: "running", done: 0, total: 7, failed: [] } }, now: { state: `PR #${n} opened · checks running`, llm: `Opened PR #${n}; CI is running.` }, activity: `Opened PR #${n}` });
    t.script.push({ pr: { checks: { status: "passed", done: 7, total: 7, failed: [] } }, now: { state: `PR #${n} · all 7 checks passed`, llm: `CI is green on #${n}.` }, activity: `Checks passed on #${n}` });
  },
  send: (d) => send(d.id),
  filter: (d) => { S.filter = d.value; },
  set: (d) => {
    S.set[d.key] = d.value;
    saveSettings();
    if (d.key === "theme") applyTheme();
    renderProto();
  },
  tick: () => tick(),
  play: () => setPlaying(!S.playing),
  reset: () => {
    setPlaying(false);
    Object.assign(S, { threads: seed(), ticks: 0, newCount: 0, peekId: null, drafts: {}, currentId: "t1", filter: "all", query: "", collapsed: new Set() });
    const q = document.querySelector("#board-search");
    if (q) q.value = "";
    toast("Reset to the starting data");
  },
  "toggle-proto": () => { S.protoOpen = !S.protoOpen; renderProto(); },
  noop: (d) => toast(d.msg || "Not part of this prototype"),
};
// These actions render on their own; every other action re-renders after it runs.
const SELF_UPDATING = new Set(["toggle-board", "back", "back-to-board", "sidebar-thread", "new-thread", "tick", "send", "toggle-proto", "play"]);

function go(view) {
  S.view = view;
  if (view !== "board") S.peekId = null;
  if (view === "board") S.cameFromBoard = false;
  update();
  if (view === "board") requestAnimationFrame(() => document.querySelector("#swim [data-card]")?.focus({ preventScroll: true }));
}
function openThread(id) {
  S.currentId = id;
  S.cameFromBoard = true;
  S.peekId = null;
  S.view = "thread";
}
function send(id) {
  const text = (S.drafts[id] ?? "").trim();
  if (!text) return;
  S.drafts[id] = "";
  document.querySelectorAll(`[data-composer="${id}"]`).forEach((el) => (el.value = ""));
  if (id === "new") {
    const t = createThread(S.newProject, text);
    S.currentId = t.id;
    S.cameFromBoard = false;
    go("thread");
    return;
  }
  const t = byId(id);
  if (RUNNING.has(t.status)) {
    t.queued.push(text);
    S.flash.add(t.id);
    toast("Queued. It sends when this turn ends.");
  } else {
    startFollowUp(t, text);
  }
  update();
}

/* ================= rendering: shared bits ================= */
// Screen rect → stage coordinates (the stage may be scaled in embed mode).
function local(r) {
  const k = S.scale || 1;
  return { left: r.left / k, top: r.top / k };
}
function ensure(el, key, build) {
  if (!el || el.dataset.key === key) return false;
  el.dataset.key = key;
  el.innerHTML = build();
  return true;
}
const statusHtml = (t, withDur = true) => {
  const m = statusMeta(t);
  const d = withDur && m.since ? ` <span class="dur" data-since="${m.since}">${dur(Date.now() - m.since)}</span>` : "";
  return `<span class="status ${m.tone}">${icon(m.icon, "i-sm")}<span class="truncate">${m.label}</span>${d}</span>`;
};
const favHtml = (p) => `<span class="fav" style="--fav:${p.color}">${p.letter}</span>`;

function prChip(t) {
  if (!t.pr) return "";
  const c = t.pr.checks;
  const merged = t.pr.state === "merged";
  const prIcon = `<span class="${merged ? "tone-merged" : "tone-success"}" style="display:inline-flex">${icon(merged ? "merge" : "pr", "i-xs")}</span>`;
  let checks = "";
  if (!merged && c) {
    checks = c.status === "failing" ? ""
      : c.status === "running" ? ` <span class="tone-info">${c.done}/${c.total}</span>`
      : ` <span class="tone-success" style="display:inline-flex">${icon("check", "i-xs")}</span>`;
  }
  return `<span class="chip">${prIcon}#${t.pr.number}${checks}</span>`;
}
const diffChip = (t) => (t.diff ? `<span class="chip"><span class="add">+${t.diff.add}</span><span class="del">−${t.diff.del}</span></span>` : "");

function askedHtml(t) {
  const p = t.pending;
  let tone, body, btns;
  if (checksFailing(t)) {
    tone = "tone-error";
    body = `${t.pr.checks.failed.map((f) => `<code>${esc(f)}</code>`).join(" ")} failing on #${t.pr.number}`;
    btns = `<button class="btn btn-sm btn-primary" data-action="fix-checks" data-id="${t.id}">Fix checks</button><button class="btn btn-sm" data-action="open-pr" data-id="${t.id}">Open PR</button>`;
  } else if (!p) {
    return "";
  } else if (p.kind === "approval") {
    tone = "tone-warning";
    body = `<code>${esc(p.command.split("\n")[0].replace(/\s*\\$/, ""))}</code>`;
    btns = `<button class="btn btn-sm btn-primary" data-action="approve" data-id="${t.id}">Approve</button><button class="btn btn-sm" data-action="deny" data-id="${t.id}">Deny</button>`;
  } else if (p.kind === "input") {
    tone = "tone-input"; body = esc(p.question);
    btns = p.options.map((o, i) => `<button class="btn btn-sm" data-action="answer" data-id="${t.id}" data-idx="${i}">${esc(o.label)}</button>`).join("");
  } else if (p.kind === "failed") {
    tone = "tone-error"; body = fmt(p.message);
    btns = `<button class="btn btn-sm" data-action="retry" data-id="${t.id}">${icon("reset", "i-xs")}Retry</button>`;
  } else {
    tone = "tone-warning"; body = `${esc(p.message)} Resets at ${esc(p.resets)}.`;
    btns = `<button class="btn btn-sm" data-action="switch-model" data-id="${t.id}">Continue on ${esc(p.alt)}</button>`;
  }
  return `<div class="asked ${tone}"><div class="q">${body}</div><div class="quick">${btns}</div></div>`;
}

/* ================= sidebar ================= */
function renderSidebar() {
  const el = document.getElementById("sidebar");
  const keepScroll = el.querySelector(".sb-scroll")?.scrollTop ?? 0;
  const onBoard = S.view === "board";
  const needs = S.threads.filter((t) => laneOf(t) === "needs").length;
  const working = S.threads.filter((t) => RUNNING.has(t.status)).length;
  const folders = PROJECT_ORDER.map((pid) => {
    const p = PROJECTS[pid];
    const rows = S.threads.filter((t) => t.project === pid).sort((a, b) => b.lastAt - a.lastAt).map((t) => {
      const active = S.view === "thread" && t.id === S.currentId;
      let trail;
      if (t.status === "ready") trail = `<span class="sb-status tone-success">${icon("checkCircle", "i-xs")}Done</span>`;
      else if (t.status === "done") trail = `<span class="sb-time">${rel(t.lastAt)}</span>`;
      else { const m = statusMeta(t); trail = `<span class="sb-status ${m.tone}">${icon(m.icon, "i-xs")}${m.label}</span>`; }
      return `<button class="sb-row ${active ? "active" : ""} ${t.status === "done" ? "recede" : ""}" data-action="sidebar-thread" data-id="${t.id}"><span class="sb-title">${esc(t.title)}</span>${trail}</button>`;
    }).join("");
    return `<div class="sb-folder"><div class="sb-folder-head">${favHtml(p)}<span class="spacer">${p.name}</span><button class="btn btn-ghost btn-icon btn-sm sb-folder-new" data-action="new-thread" data-project="${pid}" title="New thread in ${p.name}">${icon("pen", "i-xs")}</button></div>${rows}</div>`;
  }).join("");
  const boardBtn = `<button class="sb-util is-new" data-action="toggle-board" title="Board (${MOD}⇧B)" aria-label="Board">${icon("board")}${needs ? `<span class="badge-count">${needs}</span>` : ""}</button>`;
  const boardRow = `<button class="sb-board-row ${onBoard ? "on" : ""}" data-action="toggle-board" title="Board (${MOD}⇧B)">${icon("board")}<span>Board</span><span class="spacer"></span>${needs ? `<span class="sb-status tone-warning">${needs} need you</span>` : ""}<span class="sb-time">${working} running</span></button>`;
  // Like the Pull requests page: on the board, the footer's utility icons become "Back".
  const footer = onBoard
    ? `<button class="sb-row" data-action="back">${icon("arrowLeft", "i-sm")}<span class="sb-title">Back</span></button>`
    : `${S.set.entry === "icon" ? boardBtn : ""}
      <button class="sb-util" data-action="noop" title="Settings">${icon("settings")}</button>
      <button class="sb-util" data-action="noop" title="Pull requests">${icon("pr")}</button>
      <button class="sb-util" data-action="noop" title="Issues">${icon("issue")}</button>
      <button class="sb-util" data-action="noop" title="Usage">${icon("usage")}</button>`;
  el.innerHTML = `
    <div class="sb-header"><span class="sb-brand">T3 Code<small>fork</small></span><span class="spacer"></span>
      <button class="btn btn-ghost btn-icon btn-sm" data-action="new-thread" title="New thread">${icon("pen")}</button></div>
    <div class="sb-scroll">${folders}</div>
    ${S.set.entry === "row" ? boardRow : ""}
    <div class="sb-footer">${footer}</div>`;
  el.querySelector(".sb-scroll").scrollTop = keepScroll;
}

/* ================= board ================= */
function boardShellHtml() {
  return `<div class="board">
    <header class="board-header">
      <div class="board-title">${icon("board")}Board</div>
      <div class="filters" id="board-filters"></div>
      <span class="spacer"></span>
      <label class="search">${icon("search", "i-sm")}<input id="board-search" placeholder="Filter threads" value="${esc(S.query)}" /></label>
    </header>
    <div class="board-body">
      <div class="swim-scroll" id="swim-scroll"><div class="swim" id="swim"></div></div>
      <aside class="peek-panel" id="peek-panel" hidden></aside>
    </div>
  </div>`;
}
function boardThreads() {
  const q = S.query.trim().toLowerCase();
  return S.threads.filter((t) => laneOf(t) && (S.filter === "all" || t.project === S.filter) && (!q || `${t.title} ${PROJECTS[t.project].name} ${t.branch}`.toLowerCase().includes(q)));
}
function cardHtml(t) {
  const line = cardLine(t);
  const queued = t.queued.length ? `<span class="chip"><span class="tone-info">${t.queued.length} queued</span></span>` : "";
  const source = t.source ? `<span class="chip" title="${esc(t.source)}">${icon("calendar", "i-xs")}Scheduled</span>` : "";
  const foot = prChip(t) + diffChip(t) + queued + source;
  return `<div class="card ${S.peekId === t.id ? "is-active" : ""} ${S.flash.has(t.id) ? "is-changed" : ""}" data-card="${t.id}" tabindex="0" role="button" aria-label="${esc(t.title)}">
    <div class="card-head">${statusHtml(t)}<span class="time" data-rel="${t.lastAt}">${rel(t.lastAt)}</span></div>
    <div class="card-title">${esc(t.title)}</div>
    ${line ? `<div class="card-now">${fmt(line)}</div>` : ""}
    ${laneOf(t) === "needs" ? askedHtml(t) : ""}
    ${foot ? `<div class="card-foot">${foot}</div>` : ""}
  </div>`;
}
function swimHtml() {
  const threads = boardThreads();
  const byLane = (list, lane) => {
    const out = list.filter((t) => laneOf(t) === lane);
    // Needs you: oldest wait first (a queue). Other lanes: most recent first.
    return out.sort((a, b) => (lane === "needs" ? a.lastAt - b.lastAt : b.lastAt - a.lastAt));
  };
  const cols = `<div class="swim-cols swim-grid">${LANES.map((l) => `<div class="col-head"><span class="lane-dot ${l.tone}"></span>${l.name}<span class="count">${threads.filter((t) => laneOf(t) === l.id).length}</span></div>`).join("")}</div>`;
  const rows = PROJECT_ORDER.map((pid) => {
    const list = threads.filter((t) => t.project === pid);
    if (!list.length) return "";
    const p = PROJECTS[pid];
    const collapsed = S.collapsed.has(pid);
    const mini = LANES.map((l) => { const n = byLane(list, l.id).length; return n ? `<span><span class="lane-dot ${l.tone}"></span>${n}</span>` : ""; }).join("");
    const cells = LANES.map((l) => `<div class="cell" data-lane="${l.id}">${byLane(list, l.id).map(cardHtml).join("")}</div>`).join("");
    return `<section class="swim-row ${collapsed ? "collapsed" : ""}" data-project="${pid}">
      <button class="swim-head" data-action="toggle-row" data-project="${pid}" aria-expanded="${!collapsed}">${icon("chevronDown", "i-sm chev")}${favHtml(p)}${p.name}<span class="mini">${mini}</span></button>
      <div class="swim-cells swim-grid">${cells}</div>
    </section>`;
  }).join("");
  return cols + (rows || `<div class="lane-empty" style="margin-top:16px">No threads match.</div>`);
}
function updateBoardHeader() {
  const box = document.getElementById("board-filters");
  if (!box) return;
  const live = S.threads.filter((t) => laneOf(t));
  const chip = (value, label, count, fav = "") => `<button class="chip-btn ${S.filter === value ? "on" : ""}" data-action="filter" data-value="${value}">${fav}${label}<span class="n">${count}</span></button>`;
  box.innerHTML = chip("all", "All projects", live.length) + PROJECT_ORDER.map((pid) => chip(pid, PROJECTS[pid].name, live.filter((t) => t.project === pid).length, favHtml(PROJECTS[pid]))).join("");
}
function updateSwim() {
  const swim = document.getElementById("swim");
  if (!swim) return;
  const animate = S.flash.size > 0 && !matchMedia("(prefers-reduced-motion: reduce)").matches;
  const before = new Map();
  if (animate) swim.querySelectorAll("[data-card]").forEach((el) => before.set(el.dataset.card, local(el.getBoundingClientRect())));
  const focused = document.activeElement?.closest?.("#swim [data-card]")?.dataset.card;
  swim.innerHTML = swimHtml();
  if (focused) swim.querySelector(`[data-card="${focused}"]`)?.focus({ preventScroll: true });
  S.flash.clear();
  if (!animate || !before.size) return;
  // FLIP: cards slide from where they were to their new lane, once.
  swim.querySelectorAll("[data-card]").forEach((el) => {
    const b = before.get(el.dataset.card);
    const a = local(el.getBoundingClientRect());
    if (!b) { el.animate([{ opacity: 0, transform: "scale(0.97)" }, { opacity: 1, transform: "none" }], { duration: 220, easing: "ease-out" }); return; }
    const dx = b.left - a.left, dy = b.top - a.top;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
    el.style.zIndex = "1";
    const anim = el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "none" }], { duration: 340, easing: "cubic-bezier(0.32, 0.72, 0, 1)" });
    anim.onfinish = () => (el.style.zIndex = "");
  });
}

/* ================= peek ================= */
function pendingHtml(t) {
  const p = t.pending;
  if (checksFailing(t)) {
    return `<div class="pending-box tone-error"><div class="head tone-error">${icon("xCircle", "i-sm")}Checks failing on #${t.pr.number}</div>
      <div class="body">${t.pr.checks.failed.map((f) => `<code>${esc(f)}</code>`).join(" ")} failed. ${t.pr.checks.total - t.pr.checks.failed.length} other checks passed.</div>
      <div class="actions"><button class="btn btn-sm btn-primary" data-action="fix-checks" data-id="${t.id}">Ask the agent to fix them</button><button class="btn btn-sm" data-action="open-pr" data-id="${t.id}">Open PR</button></div></div>`;
  }
  if (!p) return "";
  if (p.kind === "approval") {
    return `<div class="pending-box tone-warning"><div class="head tone-warning">${icon("approval", "i-sm")}${esc(p.title)}</div>
      <div class="cmd">${esc(p.command)}</div><div class="body" style="color:var(--muted-foreground)">${esc(p.reason)}</div>
      <div class="actions"><button class="btn btn-sm btn-primary" data-action="approve" data-id="${t.id}">Approve</button><button class="btn btn-sm" data-action="approve" data-mode="always" data-id="${t.id}">Approve for this session</button><span class="spacer"></span><button class="btn btn-sm btn-danger" data-action="deny" data-id="${t.id}">Deny</button></div></div>`;
  }
  if (p.kind === "input") {
    return `<div class="pending-box tone-input"><div class="head tone-input">${icon("question", "i-sm")}Question</div><div class="body">${esc(p.question)}</div>
      <div style="display:flex;flex-direction:column;gap:6px">${p.options.map((o, i) => `<button class="option-btn" data-action="answer" data-id="${t.id}" data-idx="${i}"><span class="l">${esc(o.label)}</span><span class="d">${esc(o.detail)}</span></button>`).join("")}</div>
      <div class="body" style="font-size:12px;color:var(--muted-foreground)">Or type your own answer below.</div></div>`;
  }
  if (p.kind === "failed") {

      <div class="actions"><button class="btn btn-sm btn-primary" data-action="retry" data-id="${t.id}">${icon("reset", "i-xs")}Retry</button></div></div>`;
  }
  return `<div class="pending-box tone-warning"><div class="head tone-warning">${icon("clock", "i-sm")}Usage limit</div><div class="body">${esc(p.message)} Resets at ${esc(p.resets)}.</div>
    <div class="actions"><button class="btn btn-sm btn-primary" data-action="switch-model" data-id="${t.id}">Continue on ${esc(p.alt)}</button><button class="btn btn-sm" data-action="wait-limit" data-id="${t.id}">Wait for reset</button></div></div>`;
}
function summaryHtml(t) {
  if (S.set.summary === "llm") {
    return `<div><div class="sec-title">Summary <span class="tag">${icon("sparkle", "i-xs")} generated</span></div><ul class="summary-list">${t.summary.llm.map((s) => `<li>${fmt(s)}</li>`).join("")}</ul></div>`;
  }
  return t.summary.state ? `<div><div class="sec-title">Last message from the agent</div><p class="summary-text">${fmt(t.summary.state)}</p></div>` : "";
}
function activityHtml(t) {
  return `<div><div class="sec-title">Recent activity</div><div class="activity">${t.activity.slice(-4).reverse().map((a) => `<div class="tool-row">${icon(a.startsWith("You") ? "user" : a.startsWith("Ran") || a.startsWith("Asked to run") ? "terminal" : "file", "i-xs")}<span class="truncate">${esc(a)}</span></div>`).join("")}</div></div>`;
}
function changesHtml(t) {
  let out = "";

    const c = t.pr.checks;
    const checkRows = c && t.pr.state !== "merged"
      ? (c.status === "failing" ? c.failed.map((f) => `<div class="r">${icon("xCircle", "i-xs tone-error")}<span class="mono" style="font-size:11.5px">${esc(f)}</span><span class="spacer"></span><span class="tone-error">failed</span></div>`).join("") + `<div class="r">${icon("checkCircle", "i-xs tone-success")}<span>${c.total - c.failed.length} other checks passed</span></div>`
        : c.status === "running" ? `<div class="r">${icon("dashed", "i-xs tone-info")}<span>${c.done} of ${c.total} checks done</span></div>`
        : `<div class="r">${icon("checkCircle", "i-xs tone-success")}<span>All ${c.total} checks passed</span></div>`)
      : `<div class="r">${icon("merge", "i-xs tone-merged")}<span>Merged</span></div>`;
    out += `<div><div class="sec-title">Pull request</div><div class="rows"><div class="r">${icon(t.pr.state === "merged" ? "merge" : "pr", "i-xs " + (t.pr.state === "merged" ? "tone-merged" : "tone-success"))}<span class="truncate" style="font-weight:500">#${t.pr.number} ${esc(t.pr.title)}</span></div>${checkRows}</div></div>`;
  }
  if (t.diff) {
    out += `<div><div class="sec-title">Changes <span class="add">+${t.diff.add}</span><span class="del">−${t.diff.del}</span></div><div class="rows">${t.diff.files.map((f) => `<div class="r"><span class="path">&lrm;${esc(f[0])}</span><span class="add">+${f[1]}</span><span class="del">−${f[2]}</span></div>`).join("")}</div></div>`;
  }
  return out;
}
function peekActionsHtml(t) {
  const b = [];
  if (RUNNING.has(t.status)) b.push(`<button class="btn btn-sm" data-action="stop" data-id="${t.id}">${icon("stop", "i-xs")}Stop</button>`);
  if (t.pr && t.pr.state !== "merged" && !checksFailing(t)) b.push(`<button class="btn btn-sm" data-action="open-pr" data-id="${t.id}">${icon("pr", "i-xs")}Open PR</button>`);
  if (t.status === "ready" && t.diff && !t.pr) b.push(`<button class="btn btn-sm" data-action="create-pr" data-id="${t.id}">${icon("pr", "i-xs")}Create PR</button>`);
  if (t.status === "ready") b.push(`<button class="btn btn-sm" data-action="settle" data-id="${t.id}" title="Marks it done and takes it off the board">${icon("checkCheck", "i-xs")}Settle</button>`);
  return b.length ? `<div class="peek-actions">${b.join("")}</div>` : "";
}
function composerPlaceholder(t) {
  if (!t) return "Describe what you want done…";
  if (RUNNING.has(t.status)) return "Queue a follow-up…";
  if (t.status === "approval") return "Deny with instructions…";
  if (t.status === "input") return "Type your own answer…";
  if (t.status === "done") return "Reopen with a follow-up…";
  return "Send a follow-up…";
}
const composerHtml = (id, t) => `<div class="composer"><textarea data-composer="${id}" rows="2" placeholder="${composerPlaceholder(t)}">${esc(S.drafts[id] ?? "")}</textarea>
  <div class="composer-row"><span class="model-chip">${icon("sparkle", "i-xs")}<span data-model="${id}">${esc(t?.model ?? "Claude · Opus 5.5")}</span></span><span class="spacer"></span><button class="send" data-action="send" data-id="${id}" aria-label="Send">${icon("arrowUp", "i-sm")}</button></div></div>`;

function peekShellHtml(t) {
  return `<div class="peek" data-peek="${t.id}"><div class="peek-scroll" id="peek-scroll"></div><div class="peek-composer"><div id="peek-queued"></div>${composerHtml(t.id, t)}</div></div>`;
}
function updatePeekBody(t) {
  const scroll = document.getElementById("peek-scroll");
  if (!scroll) return;
  const p = PROJECTS[t.project];
  const keepTop = scroll.scrollTop;
  scroll.innerHTML = `
    <div>
      <div class="peek-top">${favHtml(p)}<span class="project">${p.name}</span>${icon("branch", "i-xs")}<span class="mono truncate" style="font-size:11px">${esc(t.branch)}</span><span class="spacer"></span>
        <button class="btn btn-sm" data-action="open-thread" data-id="${t.id}" title="Open the full thread (${MOD}-click a card)">Open thread${icon("arrowUpRight", "i-xs")}</button>
        <button class="btn btn-ghost btn-icon btn-sm" data-action="close-peek" title="Close (Esc)">${icon("x", "i-sm")}</button></div>
      <div class="peek-title">${esc(t.title)}</div>
      <div class="peek-meta">${statusHtml(t)}<span>·</span><span>updated <span data-rel="${t.lastAt}">${rel(t.lastAt)}</span> ago</span><span>·</span><span>${esc(t.model)}</span></div>
      ${t.source ? `<div class="peek-meta" style="margin-top:4px">${icon("calendar", "i-xs")}${esc(t.source)}</div>` : ""}
    </div>
    ${pendingHtml(t)}
    ${summaryHtml(t)}
    ${changesHtml(t)}
    ${activityHtml(t)}
    ${peekActionsHtml(t)}`;
  scroll.scrollTop = keepTop;
  const q = document.getElementById("peek-queued");
  if (q) q.innerHTML = t.queued.length ? `<div class="queued">${icon("clock", "i-xs")}${t.queued.length} follow-up queued: “${esc(t.queued[0])}”</div>` : "";
  document.querySelectorAll(`[data-composer="${t.id}"]`).forEach((ta) => (ta.placeholder = composerPlaceholder(t)));
  document.querySelectorAll(`[data-model="${t.id}"]`).forEach((m) => (m.textContent = t.model));
}
function renderPeek() {
  const panel = document.getElementById("peek-panel");
  if (!panel) return;
  const t = S.peekId && S.view === "board" ? byId(S.peekId) : null;
  panel.classList.toggle("float", S.set.peekLayout === "float");
  panel.hidden = !t;
  if (!t) { panel.dataset.key = ""; panel.innerHTML = ""; return; }
  ensure(panel, `peek:${t.id}`, () => peekShellHtml(t));
  updatePeekBody(t);
}

/* ================= thread view and new thread (stubs) ================= */
function threadShellHtml(t) {
  return `<div class="thread-view">
    <header class="topbar" id="thread-top"></header>
    <div class="thread-scroll"><div class="thread-col"><div class="msgs" id="thread-msgs"></div></div></div>
    <div class="thread-bottom"><div class="thread-col"><div id="thread-pending"></div>${composerHtml(t.id, t)}</div></div>
  </div>`;
}
function updateThreadView(t) {
  const p = PROJECTS[t.project];
  const top = document.getElementById("thread-top");
  if (!top) return;
  top.innerHTML = `${S.cameFromBoard ? `<button class="btn btn-ghost btn-sm" data-action="back-to-board">${icon("arrowLeft", "i-sm")}Board</button><span class="crumb">/</span>` : ""}
    <span class="crumb">${favHtml(p)}${p.name}</span><span class="crumb">/</span><span class="title truncate">${esc(t.title)}</span>${statusHtml(t)}
    <span class="spacer"></span><span class="crumb mono" style="font-size:11.5px">${icon("branch", "i-xs")}${esc(t.branch)}</span><span class="stub-tag">thread view · stub</span>`;
  const msgs = [`<div class="msg-user">${esc(t.prompt)}</div>`];
  t.activity.slice(0, -1).forEach((a) => msgs.push(`<div class="tool-row">${icon(a.startsWith("Ran") ? "terminal" : "file", "i-xs")}${esc(a)}</div>`));
  if (t.summary.state) msgs.push(`<div class="msg-assistant">${fmt(t.summary.state)}</div>`);
  if (t.diff) msgs.push(`<div class="rows"><div class="r" style="font-weight:500">${icon("file", "i-xs")}${t.diff.files.length} files changed <span class="add">+${t.diff.add}</span><span class="del">−${t.diff.del}</span></div></div>`);
  t.followups.forEach((f) => msgs.push(`<div class="msg-user">${esc(f)}</div>`));
  if (RUNNING.has(t.status)) msgs.push(`<div class="tool-row tone-info">${icon("working", "i-xs")}${fmt(t.now.state)}</div>`);
  document.getElementById("thread-msgs").innerHTML = msgs.join("");
  const m = statusMeta(t);
  document.getElementById("thread-pending").innerHTML = t.status === "done"
    ? `<div class="settled-box">${icon(m.icon, "i-sm " + m.tone)}<span class="spacer">${m.label}. It's off the board.</span><button class="btn btn-sm" data-action="reopen" data-id="${t.id}">${icon("undo", "i-xs")}Reopen</button></div>`
    : pendingHtml(t);
  document.querySelectorAll(`[data-composer="${t.id}"]`).forEach((ta) => (ta.placeholder = composerPlaceholder(t)));
}
function newThreadHtml() {
  return `<div class="thread-view">
    <header class="topbar"><span class="title">New thread</span><span class="spacer"></span><span class="stub-tag">existing flow · stub</span></header>
    <div class="new-thread"><h2>What should we build?</h2><div class="project-pick" id="project-pick"></div>
      <div class="thread-col" style="max-width:46rem">${composerHtml("new", null)}</div></div>
  </div>`;
}

/* ================= top-level render ================= */
function renderMain() {
  const main = document.getElementById("main");
  if (S.view === "board") {
    ensure(main, "board", boardShellHtml);
  } else if (S.view === "new") {
    ensure(main, "new", newThreadHtml);
    document.getElementById("project-pick").innerHTML = PROJECT_ORDER.map((pid) => `<button class="chip-btn ${S.newProject === pid ? "on" : ""}" data-action="pick-project" data-project="${pid}">${favHtml(PROJECTS[pid])}${PROJECTS[pid].name}</button>`).join("");
  } else {
    const t = byId(S.currentId);
    ensure(main, `thread:${t.id}`, () => threadShellHtml(t));
    updateThreadView(t);
  }
}
function update() {
  renderSidebar();
  renderMain();
  renderPeek();
  updateBoardHeader();
  updateSwim();
}
function applyTheme() {
  const v = S.set.theme;
  if (v === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", v);
}

/* ================= prototype controls ================= */
function seg(key, opts) {
  return `<div class="seg">${opts.map(([v, l]) => `<button class="${S.set[key] === v ? "on" : ""}" data-action="set" data-key="${key}" data-value="${v}">${l}</button>`).join("")}</div>`;
}
function renderProto() {
  const root = document.getElementById("proto-root");
  const sim = `<button class="btn btn-sm" data-action="tick" title="Advance one thread">${icon("step", "i-xs")}Step</button>
    <button class="btn btn-sm ${S.playing ? "btn-primary" : ""}" data-action="play">${icon(S.playing ? "pause" : "play", "i-xs")}${S.playing ? "Pause" : "Play"}</button>`;
  if (!S.protoOpen) {
    root.innerHTML = `<div class="proto collapsed"><div class="proto-head">${icon("sliders", "i-sm")}<b>Prototype</b>${sim}<button class="btn btn-ghost btn-icon btn-sm" data-action="toggle-proto" title="Expand">${icon("chevronUp", "i-sm")}</button></div></div>`;
    return;
  }
  root.innerHTML = `<div class="proto"><div class="proto-head">${icon("sliders", "i-sm")}<b>Prototype</b><span class="spacer"></span><button class="btn btn-ghost btn-icon btn-sm" data-action="toggle-proto" title="Collapse">${icon("chevronDown", "i-sm")}</button></div>
    <div class="proto-body">
      <div class="proto-row"><label>Live simulation</label><div class="proto-sim">${sim}<button class="btn btn-sm" data-action="reset" title="Reset data">${icon("reset", "i-xs")}</button></div></div>
      <div class="proto-row"><label>Peek panel</label>${seg("peekLayout", [["push", "Pushes lanes"], ["float", "Floats over lanes"]])}</div>
      <div class="proto-row"><label>Entry point</label>${seg("entry", [["icon", "Footer icon"], ["row", "Sidebar row"]])}</div>
      <div class="proto-row"><label>Grey line comes from</label>${seg("summary", [["state", "Thread state"], ["llm", "LLM summary"]])}</div>
      <div class="proto-row"><label>Theme</label>${seg("theme", [["system", "System"], ["light", "Light"], ["dark", "Dark"]])}</div>
      <div class="proto-note">Click a card to peek. ${MOD}-click opens the thread. Arrow keys move between cards, Enter peeks, ${MOD}+Enter opens, Esc closes the peek. ${MOD}⇧B toggles the board. Start a thread from the sidebar's pen buttons.</div>
    </div></div>`;
}

/* ================= toasts ================= */
function toast(msg, act) {
  const box = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<span>${esc(msg)}</span>${act ? `<button class="btn btn-sm" data-action="${act.action}" data-id="${act.id}">${esc(act.label)}</button>` : ""}`;
  box.appendChild(el);
  setTimeout(() => el.remove(), act ? 5000 : 2600);
}

/* ================= events ================= */
document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-action]");
  if (a) {
    const fn = ACTIONS[a.dataset.action];
    if (fn) {
      fn(a.dataset, e);
      if (a.closest(".toast")) a.closest(".toast").remove();
      if (!SELF_UPDATING.has(a.dataset.action)) update();
    }
    return;
  }
  const card = e.target.closest("[data-card]");
  if (card) {
    const id = card.dataset.card;
    if (e.metaKey || e.ctrlKey) openThread(id);
    else S.peekId = S.peekId === id ? null : id;
    update();
  }
});
document.addEventListener("input", (e) => {
  if (e.target.dataset.composer) S.drafts[e.target.dataset.composer] = e.target.value;
  if (e.target.id === "board-search") { S.query = e.target.value; updateBoardHeader(); updateSwim(); }
});
document.addEventListener("keydown", (e) => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.shiftKey && e.key.toLowerCase() === "b") { e.preventDefault(); go(S.view === "board" ? "thread" : "board"); return; }
  if (e.target.dataset?.composer && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(e.target.dataset.composer); return; }
  if (e.key === "Escape" && S.peekId) {
    const id = S.peekId;
    S.peekId = null;
    update();
    document.querySelector(`#swim [data-card="${id}"]`)?.focus({ preventScroll: true });
    return;
  }
  const card = e.target.closest?.("#swim [data-card]");
  if (!card || e.target !== card) return;
  const id = card.dataset.card;
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    if (mod) openThread(id); else S.peekId = S.peekId === id ? null : id;
    update();
    return;
  }
  // Grid of visible swimlane rows × lanes. Up/down walk a lane across projects.
  const rows = [...document.querySelectorAll("#swim .swim-row:not(.collapsed)")].map((r) => [...r.querySelectorAll(".cell")].map((c) => [...c.querySelectorAll("[data-card]")]));
  let ri = -1, ci = -1, k = -1;
  rows.forEach((r, i) => r.forEach((c, j) => { const x = c.indexOf(card); if (x >= 0) { ri = i; ci = j; k = x; } }));
  if (ri < 0) return;
  let next = null;
  if (e.key === "ArrowDown") {
    next = rows[ri][ci][k + 1];
    for (let i = ri + 1; !next && i < rows.length; i++) next = rows[i][ci][0];
  }
  if (e.key === "ArrowUp") {
    next = rows[ri][ci][k - 1];
    for (let i = ri - 1; !next && i >= 0; i--) next = rows[i][ci].at(-1);
  }
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    const step = e.key === "ArrowRight" ? 1 : -1;
    for (let j = ci + step; j >= 0 && j < LANES.length; j += step) if (rows[ri][j].length) { next = rows[ri][j][Math.min(k, rows[ri][j].length - 1)]; break; }
  }
  if (next) {
    e.preventDefault();
    next.focus();
    next.scrollIntoView({ block: "nearest", inline: "nearest" });
    if (S.peekId) { S.peekId = next.dataset.card; update(); }
  }
});
setInterval(() => {
  const now = Date.now();
  document.querySelectorAll("[data-since]").forEach((el) => (el.textContent = dur(now - +el.dataset.since)));
  document.querySelectorAll("[data-rel]").forEach((el) => (el.textContent = rel(+el.dataset.rel)));
}, 1000);

const EMBED_W = 1280, EMBED_H = 800;
function fitStage() {
  const root = document.documentElement;
  // Narrow frames (inline previews, small windows) get the desktop layout scaled down.
  // The frame's own width: preview hosts may pad <html>.
  const width = document.getElementById("frame").clientWidth;
  const embed = width < 1000;
  root.classList.toggle("embed", embed);
  S.scale = embed ? width / EMBED_W : 1;
  root.style.setProperty("--s", S.scale);
  root.style.setProperty("--app-h", `${embed ? EMBED_H : innerHeight}px`);
  document.getElementById("frame").style.height = embed ? `${Math.ceil(EMBED_H * S.scale)}px` : "";
}
addEventListener("resize", fitStage);
fitStage();
applyTheme();
update();
renderProto();
</script>
</body>
</html>
